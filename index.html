async function doImport(file) {
  try {
    const text = await file.text();
    let data;
    if (text.startsWith("GIA_ENCRYPTED:")) {
      const encrypted = text.slice("GIA_ENCRYPTED:".length);
      const password = prompt("This backup is encrypted. Enter password:");
      if (!password) return;
      const decrypted = xorDecExport(encrypted, password);
      if (!decrypted) {
        toast("⚠ Wrong password or corrupted file");
        return;
      }
      try {
        data = JSON.parse(decrypted);
      } catch {
        toast("⚠ Decryption succeeded but file is not valid JSON");
        return;
      }
    } else {
      data = JSON.parse(text);
    }
    if (!data.prompts) {
      toast("⚠ Invalid backup file — no prompts found");
      return;
    }
    const confirmMerge = confirm(`Import ${data.prompts.length} prompts? Duplicates (by ID) will be skipped.`);
    if (!confirmMerge) return;
    const existIds = new Set(S.prompts.map(p => p.id));
    let added = 0;
    for (const p of data.prompts) {
      if (!existIds.has(p.id)) {
        delete p._search;
        await db.savePrompt(p);
        S.prompts.push(p);
        added++;
      }
    }
    if (data.categories) {
      for (const cat of data.categories) {
        const existingCustom = S.customCats.find(c => c.id === cat.id);
        if (existingCustom) {
          Object.assign(existingCustom, cat);
          await db.saveCat(existingCustom);
        } else if (DEFAULT_CATS.some(d => d.id === cat.id)) {
          await db.saveCat(cat);
          S.customCats.push(cat);
        } else {
          await db.saveCat(cat);
          S.customCats.push(cat);
        }
      }
    }
    renderSidebar();
    renderContent();
    toast(`✓ Imported ${added} new prompt${added !== 1 ? "s" : ""}`);
  } catch (e) {
    toast("⚠ Failed to parse file — is it a valid GIA backup?");
  }
}

let autosaveIntervalId = null;

let autosaveDirHandle = null;

function sanitizeFilename(name) {
  const cleaned = (name || "").trim().replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").slice(0, 100);
  return cleaned || "GIA_autosave";
}

async function getAutosaveSettings() {
  return {
    enabled: !!await db.getSetting("autosaveEnabled"),
    onPromptSave: !!await db.getSetting("autosaveOnPromptSave"),
    onInterval: !!await db.getSetting("autosaveOnInterval"),
    intervalMinutes: await db.getSetting("autosaveIntervalMinutes") || 10,
    fileName: await db.getSetting("autosaveFileName") || "GIA_autosave",
    encrypt: !!await db.getSetting("autosaveEncrypt"),
    password: await db.getSetting("autosavePassword") || ""
  };
}

async function loadAutosaveDirHandle() {
  try {
    const stored = await db.getSetting("autosaveDirHandle");
    if (stored && typeof stored.queryPermission === "function") {
      const perm = await stored.queryPermission({
        mode: "readwrite"
      });
      autosaveDirHandle = perm === "granted" ? stored : null;
    } else {
      autosaveDirHandle = null;
    }
  } catch (e) {
    autosaveDirHandle = null;
  }
}

async function chooseAutosaveFolder() {
  if (!("showDirectoryPicker" in window)) {
    toast("⚠ Your browser does not support folder auto-save");
    return null;
  }
  try {
    const handle = await window.showDirectoryPicker({
      mode: "readwrite"
    });
    const perm = await handle.requestPermission({
      mode: "readwrite"
    });
    if (perm !== "granted") {
      toast("⚠ Permission denied");
      return null;
    }
    await db.setSetting("autosaveDirHandle", handle);
    autosaveDirHandle = handle;
    return handle;
  } catch (e) {
    return null;
  }
}

async function performAutoSave() {
  const cfg = await getAutosaveSettings();
  const data = {
    _app: "GIA",
    _version: 2,
    exportedAt: Date.now(),
    prompts: S.prompts,
    categories: S.customCats,
    _autosave: true
  };
  const json = JSON.stringify(data, null, 2);
  const encrypting = cfg.encrypt && cfg.password;
  const payload = encrypting ? "GIA_ENCRYPTED:" + xorEncExport(json, cfg.password) : json;
  const ext = encrypting ? "gia" : "json";
  const baseName = sanitizeFilename(cfg.fileName);
  try {
    if (autosaveDirHandle) {
      let perm = await autosaveDirHandle.queryPermission({
        mode: "readwrite"
      });
      if (perm !== "granted") perm = await autosaveDirHandle.requestPermission({
        mode: "readwrite"
      });
      if (perm !== "granted") throw new Error("autosave folder permission not granted");
      const fileHandle = await autosaveDirHandle.getFileHandle(`${baseName}.${ext}`, {
        create: true
      });
      const writable = await fileHandle.createWritable();
      await writable.write(payload);
      await writable.close();
    } else {
      const blob = new Blob([ payload ], {
        type: encrypting ? "application/octet-stream" : "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${baseName}_${(new Date).toISOString().slice(0, 19).replace(/[:T]/g, "-")}.${ext}`;
      a.click();
      URL.revokeObjectURL(url);
    }
    await db.setSetting("lastAutosave", Date.now());
    return true;
  } catch (e) {
    console.error("Auto Save failed", e);
    return false;
  }
}

function startAutosaveTimer(minutes) {
  if (autosaveIntervalId) clearInterval(autosaveIntervalId);
  autosaveIntervalId = setInterval(() => {
    performAutoSave();
  }, Math.max(1, minutes) * 6e4);
}

function stopAutosaveTimer() {
  if (autosaveIntervalId) clearInterval(autosaveIntervalId);
  autosaveIntervalId = null;
}

async function initAutosave() {
  await loadAutosaveDirHandle();
  const cfg = await getAutosaveSettings();
  if (cfg.enabled && cfg.onInterval) startAutosaveTimer(cfg.intervalMinutes);
}

async function maybeAutosaveAfterPromptSave() {
  const cfg = await getAutosaveSettings();
  if (cfg.enabled && cfg.onPromptSave) performAutoSave();
}

      if (!sub) return;
      const chip = document.createElement("span");
      chip.style = "display:inline-flex;align-items:center;gap:0.2857rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:0.2857rem;padding:0.2143rem 0.5714rem;font-size:0.8571rem;";
      chip.innerHTML = `${esc(sub)} <button class="chip-x sub-remove" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;line-height:1;">×</button>`;
      chip.querySelector(".sub-remove").addEventListener("click", () => {
        if (confirm("Remove this subcategory? Prompts already using it will keep the old value and stop matching this filter.")) chip.remove();
      });
      const inputDiv = input.closest("div");
      inputDiv.parentNode.insertBefore(chip, inputDiv);
      input.value = "";
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        btn.click();
      }
    });
  });
  ov.querySelectorAll(".sub-remove").forEach(btn => btn.addEventListener("click", () => {
    if (confirm("Remove this subcategory? Prompts already using it will keep the old value and stop matching this filter.")) btn.parentElement.remove();
  }));
  ov.querySelector("#mc-add-cat").addEventListener("click", () => {
    const list = ov.querySelector("#mc-cat-list");
    const id = "custom_" + uid();
    const html = `<div class="cat-editor" data-id="${id}" style="border:1px solid var(--border);border-radius:var(--radius);padding:0.8571rem;margin-bottom:0.5714rem;background:var(--bg-base)">\n        <div style="display:flex;align-items:center;gap:0.5714rem;margin-bottom:0.4286rem;">\n          <div class="icon-picker-btn" style="cursor:pointer;font-size:1.1429rem" title="Click to change icon">${ICON_SET.other}</div>\n          <input class="form-input cat-name-input" value="New Category" style="flex:1" placeholder="Category name">\n          <button class="btn btn-ghost cat-delete-btn" style="color:var(--red);border-color:rgba(240,107,107,.35);height:2rem;padding:0 0.7rem;font-size:0.8rem">Delete</button>\n        </div>\n        <div class="subs-list" style="display:flex;flex-wrap:wrap;gap:0.4286rem;align-items:center;">\n          <div style="display:flex;gap:0.2857rem;align-items:center;">\n            <input class="form-input new-sub-input" placeholder="New subcategory" style="width:9.2857rem;height:2rem;font-size:0.8571rem;">\n            <button class="btn btn-ghost add-sub-btn" style="height:2rem;font-size:0.7857rem;padding:0 0.5714rem;">Add</button>\n          </div>\n        </div>\n      </div>`;
    list.insertAdjacentHTML("beforeend", html);
    const newEditor = list.lastElementChild;
    newEditor.querySelector(".icon-picker-btn").addEventListener("click", () => {
      const btnIcon = newEditor.querySelector(".icon-picker-btn");
      const currentIconKey = newEditor.dataset.iconKey || "other";
      const picker = document.createElement("div");
      picker.className = "overlay";
      picker.style.zIndex = "1100";
      picker.innerHTML = `<div class="modal sm" style="width:auto;max-width:90vw;">\n        <div class="modal-head"><div class="modal-title">Choose Icon</div><button class="modal-x">×</button></div>\n        <div class="modal-body" style="display:grid;grid-template-columns: repeat(5,1fr);gap:0.5rem;padding:1rem">\n          ${Object.entries(ICON_SET).map(([key, svg]) => `<button class="icon-option" data-key="${key}" style="background:${key === currentIconKey ? "var(--accent-dim)" : "transparent"};border:1px solid var(--border);border-radius:0.5rem;padding:0.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.8rem">${svg}</button>`).join("")}\n        </div>\n      </div>`;
      document.body.appendChild(picker);
      picker.querySelector(".modal-x").onclick = () => picker.remove();
      picker.addEventListener("click", e => {
        if (e.target === picker) picker.remove();
      });
      picker.querySelectorAll(".icon-option").forEach(opt => {
        opt.addEventListener("click", () => {
          newEditor.dataset.iconKey = opt.dataset.key;
          btnIcon.innerHTML = ICON_SET[opt.dataset.key];
          picker.remove();
        });
      });
    });
    newEditor.querySelector(".cat-delete-btn").addEventListener("click", () => {
      if (!confirm("Delete this custom category?")) return;
      deletedCatIds.add(newEditor.dataset.id);
      newEditor.remove();
    });
    const addSubBtn = newEditor.querySelector(".add-sub-btn");
    const newSubInput = newEditor.querySelector(".new-sub-input");
    addSubBtn.addEventListener("click", () => {
      const sub = newSubInput.value.trim();
      if (!sub) return;
      const chip = document.createElement("span");
      chip.style = "display:inline-flex;align-items:center;gap:0.2857rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:0.2857rem;padding:0.2143rem 0.5714rem;font-size:0.8571rem;";
      chip.innerHTML = `${esc(sub)} <button class="chip-x sub-remove" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;line-height:1;">×</button>`;
      chip.querySelector(".sub-remove").addEventListener("click", () => chip.remove());
      const inputDiv = newSubInput.closest("div");
      inputDiv.parentNode.insertBefore(chip, inputDiv);
      newSubInput.value = "";
    });
    newSubInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        addSubBtn.click();
      }
    });
  });
  const saveChanges = async () => {
    const editors = ov.querySelectorAll(".cat-editor");
    const newCustomCats = [];
    const renames = {};
    for (const editor of editors) {
      const id = editor.dataset.id;
      const newName = editor.querySelector(".cat-name-input").value.trim();
      if (!newName) continue;
      const existing = allCats().find(c => c.id === id);
      if (existing && existing.name !== newName) {
        renames[existing.name] = newName;
      }
      const subs = Array.from(editor.querySelectorAll(".subs-list > span")).map(el => (el.childNodes[0]?.textContent || "").trim()).filter(Boolean);
      const iconKey = editor.dataset.iconKey || allCats().find(c => c.id === id)?.iconKey || "other";
      newCustomCats.push({
        id: id,
        name: newName,
        iconKey: iconKey,
        subs: subs
      });
    }
    if (Object.keys(renames).length > 0) {
      for (const p of S.prompts) {
        if (p.category && renames[p.category]) {
          p.category = renames[p.category];
          p._search = null;
          await db.savePrompt(p);
        }
      }
    }
    for (const c of newCustomCats) {
      try {
        await db.saveCat(c);
      } catch (err) {
        console.error(err);
        toast("⚠ Failed to save one or more categories.");
        return;
      }
    }
    for (const id of deletedCatIds) {
      try {
        await db.deleteCat(id);
      } catch (err) {
        console.error(err);
      }
    }
    S.customCats = newCustomCats;
    renderSidebar();
    renderContent();
  };
  ov.querySelector("#mc-save").onclick = async () => {
    await saveChanges();
    ov.remove();
    toast("✓ Categories saved");
  };
}

function updateStatus() {
  const dot = document.getElementById("stat-dot"), backupEl = document.getElementById("stat-backup");
  if (S.lastBackup) {
    backupEl.textContent = `Last backup: ${fmtTime(S.lastBackup)}`;
    dot.className = "stat-dot";
  } else {
    backupEl.textContent = "No backup yet — export recommended";
    dot.className = "stat-dot warn";
  }
}

function initEvents() {
  initContentDelegation();
  const debouncedSearchRender = debounce(() => renderContent(), 160);
  document.getElementById("search-input").addEventListener("input", e => {
    S.filter.search = e.target.value;
    S.focusIndex = -1;
    debouncedSearchRender();
  });
  document.getElementById("sb-all").addEventListener("click", () => {
    setFilter("all", null);
    if (window.innerWidth <= 850) document.getElementById("sidebar").classList.remove("open");
  });
  document.getElementById("sb-fav").addEventListener("click", () => {
    setFilter("fav", null);
    if (window.innerWidth <= 850) document.getElementById("sidebar").classList.remove("open");
  });
  document.getElementById("sb-used").addEventListener("click", () => {
    setFilter("used", null);
    if (window.innerWidth <= 850) document.getElementById("sidebar").classList.remove("open");
  });
  document.getElementById("btn-add").addEventListener("click", () => promptModal(null));
  document.getElementById("btn-grid").addEventListener("click", () => setView("grid"));
  document.getElementById("btn-list").addEventListener("click", () => setView("list"));
  document.getElementById("sort-select").addEventListener("change", e => {
    S.sort = e.target.value;
    db.setSetting("sort", S.sort);
    renderContent();
  });
  const gear = document.getElementById("btn-settings"), dd = document.getElementById("settings-dd");
  gear.addEventListener("click", e => {
    e.stopPropagation();
    dd.style.display = dd.style.display === "none" ? "block" : "none";
  });
  dd.querySelectorAll(".dd-item").forEach(el => {
    el.addEventListener("click", () => {
      dd.style.display = "none";
      settingsAction(el.dataset.action);
    });
  });
  document.addEventListener("click", () => {
    dd.style.display = "none";
  });
  dd.addEventListener("click", e => e.stopPropagation());
  document.getElementById("det-close").addEventListener("click", closeDetail);
  document.getElementById("btn-fontsize").addEventListener("click", cycleFontSize);
  document.getElementById("btn-hamburger").addEventListener("click", toggleSidebar);
  document.getElementById("tags-toggle").addEventListener("click", () => {
    document.getElementById("tags-cloud").classList.toggle("hidden");
  });
  document.addEventListener("keydown", e => {
    const isInput = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT" || e.target.isContentEditable;
    if (e.key === "Escape") {
      const fpOverlay = document.getElementById("fullpage-prompt-overlay");
      if (fpOverlay && fpOverlay.classList.contains("open")) {
        closeFullpagePrompt();
        return;
      }
      const ov = document.querySelector(".overlay");
      if (ov) {
        ov.remove();
        return;
      }
      if (S.selectedId) {
        closeDetail();
        return;
      }
      const dd = document.getElementById("settings-dd");
      if (dd.style.display !== "none") {
        dd.style.display = "none";
        return;
      }
    }
    if (!isInput) {
      if (e.key === "n" || e.key === "N") {
        promptModal(null);
        return;
      }
      if (e.key === "/") {
        e.preventDefault();
        document.getElementById("search-input").focus();
        return;
      }
      if (e.key === "g" || e.key === "G") {
        setView("grid");
        return;
      }
      if (e.key === "l" || e.key === "L") {
        setView("list");
        return;
      }
      if (e.key === "ArrowDown" || e.key === "ArrowRight") {
        e.preventDefault();
        moveKbdFocus(1);
        return;
      }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        e.preventDefault();
        moveKbdFocus(-1);
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        openFocusedPrompt();
        return;
      }
      if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        deleteFocusedPrompt();
        return;
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "e") {
      e.preventDefault();
      showBackupModal();
    }
  });
  window.addEventListener("resize", () => {
    applyPinState();
  });
  let dragCount = 0;
  document.addEventListener("dragenter", e => {
    e.preventDefault();
    dragCount++;
    document.getElementById("drop-zone").classList.add("show");
  });
  document.addEventListener("dragleave", () => {
    dragCount--;
    if (dragCount <= 0) {
      dragCount = 0;
      document.getElementById("drop-zone").classList.remove("show");
    }
  });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => {
    e.preventDefault();
    dragCount = 0;
    document.getElementById("drop-zone").classList.remove("show");
    const f = e.dataTransfer.files[0];
    if (f && (f.name.endsWith(".json") || f.name.endsWith(".gia"))) doImport(f); else toast("⚠ Please drop a .json or .gia GIA backup file");
  });
}

async function init() {
  try {
    await db.init();
    S.prompts = await db.getAllPrompts();
    S.customCats = await db.getAllCats();
    S.lastBackup = await db.getSetting("lastBackup");
    S.sort = await db.getSetting("sort") || "newest";
    document.getElementById("sort-select").value = S.sort;
    await initTheme();
    S.uiFont = await db.getSetting("uiFont") || "Outfit";
    S.monoFont = await db.getSetting("monoFont") || "JetBrains Mono";
    S.fontSize = await db.getSetting("fontSize") || "14px";
    applyFontSettings();
    setView("grid");
    renderSidebar();
    renderContent();
    updateStatus();
    initEvents();
    await initPin();
    initSidebarHoverReveal();
    await initAutosave();
    document.getElementById("stat-version").textContent = `GIA v${APP_VERSION}`;
  } catch (err) {
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:0.7143rem;font-family:monospace;color:#f06b6b"><div style="font-size:1.2857rem">⚠ GIA failed to initialize</div><div style="font-size:0.8571rem;color:#666">${err.message}</div><div style="font-size:0.7857rem;color:#444">IndexedDB may be unavailable in private/incognito mode</div></div>`;
  }
}

init();
</script>
