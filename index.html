   ═══════════════════════════════════════════════════ */
function settingsAction(action) {
  if (action === 'manage-cats') { showManageCatsModal(); return; }
  if (action === 'manage-tags') { showManageTagsModal(); return; }
  if (action === 'fonts') { showFontsModal(); return; }
  if (action === 'backup') { showBackupModal(); return; }
  if (action === 'fetch-previews') { fetchLinkPreviews(true); return; }
  if (action === 'about') {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal sm"><div class="modal-head"><div class="modal-title" style="text-align:center;flex:1;">Gaslighting Instructions Archiver</div><button class="modal-x">×</button></div>
    <div class="modal-body"><div class="about-wrap">
      <div class="about-desc">A lightweight, offline-first application for organizing, browsing, searching, previewing, and reusing AI prompts. No server. No account. No nonsense.</div>
      <a class="made-by" href="https://omeoni.substack.com" target="_blank" rel="noopener">Made with ❤️ by KungPowUnicorn</a>
      <a class="made-by" href="https://github.com/KungPowUnicorn/gia" target="_blank" rel="noopener" style="color:var(--blue)">View on GitHub</a>
      <a href="https://ko-fi.com/E1E71WM9SA" target="_blank" rel="noopener"><img class="kofi-img" src="https://storage.ko-fi.com/cdn/kofi6.png?v=6" alt="Buy Me a Coffee at ko-fi.com"></a>
    </div></div></div>`;
    document.body.appendChild(ov); ov.querySelector('.modal-x').onclick = () => ov.remove(); ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    return;
  }
  if (action === 'shortcuts') {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal sm"><div class="modal-head"><div class="modal-title">⌨️ Keyboard Shortcuts</div><button class="modal-x">×</button></div>
    <div class="modal-body"><table style="width:100%;border-collapse:collapse">${[['N','New prompt'],['Ctrl+S','Save Prompt'],['/','Focus search'],['Esc','Close panel / modal'],['G','Grid view'],['L','List view'],['Ctrl+E','Backup']].map(([k,d])=>`<tr style="border-bottom:1px solid var(--border)"><td style="padding:0.6429rem 0;width:6.4286rem"><kbd>${k}</kbd></td><td style="padding:0.6429rem 0;color:var(--text-secondary);font-size:0.8929rem">${d}</td></tr>`).join('')}</table></div></div>`;
    document.body.appendChild(ov); ov.querySelector('.modal-x').onclick = () => ov.remove(); ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    return;
  }
  if (action === 'storage') {
    const previewSize = S.prompts.reduce((a,p)=>a+(p.previewData?p.previewData.length:0),0);
    const backupJson = JSON.stringify({prompts:S.prompts, categories:S.customCats}); const backupSize = new Blob([backupJson]).size;
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal sm"><div class="modal-head"><div class="modal-title">Storage Info</div><button class="modal-x">×</button></div>
    <div class="modal-body"><div class="stat-grid">${[['Last Backup', S.lastBackup ? fmtTime(S.lastBackup) : '—'],['Backup Size', `${(backupSize/1024).toFixed(1)} KB`],['Preview Cache', `${(previewSize/1024).toFixed(1)} KB`],['Encryption','XOR']].map(([k,v])=>`<div class="stat-card"><div class="stat-k">${k}</div><div class="stat-v">${v}</div></div>`).join('')}</div></div></div>`;
    document.body.appendChild(ov); ov.querySelector('.modal-x').onclick = () => ov.remove(); ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    return;
  }
  if (action === 'clear') {
    if (!confirm('⚠ Delete ALL prompts and settings permanently?')) return;
    db.clearAll().then(() => { S.prompts = []; S.customCats = []; closeDetail(); renderSidebar(); renderContent(); toast('All data cleared'); });
  }
}

function showBackupModal() {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal sm"><div class="modal-head"><div class="modal-title">Backup</div><button class="modal-x">×</button></div>
    <div class="modal-body" style="gap:0.75rem">
      <button class="btn btn-primary" id="bu-import">Import Backup</button>
      <button class="btn btn-ghost" id="bu-export">Export (plain JSON)</button>
      <button class="btn btn-ghost" id="bu-export-enc">Password‑Protected Export</button>
      <input type="file" id="bu-file-input" accept=".json,.gia" style="display:none">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="bu-close">Close</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('.modal-x').onclick = () => ov.remove();
  ov.querySelector('#bu-close').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });

  const fileInput = ov.querySelector('#bu-file-input');
  ov.querySelector('#bu-import').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async e => { const f = e.target.files[0]; if (f) { await doImport(f); ov.remove(); } });

  ov.querySelector('#bu-export').addEventListener('click', async () => {
    const data = { _app:'GIA', _version:2, exportedAt:Date.now(), prompts:S.prompts, categories:S.customCats };
    const json = JSON.stringify(data,null,2); const blob = new Blob([json],{type:'application/json'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href=url; a.download=`GIAbackup_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
    S.lastBackup = Date.now(); await db.setSetting('lastBackup', S.lastBackup); updateStatus(); toast('✓ Backup exported'); ov.remove();
  });

  ov.querySelector('#bu-export-enc').addEventListener('click', async () => {
    const password = prompt('Enter password for encrypted backup:'); if (!password) return;
    const confirmPwd = prompt('Confirm password:'); if (password !== confirmPwd) { toast('Passwords do not match'); return; }
    const data = { _app:'GIA', _version:2, exportedAt:Date.now(), prompts:S.prompts, categories:S.customCats };
    const json = JSON.stringify(data,null,2); const encrypted = xorEncExport(json, password);
    const blob = new Blob(['GIA_ENCRYPTED:'+encrypted],{type:'application/octet-stream'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href=url; a.download=`GIAbackup_${new Date().toISOString().slice(0,10)}.gia`; a.click(); URL.revokeObjectURL(url);
    S.lastBackup = Date.now(); await db.setSetting('lastBackup', S.lastBackup); updateStatus(); toast('✓ Encrypted backup exported'); ov.remove();
  });
}

async function doImport(file) {
  try {
    const text = await file.text(); let data;
    if (text.startsWith('GIA_ENCRYPTED:')) {
      const encrypted = text.slice('GIA_ENCRYPTED:'.length); const password = prompt('This backup is encrypted. Enter password:'); if (!password) return;
      const decrypted = xorDecExport(encrypted, password); if (!decrypted) { toast('⚠ Wrong password or corrupted file'); return; }
      try { data = JSON.parse(decrypted); } catch { toast('⚠ Decryption succeeded but file is not valid JSON'); return; }
    } else { data = JSON.parse(text); }
    if(!data.prompts){toast('⚠ Invalid backup file — no prompts found');return;}
    const confirmMerge = confirm(`Import ${data.prompts.length} prompts? Duplicates (by ID) will be skipped.`); if(!confirmMerge) return;
    const existIds = new Set(S.prompts.map(p=>p.id)); let added=0;
    for(const p of data.prompts){ if(!existIds.has(p.id)){ await db.savePrompt(p); S.prompts.push(p); added++; } }
    if(data.categories){
      for(const cat of data.categories){
        const existingCustom = S.customCats.find(c=>c.id===cat.id);
        if (existingCustom) { Object.assign(existingCustom, cat); await db.saveCat(existingCustom); }
        else if (DEFAULT_CATS.some(d=>d.id===cat.id)) { await db.saveCat(cat); S.customCats.push(cat); }
        else { await db.saveCat(cat); S.customCats.push(cat); }
      }
    }
    renderSidebar(); renderContent(); toast(`✓ Imported ${added} new prompt${added!==1?'s':''}`);
  } catch(e){ toast('⚠ Failed to parse file — is it a valid GIA backup?'); }
}

      picker.addEventListener('click', e => { if (e.target === picker) picker.remove(); });

      if (!confirm('Delete this custom category? Prompts in it will remain with the old name.')) return;

/* ═══════════════════════════════════════════════════
   INIT & EVENT BINDING
   ═══════════════════════════════════════════════════ */
function updateStatus() {
  const dot = document.getElementById('stat-dot'), backupEl = document.getElementById('stat-backup');
  if(S.lastBackup){ backupEl.textContent = `Last backup: ${fmtTime(S.lastBackup)}`; dot.className = 'stat-dot'; }
  else { backupEl.textContent = 'No backup yet — export recommended'; dot.className = 'stat-dot warn'; }
}

function initEvents() {
  document.getElementById('search-input').addEventListener('input', e=>{ S.filter.search=e.target.value; renderContent(); });
  document.getElementById('sb-all').addEventListener('click',()=>{
    setFilter('all',null);
    if (window.innerWidth <= 850) document.getElementById('sidebar').classList.remove('open');
  });
  document.getElementById('sb-fav').addEventListener('click',()=>{
    setFilter('fav',null);
    if (window.innerWidth <= 850) document.getElementById('sidebar').classList.remove('open');
  });
  document.getElementById('btn-add').addEventListener('click',()=>promptModal(null));
  document.getElementById('btn-grid').addEventListener('click',()=>setView('grid'));
  document.getElementById('btn-list').addEventListener('click',()=>setView('list'));
  document.getElementById('sort-select').addEventListener('change', e => { S.sort = e.target.value; db.setSetting('sort', S.sort); renderContent(); });

  const gear=document.getElementById('btn-settings'), dd=document.getElementById('settings-dd');
  gear.addEventListener('click', e=>{ e.stopPropagation(); dd.style.display=dd.style.display==='none'?'block':'none'; });
  dd.querySelectorAll('.dd-item').forEach(el=>{ el.addEventListener('click',()=>{ dd.style.display='none'; settingsAction(el.dataset.action); }); });
  document.addEventListener('click',()=>{ dd.style.display='none'; }); dd.addEventListener('click',e=>e.stopPropagation());

  document.getElementById('det-close').addEventListener('click',closeDetail);
  document.getElementById('btn-fontsize').addEventListener('click', cycleFontSize);
  document.getElementById('btn-hamburger').addEventListener('click', toggleSidebar);

  document.getElementById('tags-toggle').addEventListener('click', () => {
    const cloud = document.getElementById('tags-cloud');
    cloud.style.display = cloud.style.display === 'none' ? '' : 'none';
  });

  document.addEventListener('keydown', e=>{
    const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT';

    if (e.key === 'Escape') {
      const fpOverlay = document.getElementById('fullpage-prompt-overlay');
      if (fpOverlay && fpOverlay.classList.contains('open')) {
        closeFullpagePrompt();
        return;
      }
      const ov = document.querySelector('.overlay');
      if (ov) { ov.remove(); return; }
      if (S.selectedId) { closeDetail(); return; }
      const dd = document.getElementById('settings-dd');
      if (dd.style.display !== 'none') { dd.style.display = 'none'; return; }
    }

    if (!isInput) {
      if (e.key === 'n' || e.key === 'N') { promptModal(null); return; }
      if (e.key === '/') { e.preventDefault(); document.getElementById('search-input').focus(); return; }
      if (e.key === 'g' || e.key === 'G') { setView('grid'); return; }
      if (e.key === 'l' || e.key === 'L') { setView('list'); return; }
    }

    if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
      e.preventDefault();
      showBackupModal();
    }
  });

  window.addEventListener('resize', () => { applyPinState(); });

  let dragCount=0;
  document.addEventListener('dragenter',e=>{ e.preventDefault(); dragCount++; document.getElementById('drop-zone').classList.add('show'); });
  document.addEventListener('dragleave',()=>{ dragCount--; if(dragCount<=0){dragCount=0;document.getElementById('drop-zone').classList.remove('show');} });
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',e=>{
    e.preventDefault(); dragCount=0; document.getElementById('drop-zone').classList.remove('show');
    const f=e.dataTransfer.files[0];
    if(f&&(f.name.endsWith('.json')||f.name.endsWith('.gia'))) doImport(f);
    else toast('⚠ Please drop a .json or .gia GIA backup file');
  });
}

async function init() {
  try {
    await db.init();
    S.prompts = await db.getAllPrompts();
    S.customCats = await db.getAllCats();
    S.lastBackup = await db.getSetting('lastBackup');
    S.sort = await db.getSetting('sort') || 'newest';
    document.getElementById('sort-select').value = S.sort;
    await initTheme();
    S.uiFont = await db.getSetting('uiFont') || 'Outfit';
    S.monoFont = await db.getSetting('monoFont') || 'JetBrains Mono';
    S.fontSize = await db.getSetting('fontSize') || '14px';
    applyFontSettings();
    setView('grid');
    renderSidebar();
    renderContent();
    updateStatus();
    initEvents();
    await initPin();
    document.getElementById('stat-version').textContent = `GIA v${APP_VERSION}`;
  } catch(err) {
    document.body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:0.7143rem;font-family:monospace;color:#f06b6b"><div style="font-size:1.2857rem">⚠ GIA failed to initialize</div><div style="font-size:0.8571rem;color:#666">${err.message}</div><div style="font-size:0.7857rem;color:#444">IndexedDB may be unavailable in private/incognito mode</div></div>`;
  }
}

init();
</script>
