<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html.light {
  --bg-base: #f5f5f9; --bg-surface: #ffffff; --bg-elevated: #f0f0f5; --bg-hover: #e4e4ee;
  --border: #dcdce0; --border-light: #d0d0d8; --accent: #d18a2c; --accent-hover: #e8a045;
  --accent-dim: rgba(209,138,44,0.1); --accent-glow: rgba(209,138,44,0.2);
  --text-primary: #1b1b24; --text-secondary: #4a4a5a; --text-muted: #7a7a90;
  --green: #2e9a5e; --red: #e05050; --yellow: #d4a017; --blue: #3a7de0;
}
html.dark {
  --bg-base: #0b0b0f; --bg-surface: #111118; --bg-elevated: #18181f; --bg-hover: #20202a;
  --border: #252530; --border-light: #2e2e3d; --accent: #e8a045; --accent-hover: #f0b55a;
  --accent-dim: rgba(232,160,69,0.11); --accent-glow: rgba(232,160,69,0.22);
  --text-primary: #e4e4f0; --text-secondary: #9090a8; --text-muted: #505065;
  --green: #3ecf73; --red: #f06b6b; --yellow: #f5c842; --blue: #5ba3f5;
}

:root {
  --radius: 0.5714rem; --radius-lg: 0.8571rem; --sidebar-w: 15.5714rem;
  --topbar-h: 3.8571rem; --status-h: 1.8571rem; --detail-w: 28.5714rem;
  --t: 0.14s ease;
  --font-ui: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}

html { font-size: 14px; }
html, body { height: 100%; overflow: hidden; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui); line-height: 1.5; -webkit-font-smoothing: antialiased; }

::-webkit-scrollbar { width: 0.3571rem; height: 0.3571rem; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 0.2143rem; }
::-webkit-scrollbar-thumb:hover { opacity: 0.8; }

#app { display: flex; flex-direction: column; height: 100vh; }

#topbar { height: var(--topbar-h); background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 1rem; gap: 0.5rem; flex-shrink: 0; z-index: 200; }
.logo { display: flex; align-items: center; gap: 0.7143rem; flex-shrink: 0; margin-right: 0.2857rem; cursor: default; }
.logo-mark { width: 2.2857rem; height: 2.2857rem; background: var(--accent); border-radius: 0.5714rem; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9286rem; color: #0b0b0f; letter-spacing: -0.05rem; }
.logo-text { line-height: 1.15; }
.logo-name { font-size: 0.9286rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02rem; }
.logo-sub { font-size: 0.6429rem; text-transform: uppercase; letter-spacing: 0.1rem; color: var(--text-muted); font-weight: 600; }

.search-wrap { flex: 1; position: relative; max-width: 35.7143rem; min-width: 0; }
.search-wrap input { width: 100%; height: 2.4286rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-ui); font-size: 0.9286rem; padding: 0 0.8571rem 0 2.4286rem; outline: none; transition: border-color var(--t); }
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text-muted); }
.search-icon { position: absolute; left: 0.7143rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
.search-shortcut { position: absolute; right: 0.7143rem; top: 50%; transform: translateY(-50%); font-size: 0.7143rem; color: var(--text-muted); background: var(--bg-base); border: 1px solid var(--border); border-radius: 0.2857rem; padding: 0.0714rem 0.3571rem; pointer-events: none; font-family: var(--font-mono); }

.topbar-right { display: flex; align-items: center; gap: 0.4286rem; margin-left: auto; }

.btn { display: inline-flex; align-items: center; gap: 0.3571rem; height: 2.4286rem; padding: 0 0.9286rem; border-radius: var(--radius); border: none; cursor: pointer; font-family: var(--font-ui); font-size: 0.9286rem; font-weight: 500; transition: all var(--t); white-space: nowrap; }
.btn-primary { background: var(--accent); color: #0b0b0f; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-light); }
.btn-icon { width: 2.4286rem; height: 2.4286rem; padding: 0; justify-content: center; background: transparent; color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all var(--t); display: inline-flex; align-items: center; }
.btn-icon:hover { background: var(--bg-elevated); color: var(--text-primary); }
.btn-icon.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(232,160,69,0.35); }

#btn-pin-sidebar svg { transition: transform 0.2s, fill 0.2s, stroke 0.2s; }
#btn-pin-sidebar.pinned svg { fill: var(--accent); stroke: var(--accent); transform: rotate(-20deg); }

#main { display: flex; flex: 1; overflow: hidden; }

#sidebar {
  width: var(--sidebar-w); background: var(--bg-surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
  position: relative;
}

#sidebar.unpinned {
  position: fixed;
  top: var(--topbar-h);
  left: 0;
  bottom: var(--status-h);
  width: var(--sidebar-w);
  transform: translateX(-100%);
  transition: transform 0.2s ease;
  z-index: 150;
  box-shadow: 0.5rem 0 2rem rgba(0,0,0,0.35);
  will-change: transform;
}

#sidebar.unpinned.hover-reveal {
  transform: translateX(0);
}

#sidebar-edge-trigger {
  display: none;
  position: fixed;
  top: var(--topbar-h);
  left: 0;
  bottom: var(--status-h);
  width: 0.85rem;
  z-index: 149;
}

#sidebar .sb-section,
#sidebar .sb-label,
#sidebar .sb-item,
#sidebar .cat-header,
#sidebar .sub-item,
#sidebar .tags-cloud {
  transition: opacity 0.2s ease;
}

#sidebar.unpinned .sb-section,
#sidebar.unpinned .sb-label,
#sidebar.unpinned .sb-item,
#sidebar.unpinned .cat-header,
#sidebar.unpinned .sub-item,
#sidebar.unpinned .tags-cloud {
  opacity: 0;
  pointer-events: none;
}

#sidebar.unpinned:hover .sb-section,
#sidebar.unpinned:hover .sb-label,
#sidebar.unpinned:hover .sb-item,
#sidebar.unpinned:hover .cat-header,
#sidebar.unpinned:hover .sub-item,
#sidebar.unpinned:hover .tags-cloud {
  opacity: 1;
  pointer-events: auto;
}

.sb-section { padding: 1rem 0.7143rem 0.2857rem; }
.sb-label { font-size: 0.6786rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1rem; color: var(--text-muted); padding: 0 0.4286rem; margin-bottom: 0.2143rem; cursor: pointer; user-select: none; }
.sb-label:hover { color: var(--accent); }
.sb-item { display: flex; align-items: center; gap: 0.5714rem; padding: 0.4286rem 0.5714rem; border-radius: 0.4286rem; cursor: pointer; color: var(--text-secondary); font-size: 0.8929rem; font-weight: 400; transition: all var(--t); user-select: none; }
.sb-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.sb-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
.sb-count { margin-left: auto; font-size: 0.7143rem; color: var(--text-muted); background: var(--bg-elevated); padding: 0.0714rem 0.4286rem; border-radius: 0.5714rem; min-width: 1.2857rem; text-align: center; }
.sb-item.active .sb-count { background: var(--accent-glow); color: var(--accent); }

.sb-divider { height: 1px; background: var(--border); margin: 0.4286rem 0.7143rem; }

.cat-header { display: flex; align-items: center; gap: 0.4286rem; padding: 0.3571rem 0.5714rem; border-radius: 0.4286rem; cursor: pointer; color: var(--text-secondary); font-size: 0.8929rem; transition: all var(--t); user-select: none; }
.cat-header:hover { background: var(--bg-hover); color: var(--text-primary); }
.cat-header.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
.cat-header .sb-count { margin-left: auto; }
.cat-subs { display: none; flex-direction: column; }
.cat-subs.open { display: flex; }
.sub-item { display: flex; align-items: center; gap: 0.3571rem; padding: 0.2857rem 0.5714rem 0.2857rem 2.1429rem; border-radius: 0.3571rem; cursor: pointer; color: var(--text-muted); font-size: 0.8214rem; transition: all var(--t); }
.sub-item:hover { background: var(--bg-hover); color: var(--text-secondary); }
.sub-item.active { color: var(--accent); }

.tags-cloud { display: flex; flex-wrap: wrap; gap: 0.2143rem; padding: 0.1429rem 0.5714rem 0.7143rem; }
.tags-cloud.hidden { display: none; }
.sb-tag { font-size: 0.7857rem; padding: 0.1429rem 0.5rem; border-radius: 0.2857rem; cursor: pointer; color: var(--text-muted); transition: all var(--t); }
.sb-tag:hover { background: var(--bg-hover); color: var(--text-secondary); }
.sb-tag.active { background: var(--accent-dim); color: var(--accent); }

#content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.content-bar { display: flex; align-items: center; padding: 0.7143rem 1.1429rem; gap: 0.5714rem; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg-base); }
.content-info { flex: 1; min-width: 0; }
.content-title { font-size: 0.9286rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.content-count { font-size: 0.7857rem; color: var(--text-muted); margin-top: 0.0714rem; }

.sort-select { height: 2.4286rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-ui); font-size: 0.8rem; padding: 0 0.5rem; outline: none; cursor: pointer; }
.sort-select:focus { border-color: var(--accent); }

.view-btns { display: flex; gap: 0.2857rem; }

.prompts-grid { flex: 1; overflow-y: auto; padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(16.2857rem, 1fr)); gap: 0.7143rem; align-content: start; }
.prompts-list { flex: 1; overflow-y: auto; padding: 0.5714rem 1rem; display: flex; flex-direction: column; gap: 0.2143rem; }

.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.7143rem; color: var(--text-muted); padding: 2.8571rem; text-align: center; }
.empty-icon { font-size: 3.1429rem; opacity: 0.35; }
.empty-state h3 { font-size: 1.0714rem; font-weight: 600; color: var(--text-secondary); }
.empty-state p { font-size: 0.8571rem; max-width: 20rem; line-height: 1.65; }

.prompt-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 0.9286rem;
  cursor: pointer;
  transition: border-color var(--t), background var(--t), transform var(--t), box-shadow var(--t);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  position: relative;
  overflow: hidden;
  height: 100%;
  min-height: 300px;
}
.prompt-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 0.1429rem; background: transparent; transition: background var(--t); }
.prompt-card:hover { border-color: var(--border-light); background: var(--bg-elevated); transform: translateY(-0.0714rem); box-shadow: 0 0.4286rem 1.7143rem rgba(0,0,0,0.35); }
.prompt-card:hover::after { background: var(--accent); }
.prompt-card.selected { border-color: rgba(232,160,69,0.5); background: var(--bg-elevated); }
.prompt-card.selected::after { background: var(--accent); }

.card-top { display: flex; align-items: flex-start; gap: 0.4286rem; }
.card-title { font-size: 0.8929rem; font-weight: 600; color: var(--text-primary); flex: 1; line-height: 1.35; }
.fav-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1rem; padding: 0.0714rem; transition: color var(--t), transform var(--t); flex-shrink: 0; line-height: 1; }
.fav-btn:hover { transform: scale(1.2); }
.fav-btn.on { color: #f06b6b; }

.card-cat { font-size: 0.75rem; color: var(--text-muted); }

.card-body {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-secondary);
  line-height: 1.5;
  background: var(--bg-base);
  padding: 0.5rem 0.6429rem;
  border-radius: 0.4286rem;
  border: 1px solid var(--border);
  max-height: 3.4rem;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  line-clamp: 3;
}

.card-tags { display: flex; flex-wrap: wrap; gap: 0.2143rem; }
.tag-pill { font-size: 0.7143rem; padding: 0.1071rem 0.4286rem; border-radius: 0.2857rem; background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border); font-weight: 500; }

.card-foot { display: flex; align-items: center; gap: 0.4286rem; margin-top: auto; }
.card-date { font-size: 0.6786rem; color: var(--text-muted); margin-left: auto; }
.card-actions { display: flex; gap: 0.2143rem; }
.ca-btn { flex: 1; height: 1.8571rem; background: var(--bg-base); border: 1px solid var(--border); border-radius: 0.3571rem; color: var(--text-muted); font-family: var(--font-ui); font-size: 0.75rem; cursor: pointer; transition: all var(--t); display: flex; align-items: center; justify-content: center; gap: 0.2143rem; font-weight: 500; }
.ca-btn:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-light); }
.ca-btn.copy:hover { background: var(--accent-dim); color: var(--accent); border-color: rgba(232,160,69,0.4); }
.ca-btn.del:hover { background: rgba(240,107,107,0.1); color: var(--red); border-color: rgba(240,107,107,0.4); }

.card-thumb {
  width: 100%; aspect-ratio: 16/9;
  background: var(--bg-elevated);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  flex-shrink: 0;
}
.card-thumb img, .card-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-thumb .thumb-icon {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
}
.card-thumb .thumb-icon svg { width: 40%; height: 40%; opacity: 0.8; }

.det-preview-wrap {
  width: 100%;
  background: var(--bg-base);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  min-height: 6rem; max-height: 14rem;
}
.det-preview-wrap img, .det-preview-wrap video { max-width: 100%; max-height: 14rem; object-fit: contain; display: block; }
.det-preview-wrap audio { width: 100%; }
.det-preview-wrap .preview-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
  color: var(--text-muted); font-size: 0.8rem; padding: 1.5rem;
}
.det-preview-wrap .preview-placeholder span { font-size: 2rem; }

.list-item { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6429rem 0.8571rem; cursor: pointer; transition: all var(--t); display: flex; align-items: center; gap: 0.7143rem; }
.list-item:hover { border-color: var(--border-light); background: var(--bg-elevated); }
.list-item.selected { border-color: rgba(232,160,69,0.45); background: var(--accent-dim); }
.li-fav { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1rem; flex-shrink: 0; line-height: 1; transition: color var(--t); }
.li-fav.on { color: var(--red); }
.li-main { flex: 1; min-width: 0; }
.li-title { font-size: 0.8929rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.0714rem; }
.li-preview { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 20rem; flex-shrink: 0; }
.li-actions { display: flex; gap: 0.2143rem; flex-shrink: 0; }
.la-btn { height: 1.8571rem; padding: 0 0.5714rem; background: var(--bg-base); border: 1px solid var(--border); border-radius: 0.3571rem; color: var(--text-muted); font-family: var(--font-ui); font-size: 0.75rem; cursor: pointer; transition: all var(--t); }
.la-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.la-btn.copy:hover { color: var(--accent); }
.la-btn.del:hover { color: var(--red); }

#detail { width: var(--detail-w); background: var(--bg-surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; transform: translateX(100%); transition: transform 0.2s ease; }
#detail.open { transform: translateX(0); }
.det-head { padding: 1rem 1rem 0.8571rem; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 0.5714rem; flex-shrink: 0; }
.det-title { flex: 1; font-size: 1rem; font-weight: 700; color: var(--text-primary); line-height: 1.35; }
.det-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2143rem; }
.det-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.4286rem; line-height: 1; flex-shrink: 0; transition: color var(--t); }
.det-close:hover { color: var(--text-primary); }
.det-body { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.85rem; }
.det-sec { display: flex; flex-direction: column; gap: 0.3rem; }
.det-label { font-size: 0.6786rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08rem; color: var(--text-muted); }

.resizable-prompt {
  resize: vertical;
  overflow: auto;
  min-height: 15rem;
  height: 35vh;
  max-height: 70vh;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-base);
  padding: 0.5rem 0.6rem;
  position: relative;
}

.resizable-prompt .expand-btn {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 2rem;
  height: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 1rem;
  line-height: 1;
  transition: all var(--t);
  z-index: 10;
}

.resizable-prompt .expand-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.resizable-prompt .det-prompt-md {
  max-height: none;
  border: none;
  margin: 0;
  padding: 1.4rem 1.2rem;
}

#fullpage-prompt-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-base);
  z-index: 3000;
  display: none;
  flex-direction: column;
}
#fullpage-prompt-overlay.open {
  display: flex;
}

.fullpage-prompt-inner {
  flex: 1;
  overflow: auto;
  padding: 2rem 1.5rem;
  position: relative;
}

.fullpage-prompt-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 2.5rem;
  height: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 1.4rem;
  line-height: 1;
  z-index: 10;
  transition: all var(--t);
}
.fullpage-prompt-close:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

#fullpage-prompt-content .resizable-prompt {
  height: auto;
  min-height: auto;
  max-height: none;
  resize: none;
  border: none;
  background: transparent;
}
#fullpage-prompt-content .resizable-prompt .expand-btn {
  display: none;
}
#fullpage-prompt-content .det-prompt-md {
  max-height: none;
}

.split-badge { display: inline-flex; align-items: center; gap: 0.2rem; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06rem; padding: 0.15rem 0.45rem; border-radius: 0.25rem; }
.split-badge.pos { background: rgba(62,207,115,0.13); color: var(--green); border: 1px solid rgba(62,207,115,0.25); }

function xorEnc(str, key = XOR_KEY) {
  if (!str) return "";
  let r = "";
  for (let i = 0; i < str.length; i++) r += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  try {
    return btoa(unescape(encodeURIComponent(r)));
  } catch {
    return btoa(r);
  }
}

function xorDec(enc, key = XOR_KEY) {
  if (!enc) return "";
  try {
    let s;
    try {
      s = decodeURIComponent(escape(atob(enc)));
    } catch {
      s = atob(enc);
    }
    let r = "";
    for (let i = 0; i < s.length; i++) r += String.fromCharCode(s.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    return r;
  } catch {
    return enc;
  }
}

function xorEncExport(str, password) {
  const key = password || XOR_KEY;
  let r = "";
  for (let i = 0; i < str.length; i++) r += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return btoa(unescape(encodeURIComponent(r)));
}

function xorDecExport(enc, password) {
  const key = password || XOR_KEY;
  try {
    let s = decodeURIComponent(escape(atob(enc)));
    let r = "";
    for (let i = 0; i < s.length; i++) r += String.fromCharCode(s.charCodeAt(i) ^ key.charCodeAt(i % key.length));

  } catch {

  }
}

const timeAgo = ts => {
  if (!ts) return "—";

function toast(msg, dur = 2600, action = null) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  clearTimeout(toastTimer);
  const el = document.createElement("div");
  el.className = "toast";
  const msgSpan = document.createElement("span");
  msgSpan.textContent = msg;
  el.appendChild(msgSpan);
  if (action) {
    const btn = document.createElement("button");
    btn.className = "toast-action";
    btn.textContent = action.label;
    btn.onclick = () => {
      clearTimeout(toastTimer);
      el.remove();
      action.onClick();
    };
    el.appendChild(btn);
  }
  document.body.appendChild(el);
  toastTimer = setTimeout(() => {
    el.style.transition = "opacity .3s";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 310);
  }, dur);
}

function toggleFullpagePrompt(el) {
  const overlay = document.getElementById("fullpage-prompt-overlay");
  const content = document.getElementById("fullpage-prompt-content");
  if (overlay.classList.contains("open")) {
    const returnParent = overlay._returnParent;
    if (returnParent && el.parentElement === content) {
      returnParent.appendChild(el);
    }
    overlay.classList.remove("open");
    overlay._returnParent = null;
    overlay._promptEl = null;
  } else {
    overlay._returnParent = el.parentElement;
    overlay._promptEl = el;
    content.appendChild(el);
    overlay.classList.add("open");
  }
}

function closeFullpagePrompt() {
  const overlay = document.getElementById("fullpage-prompt-overlay");
  if (!overlay.classList.contains("open")) return;
  const promptEl = overlay._promptEl;
  const returnParent = overlay._returnParent;
  if (promptEl && returnParent) {
    returnParent.appendChild(promptEl);
  }
  overlay.classList.remove("open");
  overlay._returnParent = null;
  overlay._promptEl = null;
}

class GDB {
  constructor() {
    this.db = null;
  }
  init() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onerror = () => rej(req.error);
      req.onsuccess = () => {
        this.db = req.result;
        res();
      };
      req.onupgradeneeded = e => {
        const d = e.target.result;
        [ S_PROMPTS, S_SETTINGS, S_CATS ].forEach(store => {
          if (!d.objectStoreNames.contains(store)) d.createObjectStore(store, {
            keyPath: "key"
          });
        });
      };
    });
  }
  _tx(store, mode = "readonly") {
    return this.db.transaction(store, mode).objectStore(store);
  }
  _getAll(store) {
    return new Promise((res, rej) => {
      const req = this._tx(store).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  }
  _get(store, key) {
    return new Promise((res, rej) => {
      const req = this._tx(store).get(key);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  _put(store, obj) {
    return new Promise((res, rej) => {
      const req = this._tx(store, "readwrite").put(obj);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    });
  }
  _del(store, key) {
    return new Promise((res, rej) => {
      const req = this._tx(store, "readwrite").delete(key);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    });
  }
  async getAllPrompts() {
    const rows = await this._getAll(S_PROMPTS);
    return rows.map(r => {
      try {
        return JSON.parse(xorDec(r.data));
      } catch {
        return null;
      }
    }).filter(Boolean);
  }
  async savePrompt(p) {
    await this._put(S_PROMPTS, {
      key: p.id,
      data: xorEnc(JSON.stringify(p))
    });
  }
  async deletePrompt(id) {
    await this._del(S_PROMPTS, id);
  }
  async getSetting(k) {
    return new Promise((res, rej) => {
      const req = this._tx(S_SETTINGS).get(k);
      req.onsuccess = () => res(req.result?.val ?? null);
      req.onerror = () => rej(req.error);
    });
  }
  async setSetting(k, val) {
    await this._put(S_SETTINGS, {
      key: k,
      val: val
    });
  }
  async getAllCats() {
    const rows = await this._getAll(S_CATS);
    return rows.map(r => r.cat);
  }
  async saveCat(cat) {
    await this._put(S_CATS, {
      key: cat.id,
      cat: cat
    });
  }
  async deleteCat(id) {
    await this._del(S_CATS, id);
  }
  async clearAll() {
    for (const s of [ S_PROMPTS, S_SETTINGS, S_CATS ]) {
      await new Promise((res, rej) => {
        const req = this._tx(s, "readwrite").clear();
        req.onsuccess = () => res();
        req.onerror = () => rej(req.error);
      });
    }
  }
}

function buildSearchBlob(p) {
  return [ p.title || "", p.body || "", p.bodyNegative || "", p.notes || "", p.model || "", p.category || "", p.subcategory || "", (p.tags || []).join(" ") ].join("  ").toLowerCase();
}

function searchBlobOf(p) {
  if (!p._search) p._search = buildSearchBlob(p);
  return p._search;
}

function filteredPrompts() {
  let ps = [ ...S.prompts ];
  const {type: type, val: val, search: search} = S.filter;
  if (type === "fav") ps = ps.filter(p => p.fav); else if (type === "used") ps = ps.filter(p => (p.useCount || 0) > 0); else if (type === "cat") ps = ps.filter(p => p.category === val); else if (type === "sub") {
    const [cat, sub] = val.split("::");
    ps = ps.filter(p => p.category === cat && p.subcategory === sub);
  } else if (type === "tag") ps = ps.filter(p => (p.tags || []).includes(val));
  const q = (search || "").toLowerCase().trim();
  if (q) {
    ps = ps.filter(p => searchBlobOf(p).includes(q));
  }
  if (q) {
    const scoreOf = p => {
      let score = 0;
      const title = (p.title || "").toLowerCase();
      if (title === q) score += 100; else if (title.startsWith(q)) score += 60; else if (title.includes(q)) score += 40;
      if ((p.tags || []).some(t => t.toLowerCase() === q)) score += 30; else if ((p.tags || []).some(t => t.toLowerCase().includes(q))) score += 15;
      if ((p.category || "").toLowerCase().includes(q)) score += 8;
      if ((p.model || "").toLowerCase().includes(q)) score += 5;
      return score;
    };
    ps.sort((a, b) => scoreOf(b) - scoreOf(a) || (b.updatedAt || 0) - (a.updatedAt || 0));
    if (type === "used") ps.sort((a, b) => scoreOf(b) - scoreOf(a) || (b.useCount || 0) - (a.useCount || 0));
    return ps;
  }
  if (type === "used") {
    ps.sort((a, b) => (b.useCount || 0) - (a.useCount || 0) || (b.updatedAt || 0) - (a.updatedAt || 0));
    return ps;
  }
  switch (S.sort) {
   case "newest":
    ps.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    break;

   case "oldest":
    ps.sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
    break;

   case "az":
    ps.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
    break;

   case "za":
    ps.sort((a, b) => (b.title || "").localeCompare(a.title || ""));
    break;

   case "favs":
    ps.sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || (b.updatedAt || 0) - (a.updatedAt || 0));
    break;

   case "mostused":
    ps.sort((a, b) => (b.useCount || 0) - (a.useCount || 0) || (b.updatedAt || 0) - (a.updatedAt || 0));
    break;

   case "manual":
    ps.sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
    break;

   default:
    ps.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }
  return ps;
}

function generateThumbnail(fileObj, maxW = 200) {
  return new Promise((resolve, reject) => {
    const type = fileObj.type.split("/")[0];
    if (type === "image") {
      const img = new Image;
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(img.src);
        resolve(canvas.toDataURL("image/jpeg", .75));
      };
      img.onerror = () => {
        URL.revokeObjectURL(img.src);
        reject(new Error("Image load error"));
      };
      img.src = URL.createObjectURL(fileObj);
    } else if (type === "video") {
      const video = document.createElement("video");
      video.preload = "metadata";
      video.muted = true;
      video.playsInline = true;
      const blobUrl = URL.createObjectURL(fileObj);
      const timeout = setTimeout(() => {
        URL.revokeObjectURL(blobUrl);
        reject(new Error("Video thumbnail timed out"));
      }, 8e3);
      video.onloadedmetadata = () => {
        video.currentTime = Math.min(1, video.duration * .1);
      };
      video.onseeked = () => {
        clearTimeout(timeout);
        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = 180;
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(blobUrl);
        resolve(canvas.toDataURL("image/jpeg", .7));
      };
      video.onerror = () => {
        clearTimeout(timeout);
        URL.revokeObjectURL(blobUrl);
        reject(new Error("Video loading failed"));
      };
      video.src = blobUrl;
    } else {
      resolve(null);
    }
  });
}

const IMG_EXT = /\.(jpg|jpeg|png|gif|webp|svg|avif)(\?.*)?$/i;

const VIDEO_EXT = /\.(mp4|webm|ogg)(\?.*)?$/i;

function getPreviewHTML(p, cat) {
  if (p.previewData && p.previewData.startsWith("data:image")) {
    return `<div class="card-thumb"><img src="${p.previewData}" loading="lazy" alt=""></div>`;
  }
  if (p.link) {
    if (IMG_EXT.test(p.link)) {
      return `<div class="card-thumb"><img src="${esc(p.link)}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.closest('.card-thumb').style.display='none'"></div>`;
    }
    if (VIDEO_EXT.test(p.link)) {
      return `<div class="card-thumb"><video muted preload="metadata"><source src="${esc(p.link)}"></video><div class="thumb-icon" style="position:absolute">▶</div></div>`;
    }
  }
  const color = cat?.color || "var(--text-muted)";
  const icon = getCatIcon(cat);
  return `<div class="card-thumb" style="background:${color}22; border-color:${color}55;">\n    <div class="thumb-icon" style="color:${color}">${icon}</div>\n  </div>`;
}

function renderDetailPreview(p) {
  const cont = document.getElementById("det-preview-cont");
  if (!cont) return;
  if (p.previewData && p.previewData.startsWith("data:image")) {
    cont.innerHTML = `<div class="det-preview-wrap"><img src="${p.previewData}" alt="Preview"></div>`;
  } else if (p.link) {
    if (IMG_EXT.test(p.link)) {
      cont.innerHTML = `<div class="det-preview-wrap"><img src="${esc(p.link)}" referrerpolicy="no-referrer" alt="Preview" onerror="this.closest('.det-preview-wrap').innerHTML='<div class=\\'preview-placeholder\\'><span>🖼️</span>Image could not load</div>'"></div>`;
    } else if (VIDEO_EXT.test(p.link)) {
      cont.innerHTML = `<div class="det-preview-wrap"><video controls style="max-width:100%;max-height:14rem"><source src="${esc(p.link)}"></video></div>`;
    } else {
      cont.innerHTML = `<div class="det-preview-wrap"><div class="preview-placeholder"><span>🔗</span><a href="${esc(p.link)}" target="_blank" rel="noopener" style="color:var(--blue);font-size:0.8rem">Open link</a></div></div>`;
    }
  } else {
    cont.innerHTML = "";
  }
}

let catToggleListenerAdded = false;

function renderSidebar() {
  const favN = S.prompts.filter(p => p.fav).length;
  const usedN = S.prompts.filter(p => (p.useCount || 0) > 0).length;
  document.getElementById("fav-count").textContent = favN;
  document.getElementById("used-count").textContent = usedN;
  document.getElementById("all-count").textContent = S.prompts.length;
  document.getElementById("stat-count").textContent = `${S.prompts.length} prompt${S.prompts.length !== 1 ? "s" : ""}`;
  document.getElementById("sb-all").classList.toggle("active", S.filter.type === "all");
  document.getElementById("sb-fav").classList.toggle("active", S.filter.type === "fav");
  document.getElementById("sb-used").classList.toggle("active", S.filter.type === "used");
  const cats = allCats();
  const counts = catCounts();
  const catEl = document.getElementById("cat-list");
  catEl.innerHTML = cats.map(cat => {
    const count = counts[cat.name] || 0;
    const isActive = S.filter.type === "cat" && S.filter.val === cat.name;
    const isOpen = S.openCats.has(cat.id);
    return `<div>\n      <div class="cat-header${isActive ? " active" : ""}" data-cat="${esc(cat.name)}" data-id="${esc(cat.id)}">\n        <span style="font-size:1.1429rem">${getCatIcon(cat)}</span>\n        <span>${esc(cat.name)}</span>\n        <span class="sb-count">${count}</span>\n      </div>\n      ${cat.subs?.length ? `<div class="cat-subs${isOpen ? " open" : ""}" id="subs-${esc(cat.id)}">\n        ${cat.subs.map(sub => {
      const isSubActive = S.filter.type === "sub" && S.filter.val === `${cat.name}::${sub}`;
      const sc = S.prompts.filter(p => p.category === cat.name && p.subcategory === sub).length;
      return `<div class="sub-item${isSubActive ? " active" : ""}" data-cat="${esc(cat.name)}" data-sub="${esc(sub)}"><span style="color:var(--text-muted);font-size:0.7143rem">└</span>${esc(sub)}${sc ? `<span style="margin-left:auto;font-size:0.6786rem;color:var(--text-muted)">${sc}</span>` : ""}</div>`;
    }).join("")}\n      </div>` : ""}\n    </div>`;
  }).join("");
  const tags = allTags();
  const tagsCloud = document.getElementById("tags-cloud");
  tagsCloud.innerHTML = tags.map(({tag: tag, count: count}) => {
    const active = S.filter.type === "tag" && S.filter.val === tag;
    return `<span class="sb-tag${active ? " active" : ""}" data-tag="${esc(tag)}">#${esc(tag)}<span style="opacity:.5;margin-left:0.2143rem;font-size:0.6786rem">${count}</span></span>`;
  }).join("");
  if (S.filter.type === "tag") {
    tagsCloud.classList.remove("hidden");
  }
  catEl.querySelectorAll(".cat-header").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.id;
      if (S.openCats.has(id)) S.openCats.delete(id); else S.openCats.add(id);
      setFilter("cat", el.dataset.cat);
    });
  });
  catEl.querySelectorAll(".sub-item").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      const catObj = cats.find(c => c.name === el.dataset.cat);
      if (catObj) S.openCats.add(catObj.id);
      setFilter("sub", `${el.dataset.cat}::${el.dataset.sub}`);
      if (window.innerWidth <= 850) document.getElementById("sidebar").classList.remove("open");
    });
  });
  tagsCloud.querySelectorAll(".sb-tag").forEach(el => {
    el.addEventListener("click", () => {
      setFilter("tag", el.dataset.tag);
      if (window.innerWidth <= 850) document.getElementById("sidebar").classList.remove("open");
    });
  });
  if (!catToggleListenerAdded) {
    document.getElementById("cat-toggle").addEventListener("click", () => {
      const cats2 = allCats();
      const anyOpen = cats2.some(c => S.openCats.has(c.id));
      if (anyOpen) S.openCats.clear(); else cats2.forEach(c => {
        if (c.subs?.length) S.openCats.add(c.id);
      });
      renderSidebar();
    });
    catToggleListenerAdded = true;
  }
}

function renderContent() {
  const fps = filteredPrompts();
  const wrap = document.getElementById("prompts-wrap");
  let title = "All Prompts";
  if (S.filter.type === "fav") title = "❤️ Favorites"; else if (S.filter.type === "used") title = "📈 Most Used"; else if (S.filter.type === "cat" && S.filter.val) title = S.filter.val; else if (S.filter.type === "sub" && S.filter.val) title = S.filter.val.split("::").join(" › "); else if (S.filter.type === "tag" && S.filter.val) title = `#${S.filter.val}`;
  if (S.filter.search) title += ' — "' + S.filter.search + '"';
  document.getElementById("content-title").textContent = title;
  document.getElementById("content-count").textContent = `${fps.length} prompt${fps.length !== 1 ? "s" : ""}`;
  if (fps.length === 0) {
    wrap.className = "";
    wrap.style.cssText = "flex:1;display:flex;align-items:center;justify-content:center;";
    wrap.innerHTML = `<div class="empty-state">\n      <div class="empty-icon">${S.prompts.length === 0 ? "📭" : "🔍"}</div>\n      <h3>${S.prompts.length === 0 ? "No prompts yet" : "No results found"}</h3>\n      <p>${S.prompts.length === 0 ? 'Press <kbd>N</kbd> or click "New Prompt" to start building your library.' : "Try different search terms or clear the filter."}</p>\n    </div>`;
    S.focusIndex = -1;
    return;
  }
  wrap.style.cssText = "";
  const manualDrag = S.sort === "manual" && S.view === "list" && !S.filter.search;
  const catsList = allCats();
  const hlRe = buildHighlightRegex(S.filter.search);
  if (S.view === "grid") {
    wrap.className = "prompts-grid";
    wrap.innerHTML = fps.map(p => cardHTML(p, catsList, hlRe)).join("");
  } else {
    wrap.className = "prompts-list";
    wrap.innerHTML = fps.map(p => listItemHTML(p, manualDrag, catsList, hlRe)).join("");
  }
  if (S.selectedId) {
    const sel = wrap.querySelector(`[data-card="${S.selectedId}"],[data-li="${S.selectedId}"]`);
    if (sel) sel.classList.add("selected");
  }
  applyKbdFocus();
}

function initContentDelegation() {
  const wrap = document.getElementById("prompts-wrap");
  wrap.addEventListener("click", e => {
    const favBtn = e.target.closest(".fav-btn,.li-fav");
    if (favBtn) {
      e.stopPropagation();
      toggleFav(favBtn.dataset.id);
      return;
    }
    const copyBtn = e.target.closest(".ca-btn.copy,.la-btn.copy");
    if (copyBtn) {
      e.stopPropagation();
      copyPrompt(copyBtn.dataset.id);
      return;
    }
    const editBtn = e.target.closest(".ca-btn.edit,.la-btn.edit");
    if (editBtn) {
      e.stopPropagation();
      openEdit(editBtn.dataset.id);
      return;
    }
    const dupBtn = e.target.closest(".ca-btn.dup,.la-btn.dup");
    if (dupBtn) {
      e.stopPropagation();
      duplicatePrompt(dupBtn.dataset.id);
      return;
    }
    const delBtn = e.target.closest(".ca-btn.del,.la-btn.del");
    if (delBtn) {
      e.stopPropagation();
      deletePrompt(delBtn.dataset.id);
      return;
    }
    if (e.target.closest(".li-title-edit")) return;
    const row = e.target.closest("[data-card],[data-li]");
    if (row) {
      const items = Array.from(wrap.querySelectorAll("[data-card],[data-li]"));
      S.focusIndex = items.indexOf(row);
      openDetail(row.dataset.card || row.dataset.li);
    }
  });
  wrap.addEventListener("dblclick", e => {
    const titleEl = e.target.closest(".li-title");
    if (titleEl) {
      e.stopPropagation();
      startInlineTitleEdit(titleEl, titleEl.dataset.id);
    }
  });
  let dragSrcId = null;
  wrap.addEventListener("dragstart", e => {
    const item = e.target.closest('.list-item[draggable="true"]');
    if (!item) return;
    dragSrcId = item.dataset.li;
    item.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  wrap.addEventListener("dragend", e => {
    const item = e.target.closest(".list-item");
    if (item) item.classList.remove("dragging");
  });
  wrap.addEventListener("dragover", e => {
    const item = e.target.closest('.list-item[draggable="true"]');
    if (!item) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
  });
  wrap.addEventListener("drop", async e => {
    const item = e.target.closest('.list-item[draggable="true"]');
    if (!item) return;
    e.preventDefault();
    const targetId = item.dataset.li;
    if (!dragSrcId || dragSrcId === targetId) return;
    await reorderPrompts(dragSrcId, targetId);
    dragSrcId = null;
  });
}

a2 2 0 0 1 2-2h10"/></svg>Dup</button>\n      <button class="ca-btn del" data-id="${p.id}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Del</button>\n    </div>\n  </div>`;
}

function listItemHTML(p, draggable, catsList, hlRe) {
  catsList = catsList || allCats();
  const cat = catsList.find(c => c.name === p.category);
  const isSplit = p.bodyType === "split";
  return `<div class="list-item" data-li="${p.id}"${draggable ? ' draggable="true"' : ""}>\n    ${draggable ? `<span class="drag-handle" title="Drag to reorder"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></span>` : ""}\n    <button class="li-fav${p.fav ? " on" : ""}" data-id="${p.id}">${p.fav ? "♥" : "♡"}</button>\n    <div class="li-main">\n      <div class="li-title" data-id="${p.id}" title="Double-click to rename">${highlight(p.title || "Untitled", hlRe)}${isSplit ? '<span class="split-indicator">±</span>' : ""}</div>\n      <div class="li-meta" style="color:${cat?.color || "var(--text-muted)"}">\n        ${cat ? getCatIcon(cat) + " " : ""}<span>${esc(p.category || "")}</span>${p.subcategory ? ` › ${esc(p.subcategory)}` : ""} · ${timeAgo(p.updatedAt || p.createdAt)}${(p.useCount || 0) > 0 ? ` · Used ${p.useCount}×` : ""}\n      </div>\n    </div>\n    <div class="li-preview">${esc((p.body || "").substring(0, 120))}</div>\n    <div class="li-actions">\n      <button class="la-btn copy" data-id="${p.id}">Copy</button>\n      <button class="la-btn edit" data-id="${p.id}">Edit</button>\n      <button class="la-btn dup" data-id="${p.id}" title="Duplicate">Dup</button>\n      <button class="la-btn del" data-id="${p.id}">Del</button>\n    </div>\n  </div>`;
}

function startInlineTitleEdit(titleEl, id) {
  const p = S.prompts.find(x => x.id === id);
  if (!p) return;
  const original = p.title || "";
  const input = document.createElement("input");
  input.className = "li-title-edit";
  input.value = original;
  titleEl.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const commit = async () => {
    if (done) return;
    done = true;
    const val = input.value.trim();
    if (val && val !== original) {
      p.title = val;
      p.updatedAt = Date.now();
      p._search = null;
      await db.savePrompt(p);
      if (S.selectedId === id) renderDetail(id);
      renderSidebar();
    }
    renderContent();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      commit();
    } else if (e.key === "Escape") {
      done = true;
      renderContent();
    }
  });
  input.addEventListener("blur", commit);
}

async function reorderPrompts(srcId, targetId) {
  const list = filteredPrompts();
  const srcIdx = list.findIndex(p => p.id === srcId);
  const tgtIdx = list.findIndex(p => p.id === targetId);
  if (srcIdx === -1 || tgtIdx === -1) return;
  const [moved] = list.splice(srcIdx, 1);
  list.splice(tgtIdx, 0, moved);
  const changed = [];
  list.forEach((p, i) => {
    if (p.order !== i) {
      p.order = i;
      changed.push(p);
    }
  });
  for (const p of changed) await db.savePrompt(p);
  renderContent();
}

function applyKbdFocus() {
  document.querySelectorAll(".kbd-focus").forEach(el => el.classList.remove("kbd-focus"));
  if (S.focusIndex < 0) return;
  const items = document.querySelectorAll("[data-card],[data-li]");
  const el = items[S.focusIndex];
  if (el) el.classList.add("kbd-focus");
}

function moveKbdFocus(delta) {
  const fps = filteredPrompts();
  if (!fps.length) return;
  if (S.focusIndex < 0) S.focusIndex = 0; else S.focusIndex = Math.max(0, Math.min(fps.length - 1, S.focusIndex + delta));
  applyKbdFocus();
  const items = document.querySelectorAll("[data-card],[data-li]");
  const el = items[S.focusIndex];
  if (el) el.scrollIntoView({
    block: "nearest"
  });
}

function openFocusedPrompt() {
  const fps = filteredPrompts();
  if (S.focusIndex >= 0 && fps[S.focusIndex]) openDetail(fps[S.focusIndex].id);
}

function deleteFocusedPrompt() {
  const fps = filteredPrompts();
  if (S.focusIndex >= 0 && fps[S.focusIndex]) deletePrompt(fps[S.focusIndex].id);
}

  } else {
    promptSection = `\n      <div class="det-sec">\n        <div class="det-label">Prompt</div>\n        <div class="resizable-prompt">\n            <button class="expand-btn" onclick="toggleFullpagePrompt(this.parentElement)" title="Full page">⛶</button>\n        <div class="det-prompt-md">${renderMarkdown(p.body || "")}</div>\n        </div>\n      </div>`;

function toggleCopyMenu(id) {
  const menu = document.getElementById(`copy-menu-${id}`);
  if (!menu) return;
  const isOpen = menu.classList.contains("open");
  document.querySelectorAll(".copy-menu.open").forEach(m => m.classList.remove("open"));
  if (!isOpen) {
    menu.classList.add("open");
    const closeOnce = e => {
      if (!menu.contains(e.target)) {
        menu.classList.remove("open");
        document.removeEventListener("click", closeOnce);
      }
    };
    setTimeout(() => document.addEventListener("click", closeOnce), 0);
  }
}

function stripMarkdown(text) {
  if (!text) return "";
  return text.replace(/```[\s\S]*?```/g, m => m.replace(/```/g, "").trim()).replace(/`([^`]+)`/g, "$1").replace(/^#{1,6}\s+/gm, "").replace(/(\*\*|__)(.*?)\1/g, "$2").replace(/(\*|_)(.*?)\1/g, "$2").replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/^\s*>\s?/gm, "").replace(/^\s*[-*+]\s+/gm, "").replace(/^\s*\d+\.\s+/gm, "").trim();
}

async function copyPromptVariant(id, field, plain) {
  const p = S.prompts.find(x => x.id === id);
  if (!p) return;
  let text = field === "bodyNegative" ? p.bodyNegative || "" : p.body || "";
  if (plain) text = stripMarkdown(text);
  try {
    await navigator.clipboard.writeText(text);
    await registerUse(p);
    toast(plain ? "✓ Copied plain text" : "✓ Copied Markdown");
  } catch {
    toast("⚠ Clipboard access denied by browser");
  }
  document.querySelectorAll(".copy-menu.open").forEach(m => m.classList.remove("open"));
}

async function registerUse(p) {
  p.useCount = (p.useCount || 0) + 1;
  p.lastUsed = Date.now();
  await db.savePrompt(p);
  if (S.selectedId === p.id) renderDetail(p.id);
  renderSidebar();
}

function exportPromptFile(id) {
  const p = S.prompts.find(x => x.id === id);
  if (!p) return;
  const lines = [ `# ${p.title || "Untitled"}`, "" ];
  if (p.category) lines.push(`Category: ${p.category}${p.subcategory ? " › " + p.subcategory : ""}`);
  if (p.model) lines.push(`Model: ${p.model}`);
  if (p.tags?.length) lines.push(`Tags: ${p.tags.map(t => "#" + t).join(" ")}`);
  lines.push("", "## Prompt", "", p.body || "");
  if (p.bodyType === "split") lines.push("", "## Negative Prompt", "", p.bodyNegative || "");
  if (p.notes) lines.push("", "## Notes", "", p.notes);
  if (p.link) lines.push("", `Output link: ${p.link}`);
  const blob = new Blob([ lines.join("\n") ], {
    type: "text/markdown"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (p.title || "prompt").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "prompt";
  a.href = url;
  a.download = `${safeName}.md`;
  a.click();
  URL.revokeObjectURL(url);
  toast("✓ Prompt exported");
}

function diffLines(oldText, newText) {
  const a = (oldText || "").split("\n"), b = (newText || "").split("\n");
  const n = a.length, m = b.length;
  const dp = Array.from({
    length: n + 1
  }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  }
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) {
      out.push({
        type: "same",
        text: a[i]
      });
      i++;
      j++;
    } else if (dp[i + 1][j] >= dp[i][j + 1]) {
      out.push({
        type: "del",
        text: a[i]
      });
      i++;
    } else {
      out.push({
        type: "add",
        text: b[j]
      });
      j++;
    }
  }
  while (i < n) {
    out.push({
      type: "del",
      text: a[i]
    });
    i++;
  }
  while (j < m) {
    out.push({
      type: "add",
      text: b[j]
    });
    j++;
  }
  return out;
}

function showVersionHistory(id) {
  const p = S.prompts.find(x => x.id === id);
  if (!p) return;
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal sm"><div class="modal-head"><div class="modal-title">Version History — ${esc(p.title)}</div><button class="modal-x">×</button></div>\n  <div class="modal-body"><div class="version-list" id="version-list">\n    ${(p.history || []).length === 0 ? '<div style="color:var(--text-muted);font-size:.85rem;text-align:center;padding:1rem">No history yet</div>' : (p.history || []).map((v, i) => `<div class="version-item" data-idx="${i}"><strong>Version ${v.version}</strong> — ${fmtDate(v.updatedAt)}<br><span style="font-size:0.75rem;color:var(--text-muted)">${esc((v.body || "").substring(0, 80))}…</span></div>`).join("")}\n  </div></div>\n  <div class="modal-foot">\n    <button class="btn btn-ghost" id="vh-clear" style="color:var(--red);border-color:rgba(240,107,107,.35);margin-right:auto">Clear History</button>\n    <button class="btn btn-ghost" id="vh-close">Close</button>\n  </div></div>`;
  document.body.appendChild(ov);
  ov.querySelector(".modal-x").onclick = () => ov.remove();
  ov.querySelector("#vh-close").onclick = () => ov.remove();
  ov.addEventListener("click", e => {
    if (e.target === ov) ov.remove();
  });
  ov.querySelector("#vh-clear").onclick = async () => {
    if (!confirm("Permanently delete all version history for this prompt?")) return;
    p.history = [];
    await db.savePrompt(p);
    ov.remove();
    if (S.selectedId === id) renderDetail(id);
    toast("✓ Version history cleared");
  };
  ov.querySelectorAll(".version-item").forEach(item => {
    item.addEventListener("click", () => {
      const idx = parseInt(item.dataset.idx);
      const oldVer = p.history[idx];
      showDiffModal(p, oldVer, idx);
    });
  });
}

function showDiffModal(p, oldVer, idx) {
  const diff = diffLines(oldVer.body || "", p.body || "");
  const diffHtml = diff.map(d => {
    const cls = d.type === "add" ? "diff-add" : d.type === "del" ? "diff-del" : "diff-same";
    const prefix = d.type === "add" ? "+ " : d.type === "del" ? "- " : "  ";
    return `<div class="diff-line ${cls}">${esc(prefix + d.text)}</div>`;
  }).join("");
  const dov = document.createElement("div");
  dov.className = "overlay";
  dov.style.zIndex = "1100";
  dov.innerHTML = `<div class="modal">\n    <div class="modal-head"><div class="modal-title">Compare Version ${oldVer.version} → Current</div><button class="modal-x">×</button></div>\n    <div class="modal-body">\n      <div style="font-size:0.75rem;color:var(--text-muted)">${fmtDate(oldVer.updatedAt)} vs current (v${p.version || 1}) — <span style="color:var(--green)">green = added</span>, <span style="color:var(--red)">red = removed</span></div>\n      <div class="diff-wrap">${diffHtml || '<div style="color:var(--text-muted);font-size:0.85rem">No differences</div>'}</div>\n    </div>\n    <div class="modal-foot">\n      <button class="btn btn-ghost" id="diff-cancel">Close</button>\n      <button class="btn btn-primary" id="diff-revert">Revert to Version ${oldVer.version}</button>\n    </div>\n  </div>`;
  document.body.appendChild(dov);
  dov.querySelector(".modal-x").onclick = () => dov.remove();
  dov.querySelector("#diff-cancel").onclick = () => dov.remove();
  dov.addEventListener("click", e => {
    if (e.target === dov) dov.remove();
  });
  dov.querySelector("#diff-revert").onclick = async () => {
    if (!confirm("Revert to this version? This will create a new version with the old content.")) return;
    const currentSnapshot = {
      ...p,
      history: undefined
    };
    if (!p.history) p.history = [];
    p.history.push(currentSnapshot);
    p.title = oldVer.title;
    p.body = oldVer.body;
    p.bodyNegative = oldVer.bodyNegative;
    p.bodyType = oldVer.bodyType;
    p.category = oldVer.category;
    p.subcategory = oldVer.subcategory;
    p.tags = oldVer.tags;
    p.notes = oldVer.notes;
    p.link = oldVer.link;
    p.model = oldVer.model;
    p.previewData = oldVer.previewData;
    p.version = (p.version || 1) + 1;
    p.updatedAt = Date.now();
    p._search = null;
    await db.savePrompt(p);
    dov.remove();
    document.querySelectorAll(".overlay").forEach(o => o.remove());
    renderSidebar();
    renderContent();
    if (S.selectedId === p.id) renderDetail(p.id);
    toast("✓ Reverted to previous version");
  };
}

let sidebarPinned = true;

function applyPinState() {
  const sidebar = document.getElementById("sidebar");
  const pinBtn = document.getElementById("btn-pin-sidebar");
  const edgeTrigger = document.getElementById("sidebar-edge-trigger");
  const isMobile = window.innerWidth <= 850;
  const effectivePinned = isMobile ? true : sidebarPinned;
  if (effectivePinned) {
    sidebar.classList.remove("unpinned", "hover-reveal");
    pinBtn.classList.add("pinned");
    edgeTrigger.style.display = "none";
  } else {
    sidebar.classList.add("unpinned");
    pinBtn.classList.remove("pinned");
    edgeTrigger.style.display = isMobile ? "none" : "block";
  }
}

async function initPin() {
  sidebarPinned = await db.getSetting("sidebarPinned");
  if (sidebarPinned === null) sidebarPinned = true;
  applyPinState();
  document.getElementById("btn-pin-sidebar").addEventListener("click", () => {
    sidebarPinned = !sidebarPinned;
    db.setSetting("sidebarPinned", sidebarPinned);
    applyPinState();
  });
}

function initSidebarHoverReveal() {
  const sidebar = document.getElementById("sidebar");
  const edge = document.getElementById("sidebar-edge-trigger");
  let hideTimer = null;
  const reveal = () => {
    clearTimeout(hideTimer);
    sidebar.classList.add("hover-reveal");
  };
  const scheduleHide = () => {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => sidebar.classList.remove("hover-reveal"), 150);
  };
  edge.addEventListener("mouseenter", reveal);
  edge.addEventListener("mouseleave", scheduleHide);
  sidebar.addEventListener("mouseenter", reveal);
  sidebar.addEventListener("mouseleave", scheduleHide);
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

document.addEventListener("click", function(e) {

  if (!sidebar.classList.contains("open")) return;

}

async function copyNegative(id) {
  const p = S.prompts.find(x => x.id === id);
  if (!p) return;
  try {
    await navigator.clipboard.writeText(p.bodyNegative || "");
    await registerUse(p);

  }
}

async function duplicatePrompt(id) {
  const p = S.prompts.find(x => x.id === id);
  if (!p) return;
  const now = Date.now();
  const np = {
    ...p,
    id: uid(),
    title: (p.title || "Untitled") + " (copy)",
    createdAt: now,
    updatedAt: now,
    lastUsed: null,
    useCount: 0,
    version: 1,
    history: [],
    order: now
  };
  delete np._search;
  await db.savePrompt(np);
  S.prompts.unshift(np);
  renderSidebar();
  renderContent();
  openDetail(np.id);
  toast("✓ Prompt duplicated");
}

async function deletePrompt(id) {
  const idx = S.prompts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const [removed] = S.prompts.splice(idx, 1);
  if (S.selectedId === id) closeDetail();
  renderSidebar();
  renderContent();
  if (S.pendingDeletes[id]) clearTimeout(S.pendingDeletes[id].timer);
  const timer = setTimeout(async () => {
    delete S.pendingDeletes[id];
    try {
      await db.deletePrompt(id);
    } catch (e) {}
  }, 5e3);
  S.pendingDeletes[id] = {
    prompt: removed,
    timer: timer
  };
  toast("Prompt deleted", 5e3, {
    label: "Undo",
    onClick: () => {
      const pending = S.pendingDeletes[id];
      if (!pending) return;
      clearTimeout(pending.timer);
      delete S.pendingDeletes[id];
      S.prompts.unshift(pending.prompt);
      renderSidebar();
      renderContent();
      toast("✓ Restored");
    }
  });
}

function promptModal(prompt) {
  const isEdit = !!prompt;

 id="ptype-split">Split</button>\n        </div>\n      </div>\n\n      \x3c!-- Standard body --\x3e\n      <div id="body-standard-wrap" style="${promptBodyType === "split" ? "display:none" : ""}">\n        <textarea class="form-textarea" id="f-body" placeholder="Paste your prompt here… (Markdown supported)">${esc(prompt?.bodyType === "split" ? "" : prompt?.body || "")}</textarea>\n        <div style="font-size:.7rem;color:var(--text-muted);margin-top:.25rem">Markdown is rendered in the detail view</div>\n      </div>\n\n      \x3c!-- Split pos/neg body --\x3e\n      <div id="body-split-wrap" style="${promptBodyType === "standard" ? "display:none" : ""}">\n        <div class="split-field-label">\n          <span class="split-badge pos">＋ Positive Prompt</span>\n        </div>\n        <textarea class="form-textarea" id="f-body-pos" placeholder="Describe what you want… (Markdown supported)" style="min-height:5.5rem">${esc(promptBodyType === "split" ? prompt?.body || "" : "")}</textarea>\n        <div class="split-field-label" style="margin-top:.65rem">\n          <span class="split-badge neg">− Negative Prompt</span>\n        </div>\n        <textarea class="form-textarea neg" id="f-body-neg" placeholder="Describe what to avoid… e.g. blurry, low quality, text" style="min-height:4rem">${esc(prompt?.bodyNegative || "")}</textarea>\n        <div style="font-size:.7rem;color:var(--text-muted);margin-top:.25rem">Markdown is rendered in the detail view</div>\n      </div>\n    </div>\n\n    <div class="form-row">\n      <div class="form-group"><label class="form-label">Model Used</label><input class="form-input" id="f-model" placeholder="GPT-4o, Midjourney, Sora…" value="${esc(prompt?.model || "")}"></div>\n      <div class="form-group"><label class="form-label">Output Link</label><input class="form-input" id="f-link" placeholder="https://…" value="${esc(prompt?.link || "")}"></div>\n    </div>\n    <div class="form-group">\n      <label class="form-label">Tags <span style="color:var(--text-muted);font-weight:400">(Enter or comma to add)</span></label>\n      <div class="tags-wrap" id="tags-wrap"><input class="tags-input" id="tags-inp" placeholder="Add tags…"></div>\n    </div>\n    <div class="form-group">\n      <label class="form-label">Notes</label>\n      <textarea class="form-textarea notes" id="f-notes" placeholder="Optimization notes, context, caveats… (Markdown supported)">${esc(prompt?.notes || "")}</textarea>\n      <div style="font-size:.7rem;color:var(--text-muted);margin-top:.25rem">Markdown is rendered in the detail view</div>\n    </div>\n    <div class="form-row">\n      <div class="form-group">\n        <label class="form-label">Local Preview (image/video/audio)</label>\n        <input type="file" id="f-preview-file" accept="image/*,video/*,audio/*" style="font-size:0.8rem">\n        <span style="font-size:0.7rem;color:var(--text-muted)">Upload a local file to store as thumbnail</span>\n        ${prompt?.previewData ? '<span style="font-size:0.7rem;color:var(--green)">✓ Preview attached</span>' : ""}\n      </div>\n    </div>\n    <label class="form-check"><input type="checkbox" id="f-fav"${prompt?.fav ? " checked" : ""}><label for="f-fav">Mark as favorite ❤️</label></label>\n  </div>\n  <div class="modal-foot"><button class="btn btn-ghost" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">${isEdit ? "Save Changes" : "Add Prompt"}</button></div>\n</div>`;
  document.body.appendChild(ov);
  const wrap = ov.querySelector("#tags-wrap"), inp = ov.querySelector("#tags-inp");
  function renderChips() {
    wrap.querySelectorAll(".tag-chip").forEach(el => el.remove());
    currentTags.forEach(tag => {
      const chip = document.createElement("span");
      chip.className = "tag-chip";
      chip.dataset.tag = tag;
      chip.innerHTML = `${esc(tag)}<button class="chip-x" data-tag="${esc(tag)}">×</button>`;
      chip.querySelector(".chip-x").onclick = () => {
        currentTags.delete(tag);
        renderChips();
      };
      wrap.insertBefore(chip, inp);
    });
  }
  renderChips();
  const acWrap = document.createElement("div");
  acWrap.className = "autocomplete-wrap";
  const acList = document.createElement("div");
  acList.className = "autocomplete-list";
  wrap.parentNode.insertBefore(acWrap, wrap);
  acWrap.appendChild(wrap);
  acWrap.appendChild(acList);
  let acIdx = -1;
  function addTag(tag) {
    currentTags.add(tag);
    renderChips();
    inp.value = "";
    acList.classList.remove("open");
    inp.focus();
  }
  inp.addEventListener("input", () => {
    const val = inp.value.trim().replace(/^#/, "").toLowerCase();
    acList.innerHTML = "";
    acIdx = -1;
    if (!val) {
      acList.classList.remove("open");
      return;
    }
    const matches = [ ...new Set(S.prompts.flatMap(p => p.tags || [])) ].filter(t => t.toLowerCase().includes(val) && !currentTags.has(t)).sort((a, b) => a.localeCompare(b)).slice(0, 8);
    if (!matches.length) {
      acList.classList.remove("open");
      return;
    }
    matches.forEach(t => {
      const item = document.createElement("div");
      item.className = "autocomplete-item";
      item.textContent = "#" + t;
      item.addEventListener("mousedown", e => {
        e.preventDefault();
        addTag(t);
      });
      acList.appendChild(item);
    });
    acList.classList.add("open");
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const items = acList.querySelectorAll(".autocomplete-item");
      if (!items.length) return;
      items.forEach(el => el.classList.remove("active"));
      if (e.key === "ArrowDown") acIdx = (acIdx + 1) % items.length; else acIdx = (acIdx - 1 + items.length) % items.length;
      items[acIdx].classList.add("active");
    } else if (e.key === "Enter" || e.key === ",") {
      const active = acList.querySelector(".autocomplete-item.active");
      if (active && active.textContent) {
        e.preventDefault();
        addTag(active.textContent.replace(/^#/, "").trim());
      } else {
        if (e.key === "," || e.key === "Enter") {
          e.preventDefault();
          const t = inp.value.trim().replace(/^#/, "").toLowerCase().replace(/\s+/g, "-");
          if (t) {
            currentTags.add(t);
            renderChips();
            inp.value = "";
          }
        }
      }
      acList.classList.remove("open");
    } else if (e.key === "Escape") {
      acList.classList.remove("open");
    }
  });
  const acDocHandler = e => {
    if (!acWrap.contains(e.target)) acList.classList.remove("open");
  };
  document.addEventListener("click", acDocHandler);
  const modelInput = ov.querySelector("#f-model");
  const modelAcWrap = document.createElement("div");
  modelAcWrap.className = "autocomplete-wrap";
  const modelAcList = document.createElement("div");
  modelAcList.className = "autocomplete-list";
  modelInput.parentNode.insertBefore(modelAcWrap, modelInput);
  modelAcWrap.appendChild(modelInput);
  modelAcWrap.appendChild(modelAcList);
  let modelAcIdx = -1;
  modelInput.addEventListener("input", () => {
    const val = modelInput.value.trim().toLowerCase();
    modelAcList.innerHTML = "";
    modelAcIdx = -1;
    if (!val) {
      modelAcList.classList.remove("open");
      return;
    }
    const matches = MODEL_SUGGESTIONS.filter(m => m.toLowerCase().includes(val)).slice(0, 8);
    if (!matches.length) {
      modelAcList.classList.remove("open");
      return;
    }
    matches.forEach(m => {
      const item = document.createElement("div");
      item.className = "autocomplete-item";
      item.textContent = m;
      item.addEventListener("mousedown", e => {
        e.preventDefault();
        modelInput.value = m;
        modelAcList.classList.remove("open");
        modelInput.focus();
      });
      modelAcList.appendChild(item);
    });
    modelAcList.classList.add("open");
  });
  modelInput.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const items = modelAcList.querySelectorAll(".autocomplete-item");
      if (!items.length) return;
      items.forEach(el => el.classList.remove("active"));
      if (e.key === "ArrowDown") modelAcIdx = (modelAcIdx + 1) % items.length; else modelAcIdx = (modelAcIdx - 1 + items.length) % items.length;
      items[modelAcIdx].classList.add("active");
    } else if (e.key === "Enter") {
      const active = modelAcList.querySelector(".autocomplete-item.active");
      if (active) {
        e.preventDefault();
        modelInput.value = active.textContent;
        modelAcList.classList.remove("open");
      } else {
        modelAcList.classList.remove("open");
      }
    } else if (e.key === "Escape") {
      modelAcList.classList.remove("open");
    }
  });
  const modelDocHandler = e => {
    if (!modelAcWrap.contains(e.target)) modelAcList.classList.remove("open");
  };
  document.addEventListener("click", modelDocHandler);
  const fcat = ov.querySelector("#f-cat"), fsub = ov.querySelector("#f-sub"), subReq = ov.querySelector("#sub-req");
  fcat.addEventListener("change", e => {
    const cat = allCats().find(c => c.name === e.target.value);
    fsub.innerHTML = `<option value="">None</option>${(cat?.subs || []).map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("")}`;
    if (cat?.subs?.length) {
      subReq.style.display = "";
    } else {
      subReq.style.display = "none";
    }
  });
  fcat.dispatchEvent(new Event("change"));
  if (prompt?.subcategory) {
    fsub.value = prompt.subcategory;
  }
  ov.querySelector("#ptype-standard").addEventListener("click", () => {
    promptBodyType = "standard";
    ov.querySelector("#ptype-standard").classList.add("active");
    ov.querySelector("#ptype-split").classList.remove("active");
    ov.querySelector("#body-standard-wrap").style.display = "";
    ov.querySelector("#body-split-wrap").style.display = "none";
  });
  ov.querySelector("#ptype-split").addEventListener("click", () => {
    promptBodyType = "split";
    ov.querySelector("#ptype-split").classList.add("active");
    ov.querySelector("#ptype-standard").classList.remove("active");
    ov.querySelector("#body-split-wrap").style.display = "";
    ov.querySelector("#body-standard-wrap").style.display = "none";
    const stdBody = ov.querySelector("#f-body").value.trim();
    const posField = ov.querySelector("#f-body-pos");
    if (stdBody && !posField.value.trim()) posField.value = stdBody;
  });
  ov.querySelector("#f-preview-file").addEventListener("change", e => {
    previewFile = e.target.files[0] || null;
  });
  const close = () => {
    document.removeEventListener("keydown", ctrlSHandler);
    document.removeEventListener("click", acDocHandler);
    document.removeEventListener("click", modelDocHandler);
    ov.remove();
  };
  const saveBtn = ov.querySelector("#m-save");
  function ctrlSHandler(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      saveBtn.click();
    }
  }
  document.addEventListener("keydown", ctrlSHandler);
  ov.querySelector(".modal-x").onclick = close;
  ov.querySelector("#m-cancel").onclick = close;
  ov.addEventListener("click", e => {
    if (e.target === ov) close();
  });
  let maximized = false;
  ov.querySelector("#modal-maximize").addEventListener("click", () => {
    maximized = !maximized;
    ov.querySelector(".modal").classList.toggle("maximized", maximized);
  });
  saveBtn.addEventListener("click", async () => {
    const title = ov.querySelector("#f-title").value.trim();
    const cat = ov.querySelector("#f-cat").value;
    const sub = ov.querySelector("#f-sub").value;
    if (!title) {
      ov.querySelector("#f-title").focus();
      toast("⚠ Title is required");
      return;
    }
    if (!cat) {
      ov.querySelector("#f-cat").focus();
      toast("⚠ Category is required");
      return;
    }
    const catObj = allCats().find(c => c.name === cat);
    if (catObj?.subs?.length && !sub) {
      ov.querySelector("#f-sub").focus();
      toast("⚠ Subcategory is required for this category");
      return;
    }
    let body = "", bodyNegative = "";
    if (promptBodyType === "split") {
      body = ov.querySelector("#f-body-pos").value.trim();
      bodyNegative = ov.querySelector("#f-body-neg").value.trim();
      if (!body) {
        ov.querySelector("#f-body-pos").focus();
        toast("⚠ Positive prompt is required");
        return;
      }
    } else {
      body = ov.querySelector("#f-body").value.trim();
      if (!body) {
        ov.querySelector("#f-body").focus();
        toast("⚠ Prompt body is required");
        return;
      }
    }
    const now = Date.now();
    let previewData = prompt?.previewData || null;
    if (previewFile) {
      try {
        previewData = await generateThumbnail(previewFile, 200);
      } catch (err) {
        toast("⚠ Could not generate preview – saving without");
        previewData = null;
      }
    }
    if (isEdit) {
      if (!prompt.history) prompt.history = [];
      prompt.history.push({
        title: prompt.title,
        body: prompt.body,
        bodyNegative: prompt.bodyNegative,
        bodyType: prompt.bodyType,
        category: prompt.category,
        subcategory: prompt.subcategory,
        tags: [ ...prompt.tags || [] ],
        notes: prompt.notes,
        link: prompt.link,
        model: prompt.model,
        previewData: prompt.previewData,
        version: prompt.version || 1,
        updatedAt: prompt.updatedAt,
        createdAt: prompt.createdAt
      });
    }
    const np = {
      id: prompt?.id || uid(),
      title: title,
      category: cat,
      subcategory: sub,
      bodyType: promptBodyType,
      body: body,
      bodyNegative: bodyNegative || "",
      model: modelInput.value.trim(),
      link: ov.querySelector("#f-link").value.trim(),
      tags: [ ...currentTags ],
      notes: ov.querySelector("#f-notes").value.trim(),
      fav: ov.querySelector("#f-fav").checked,
      previewData: previewData,
      history: prompt?.history || [],
      version: isEdit ? (prompt.version || 1) + 1 : 1,
      createdAt: prompt?.createdAt || now,
      updatedAt: now,
      lastUsed: prompt?.lastUsed || null,
      useCount: prompt?.useCount || 0,
      order: prompt?.order ?? now
    };
    np._search = buildSearchBlob(np);
    await db.savePrompt(np);
    if (isEdit) {
      const i = S.prompts.findIndex(p => p.id === np.id);
      if (i >= 0) S.prompts[i] = np;
    } else S.prompts.unshift(np);
    close();
    renderSidebar();
    renderContent();
    if (S.selectedId === np.id) renderDetail(np.id);
    toast(isEdit ? "✓ Prompt updated" : "✓ Prompt saved");
    maybeAutosaveAfterPromptSave();
  });
  setTimeout(() => ov.querySelector("#f-title").focus(), 60);
}

async function showManageTagsModal() {
  const tags = allTags();
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal md"><div class="modal-head"><div class="modal-title">Manage Tags</div><button class="modal-x">×</button></div>\n  <div class="modal-body" style="max-height:70vh;overflow-y:auto;">\n    <div style="font-size:0.8214rem;color:var(--text-muted);margin-bottom:0.8571rem">\n      Edit or delete tags. Changes apply to all prompts using that tag.\n    </div>\n    <div id="mt-tag-list">\n      ${tags.length === 0 ? '<div style="color:var(--text-muted);text-align:center;padding:2rem">No tags yet</div>' : tags.map(({tag: tag, count: count}) => `\n          <div class="tag-editor" data-tag="${esc(tag)}" style="display:flex;align-items:center;gap:0.5rem;padding:0.7rem 0;border-bottom:1px solid var(--border)">\n            <span style="flex:1;font-size:0.9rem;color:var(--text-primary)">#${esc(tag)}</span>\n            <span style="font-size:0.7rem;color:var(--text-muted)">${count} prompt${count !== 1 ? "s" : ""}</span>\n            <input class="form-input edit-tag-input" placeholder="Rename" style="width:8rem;display:none">\n            <button class="btn btn-ghost rename-btn" style="height:1.8rem;font-size:0.75rem;padding:0 0.6rem">Rename</button>\n            <button class="btn btn-ghost delete-btn" style="height:1.8rem;font-size:0.75rem;color:var(--red);border-color:rgba(240,107,107,.35)">Delete</button>\n            <button class="btn btn-ghost save-rename-btn" style="height:1.8rem;font-size:0.75rem;display:none">Save</button>\n            <button class="btn btn-ghost cancel-rename-btn" style="height:1.8rem;font-size:0.75rem;display:none">Cancel</button>\n          </div>\n        `).join("")}\n    </div>\n  </div>\n  <div class="modal-foot"><button class="btn btn-ghost" id="mt-close">Close</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector(".modal-x").onclick = () => ov.remove();
  ov.querySelector("#mt-close").onclick = () => ov.remove();
  ov.addEventListener("click", e => {
    if (e.target === ov) ov.remove();
  });
  const refreshTagList = () => {
    const updatedTags = allTags();
    const list = ov.querySelector("#mt-tag-list");
    if (updatedTags.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:2rem">No tags yet</div>';
      return;
    }
    list.innerHTML = updatedTags.map(({tag: tag, count: count}) => `\n      <div class="tag-editor" data-tag="${esc(tag)}" style="display:flex;align-items:center;gap:0.5rem;padding:0.7rem 0;border-bottom:1px solid var(--border)">\n        <span style="flex:1;font-size:0.9rem;color:var(--text-primary)">#${esc(tag)}</span>\n        <span style="font-size:0.7rem;color:var(--text-muted)">${count} prompt${count !== 1 ? "s" : ""}</span>\n        <input class="form-input edit-tag-input" placeholder="Rename" style="width:8rem;display:none">\n        <button class="btn btn-ghost rename-btn" style="height:1.8rem;font-size:0.75rem;padding:0 0.6rem">Rename</button>\n        <button class="btn btn-ghost delete-btn" style="height:1.8rem;font-size:0.75rem;color:var(--red);border-color:rgba(240,107,107,.35)">Delete</button>\n        <button class="btn btn-ghost save-rename-btn" style="height:1.8rem;font-size:0.75rem;display:none">Save</button>\n        <button class="btn btn-ghost cancel-rename-btn" style="height:1.8rem;font-size:0.75rem;display:none">Cancel</button>\n      </div>\n    `).join("");
    attachTagEditorListeners();
  };
  const attachTagEditorListeners = () => {
    ov.querySelectorAll(".tag-editor").forEach(row => {
      const tag = row.dataset.tag;
      const renameBtn = row.querySelector(".rename-btn");
      const deleteBtn = row.querySelector(".delete-btn");
      const saveBtn = row.querySelector(".save-rename-btn");
      const cancelBtn = row.querySelector(".cancel-rename-btn");
      const input = row.querySelector(".edit-tag-input");
      renameBtn.addEventListener("click", () => {
        input.style.display = "";
        renameBtn.style.display = "none";
        deleteBtn.style.display = "none";
        saveBtn.style.display = "";
        cancelBtn.style.display = "";
        input.value = tag;
        input.focus();
      });
      cancelBtn.addEventListener("click", () => {
        input.style.display = "none";
        renameBtn.style.display = "";
        deleteBtn.style.display = "";
        saveBtn.style.display = "none";
        cancelBtn.style.display = "none";
      });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          saveBtn.click();
        }
      });
      saveBtn.addEventListener("click", async () => {
        const newTag = input.value.trim().toLowerCase().replace(/\s+/g, "-");
        if (!newTag || newTag === tag) return;
        for (const p of S.prompts) {
          if (p.tags && p.tags.includes(tag)) {
            p.tags = p.tags.map(t => t === tag ? newTag : t);
            p._search = null;
            await db.savePrompt(p);
          }
        }
        renderSidebar();
        renderContent();
        refreshTagList();
      });
      deleteBtn.addEventListener("click", async () => {
        if (!confirm(`Delete tag #${tag} from all prompts?`)) return;
        for (const p of S.prompts) {
          if (p.tags && p.tags.includes(tag)) {
            p.tags = p.tags.filter(t => t !== tag);
            p._search = null;
            await db.savePrompt(p);
          }
        }
        renderSidebar();
        renderContent();
        refreshTagList();
      });
    });
  };
  attachTagEditorListeners();
}
