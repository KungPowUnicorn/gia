    'Claude Code', 'Codex', 'Cursor', 'GitHub Copilot', 'Devin', 'Windsurf', 'Google Antigravity',
    'Kiro', 'Replit Agent', 'Cline', 'Aider', 'Augment Code',
  ],
};
// Flattened in group order, de-duplicated (case-insensitively) so a name can
// never show up twice however the groups are edited later.
const MODEL_SUGGESTIONS = (() => {
  const seen = new Set(), out = [];
  for (const name of Object.values(MODEL_GROUPS).flat()) {
    const k = name.toLowerCase();
    if (!seen.has(k)) { seen.add(k); out.push(name); }
  }
  return out;
})();

// What to suggest: models already used in YOUR prompts first (most-used first,
// keeping your own spelling), then the curated list minus anything you've used.
function modelSuggestionPool() {
  const used = new Map();   // lowercase -> { name, n }
  for (const p of S.prompts) {
    const m = (p.model || '').trim();
    if (!m) continue;
    const k = m.toLowerCase(), e = used.get(k);
    if (e) e.n++; else used.set(k, { name: m, n: 1 });
  }
  const mine = [...used.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name)).map(e => e.name);
  const have = new Set(mine.map(x => x.toLowerCase()));
  return mine.concat(MODEL_SUGGESTIONS.filter(m => !have.has(m.toLowerCase())));
}
// Ranked matches: names that START with what you typed, then names with a word
// that starts with it ("5.5" finds "Claude Opus 5.5"), then anything containing
// it. Order within each tier is the pool order (yours first, then newest-first).
function modelMatches(query, limit = 10) {
  const q = (query || '').trim().toLowerCase();
  if (!q) return [];
  const starts = [], words = [], contains = [];
  for (const m of modelSuggestionPool()) {
    const l = m.toLowerCase(), i = l.indexOf(q);
    if (i < 0) continue;
    if (i === 0) starts.push(m);
    else if (/[\s\-._/]/.test(l[i - 1])) words.push(m);
    else contains.push(m);
  }
  return starts.concat(words, contains).slice(0, limit);
}

function allCats() {
  const merged = DEFAULT_CATS.map(def => {
    const custom = S.customCats.find(c => c.id === def.id);
    return custom ? { ...def, ...custom, subs: custom.subs !== undefined ? custom.subs : def.subs } : def;
  });
  return merged.concat(S.customCats.filter(c => !DEFAULT_CATS.find(d => d.id === c.id)));
}

/* ── QOL #16: precomputed search index ──
   Builds a single lowercased blob per prompt so filtering doesn't have to
   re-lowercase/scan five separate fields on every keystroke. The blob is
   cached in a WeakMap (see searchBlobOf), computed lazily on first use and
   dropped via invalidateSearch() whenever a prompt's searchable fields are
   edited in place. Saved prompts replaced with a new object get a fresh
   cache entry automatically.
*/
function buildSearchBlob(p) {
  return [
    p.title||'', p.body||'', p.bodyNegative||'', p.notes||'',
    p.model||'', p.category||'', p.subcategory||'', (p.tags||[]).join(' ')
  ].join(' \u0001 ').toLowerCase();
}
// Bugfix: the blob used to be cached as a `_search` property ON the prompt
// object, which meant it got serialized into IndexedDB records, manual
// backups, exports and every auto-save file (a full lowercase copy of each
// prompt's text, inflating all of them). A WeakMap keeps the cache entirely
// off the data objects — it can't leak into any serialization path, and
// entries are garbage-collected automatically with their prompt.
const searchCache = new WeakMap();
function searchBlobOf(p) {
  let blob = searchCache.get(p);
  if (blob === undefined) { blob = buildSearchBlob(p); searchCache.set(p, blob); }
  return blob;
}
function invalidateSearch(p) { searchCache.delete(p); }

// Filters and sorts the prompt list based on the current state
function filteredPrompts() {
  let ps = [...S.prompts];
  const { type, val, search } = S.filter;
  if (type === 'fav') ps = ps.filter(p => p.fav);
  else if (type === 'used') ps = ps.filter(p => (p.useCount||0) > 0);
  else if (type === 'cat') ps = ps.filter(p => p.category === val);
  else if (type === 'sub') { const [cat,sub]=val.split('::'); ps = ps.filter(p=>p.category===cat&&p.subcategory===sub); }
  else if (type === 'tag') ps = ps.filter(p => (p.tags||[]).includes(val));

  const q = (search||'').toLowerCase().trim();
  if (q) {
    ps = ps.filter(p => searchBlobOf(p).includes(q));
  }

  // QOL #10: relevance ranking while a search query is active.
  // Title matches rank highest, then tags, then everything else. Ties fall
  // back to the normal sort order so results still feel stable.
  if (q) {
    const scoreOf = p => {
      let score = 0;
      const title = (p.title||'').toLowerCase();
      if (title === q) score += 100;
      else if (title.startsWith(q)) score += 60;
      else if (title.includes(q)) score += 40;
      if ((p.tags||[]).some(t => t.toLowerCase() === q)) score += 30;
      else if ((p.tags||[]).some(t => t.toLowerCase().includes(q))) score += 15;
      if ((p.category||'').toLowerCase().includes(q)) score += 8;
      if ((p.model||'').toLowerCase().includes(q)) score += 5;
      return score;
    };
    ps.sort((a,b) => scoreOf(b)-scoreOf(a) || (b.updatedAt||0)-(a.updatedAt||0));
    if (type === 'used') ps.sort((a,b)=> scoreOf(b)-scoreOf(a) || (b.useCount||0)-(a.useCount||0));
    return ps;
  }

  if (type === 'used') { ps.sort((a,b)=>(b.useCount||0)-(a.useCount||0) || (b.updatedAt||0)-(a.updatedAt||0)); return ps; }

  // Sort
  switch (S.sort) {
    case 'newest': ps.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)); break;
    case 'oldest': ps.sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0)); break;
    case 'az': ps.sort((a,b)=>(a.title||'').localeCompare(b.title||'')); break;
    case 'za': ps.sort((a,b)=>(b.title||'').localeCompare(a.title||'')); break;
    case 'favs': ps.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0) || (b.updatedAt||0)-(a.updatedAt||0)); break;
    case 'mostused': ps.sort((a,b)=>(b.useCount||0)-(a.useCount||0) || (b.updatedAt||0)-(a.updatedAt||0)); break;
    case 'manual': ps.sort((a,b)=>(a.order??a.createdAt??0)-(b.order??b.createdAt??0)); break;
    default: ps.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  }
  return ps;
}

// Returns a sorted list of tags with their occurrence count
function allTags() {
  const m={};
  S.prompts.forEach(p=>(p.tags||[]).forEach(t=>{m[t]=(m[t]||0)+1;}));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([tag,count])=>({tag,count}));
}

// Returns a map of category names to prompt counts
function catCounts() {
  const m={};
  S.prompts.forEach(p=>{ const k=p.category||'other'; m[k]=(m[k]||0)+1; });
  return m;
}

/* ═══════════════════════════════════════════════════
   THUMBNAIL GENERATION
   ═══════════════════════════════════════════════════ */
function generateThumbnail(fileObj, maxW = 200) {
  return new Promise((resolve, reject) => {
    const type = fileObj.type.split('/')[0];
    if (type === 'image') {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(img.src);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error('Image load error')); };
      img.src = URL.createObjectURL(fileObj);
    } else if (type === 'video') {
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.muted = true;
      video.playsInline = true;
      const blobUrl = URL.createObjectURL(fileObj);
      const timeout = setTimeout(() => { URL.revokeObjectURL(blobUrl); reject(new Error('Video thumbnail timed out')); }, 8000);
      video.onloadedmetadata = () => { video.currentTime = Math.min(1, video.duration * 0.1); };
      video.onseeked = () => {
        clearTimeout(timeout);
        const canvas = document.createElement('canvas');
        canvas.width = 320; canvas.height = 180;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(blobUrl);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      video.onerror = () => { clearTimeout(timeout); URL.revokeObjectURL(blobUrl); reject(new Error('Video loading failed')); };
      video.src = blobUrl;
    } else {
      resolve(null);
    }
  });
}

/* ═══════════════════════════════════════════════════
   PREVIEW HTML
   ═══════════════════════════════════════════════════ */
const IMG_EXT = /\.(jpg|jpeg|png|gif|webp|svg|avif)(\?.*)?$/i;
const VIDEO_EXT = /\.(mp4|webm|ogg)(\?.*)?$/i;

function getPreviewHTML(p, cat) {
  if (p.previewData && p.previewData.startsWith('data:image')) {
    return `<div class="card-thumb"><img src="${p.previewData}" loading="lazy" alt=""></div>`;
  }
  if (p.link) {
    if (IMG_EXT.test(p.link)) {
      return `<div class="card-thumb"><img src="${esc(p.link)}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.closest('.card-thumb').style.display='none'"></div>`;
    }
    if (VIDEO_EXT.test(p.link)) {
      return `<div class="card-thumb"><video muted preload="metadata"><source src="${esc(p.link)}"></video><div class="thumb-icon" style="position:absolute">▶</div></div>`;
    }
  }
  const color = cat?.color || 'var(--text-muted)';
  const icon = getCatIcon(cat);
  return `<div class="card-thumb" style="background:${color}22; border-color:${color}55;">
    <div class="thumb-icon" style="color:${color}">${icon}</div>
  </div>`;
}

// Takes the element that was just filled with buildPromptView().body and
// fills its preview slot. (Looked up by class within that root rather than by
// a global id: the side panel, the reader and the tab view can all show a
// prompt at the same time, and duplicate ids would make getElementById hit
// whichever one happens to come first in the document.)
function renderDetailPreview(p, root) {
  const cont = (root || document).querySelector('.det-preview-cont');
  if (!cont) return;
  if (p.previewData && p.previewData.startsWith('data:image')) {
    cont.innerHTML = `<div class="det-preview-wrap"><img src="${p.previewData}" alt="Preview"></div>`;
  } else if (p.link) {
    if (IMG_EXT.test(p.link)) {
      cont.innerHTML = `<div class="det-preview-wrap"><img src="${esc(p.link)}" referrerpolicy="no-referrer" alt="Preview" onerror="this.closest('.det-preview-wrap').innerHTML='<div class=\\'preview-placeholder\\'><span>🖼️</span>Image could not load</div>'"></div>`;
    } else if (VIDEO_EXT.test(p.link)) {
      cont.innerHTML = `<div class="det-preview-wrap"><video controls style="max-width:100%;max-height:14rem"><source src="${esc(p.link)}"></video></div>`;
    } else {
      cont.innerHTML = `<div class="det-preview-wrap"><div class="preview-placeholder"><span>🔗</span><a href="${esc(p.link)}" target="_blank" rel="noopener" style="color:var(--blue);font-size:0.8rem">Open link</a></div></div>`;
    }
  } else {
    cont.innerHTML = '';
  }
}

/* ═══════════════════════════════════════════════════
   SIDEBAR RENDERING
   ═══════════════════════════════════════════════════ */
let catToggleListenerAdded = false;

// Perf: delegated sidebar click handling, bound ONCE (see initEvents) instead
// of being re-attached to every category/subcategory/tag row on every
// renderSidebar() call — which, unlike the content grid, fires on nearly
// every user action (favoriting, deleting, saving, filtering), making the
// old per-render rebinding one of the bigger hidden costs in the app.
function initSidebarDelegation() {
  const catEl = document.getElementById('cat-list');
  catEl.addEventListener('click', e => {
    const subEl = e.target.closest('.sub-item');
    if (subEl) {
      e.stopPropagation();
      const catObj = allCats().find(c => c.name === subEl.dataset.cat);
      if (catObj) S.openCats.add(catObj.id);
      setFilter('sub', `${subEl.dataset.cat}::${subEl.dataset.sub}`);
      if (window.innerWidth <= 850) document.getElementById('sidebar').classList.remove('open');
      return;
    }
    const headerEl = e.target.closest('.cat-header');
    if (headerEl) {
      const id = headerEl.dataset.id;
      if (S.openCats.has(id)) S.openCats.delete(id); else S.openCats.add(id);
      setFilter('cat', headerEl.dataset.cat);
    }
  });

  const tagsCloud = document.getElementById('tags-cloud');
  tagsCloud.addEventListener('click', e => {
    const tagEl = e.target.closest('.sb-tag');
    if (!tagEl) return;
    setFilter('tag', tagEl.dataset.tag);
    if (window.innerWidth <= 850) document.getElementById('sidebar').classList.remove('open');
  });
}

// Every mutation in the app already ends with renderSidebar()/renderContent().
// Hooking the wrappers means an open reader or standalone view refreshes
// itself after ANY change (edit, favorite, delete, undo, import, restore…)
// without touching those dozens of call sites. In a standalone tab the
// library UI is hidden, so rendering it would be wasted work.
function renderSidebar() { if (STANDALONE) return; renderSidebarInner(); }
function renderSidebarInner() {
  const favN = S.prompts.filter(p=>p.fav).length;
  const usedN = S.prompts.filter(p=>(p.useCount||0)>0).length;
  document.getElementById('fav-count').textContent = favN;
  document.getElementById('used-count').textContent = usedN;
  document.getElementById('all-count').textContent = S.prompts.length;
  document.getElementById('stat-count').textContent = `${S.prompts.length} prompt${S.prompts.length!==1?'s':''}`;

  document.getElementById('sb-all').classList.toggle('active', S.filter.type==='all');
  document.getElementById('sb-fav').classList.toggle('active', S.filter.type==='fav');
  document.getElementById('sb-used').classList.toggle('active', S.filter.type==='used');

  const cats = allCats();
  const counts = catCounts();
  const catEl = document.getElementById('cat-list');
  catEl.innerHTML = cats.map(cat => {
    const count = counts[cat.name] || 0;
    const isActive = S.filter.type==='cat' && S.filter.val===cat.name;
    const isOpen = S.openCats.has(cat.id);
    return `<div>
      <div class="cat-header${isActive?' active':''}" data-cat="${esc(cat.name)}" data-id="${esc(cat.id)}">
        <span style="font-size:1.1429rem">${getCatIcon(cat)}</span>
        <span>${esc(cat.name)}</span>
        <span class="sb-count">${count}</span>
      </div>
      ${cat.subs?.length ? `<div class="cat-subs${isOpen?' open':''}" id="subs-${esc(cat.id)}">
        ${cat.subs.map(sub=>{
          const isSubActive=S.filter.type==='sub'&&S.filter.val===`${cat.name}::${sub}`;
          const sc=S.prompts.filter(p=>p.category===cat.name&&p.subcategory===sub).length;
          return `<div class="sub-item${isSubActive?' active':''}" data-cat="${esc(cat.name)}" data-sub="${esc(sub)}"><span style="color:var(--text-muted);font-size:0.7143rem">└</span>${esc(sub)}${sc?`<span style="margin-left:auto;font-size:0.6786rem;color:var(--text-muted)">${sc}</span>`:''}</div>`;
        }).join('')}
      </div>`:''}
    </div>`;
  }).join('');

  const tags = allTags();
  const tagsCloud = document.getElementById('tags-cloud');
  tagsCloud.innerHTML = tags.map(({tag,count})=>{
    const active=S.filter.type==='tag'&&S.filter.val===tag;
    return `<span class="sb-tag${active?' active':''}" data-tag="${esc(tag)}">#${esc(tag)}<span style="opacity:.5;margin-left:0.2143rem;font-size:0.6786rem">${count}</span></span>`;
  }).join('');

  // Show the cloud if a tag filter is active, otherwise keep it hidden
  if (S.filter.type === 'tag') {
    tagsCloud.classList.remove('hidden');
  }

  // Perf/bugfix: category/subcategory/tag clicks are now handled by a single
  // delegated listener (initSidebarDelegation, bound once — see below)
  // instead of being rebound to every row on every renderSidebar() call.
  // renderSidebar() runs very often (every favorite toggle, delete, save,
  // filter change), so the old per-render binding was a real, frequently-paid
  // cost, not just a one-time setup expense.

  // The Categories label toggles all subcategory lists
  if (!catToggleListenerAdded) {
    document.getElementById('cat-toggle').addEventListener('click', () => {
      const cats2 = allCats();
      const anyOpen = cats2.some(c => S.openCats.has(c.id));
      if (anyOpen) S.openCats.clear();
      else cats2.forEach(c => { if (c.subs?.length) S.openCats.add(c.id); });
      renderSidebar();
    });
    catToggleListenerAdded = true;
  }
}

/* ═══════════════════════════════════════════════════
   CONTENT RENDERING (grid or list)
   ═══════════════════════════════════════════════════ */
function renderContent() {
  if (STANDALONE) { if (SOLO_ID) syncSolo(); return; }
  renderContentInner();
  syncReader();
}
function renderContentInner() {
  const fps = filteredPrompts();
  const wrap = document.getElementById('prompts-wrap');

  // Update header text
  let title='All Prompts';
  if(S.filter.type==='fav') title='❤️ Favorites';
  else if(S.filter.type==='used') title='📈 Most Used';
  else if(S.filter.type==='cat'&&S.filter.val) title=S.filter.val;
  else if(S.filter.type==='sub'&&S.filter.val) title=S.filter.val.split('::').join(' › ');
  else if(S.filter.type==='tag'&&S.filter.val) title=`#${S.filter.val}`;
  if(S.filter.search) title+= ' — "'+S.filter.search+'"';

  document.getElementById('content-title').textContent = title;
  document.getElementById('content-count').textContent = `${fps.length} prompt${fps.length!==1?'s':''}`;

  // Empty state
  if(fps.length===0){
    wrap.className=''; wrap.style.cssText='flex:1;display:flex;align-items:center;justify-content:center;';
    // Reliability: if the whole library looks empty (not just a filtered
    // view) and there's an auto-save on record, offer a direct way back in
    // rather than leaving the person to dig through Settings while panicking.
    const showRestoreCta = S.filter.type==='all' && !S.filter.search && S.prompts.length===0 && autosaveDirHandle;
    wrap.innerHTML=`<div class="empty-state">
      <div class="empty-icon">${S.prompts.length===0?'📭':'🔍'}</div>
      <h3>${S.prompts.length===0?'No prompts yet':'No results found'}</h3>
      <p>${S.prompts.length===0?'Press <kbd>N</kbd> or click "New Prompt" to start building your library.':'Try different search terms or clear the filter.'}</p>
      ${showRestoreCta ? '<button class="btn btn-ghost" id="empty-restore-autosave" style="margin-top:0.5rem">Library looks empty — Restore from Last Auto-Save</button>' : ''}
    </div>`;
    document.getElementById('empty-restore-autosave')?.addEventListener('click', restoreFromLastAutosave);
    S.focusIndex = -1;
    return;
  }

  wrap.style.cssText='';
  const manualDrag = (S.sort === 'manual' && S.view === 'list' && !S.filter.search);
  // Perf: compute these ONCE per render instead of once per prompt. allCats()
  // rebuilds the merged category array and buildHighlightRegex() compiles a
  // RegExp; both were previously being redone inside cardHTML/listItemHTML
  // for every single row, every single keystroke.
  const catsList = allCats();
  const hlRe = buildHighlightRegex(S.filter.search);
  renderCtx = { catsList, hlRe, manualDrag };
  // Perf: render only a window of the results (see RENDER_CHUNK) and append
  // more as the user scrolls. Previously EVERY matching prompt was built and
  // inserted at once, so a 3,000-prompt library meant thousands of DOM nodes
  // (plus a full rebuild of all of them) on every favorite-toggle, sort
  // change, view switch or broad search.
  const shown = fps.slice(0, S.renderLimit);
  S.renderedCount = shown.length;
  wrap.className = S.view==='grid' ? 'prompts-grid' : 'prompts-list';
  wrap.innerHTML = shown.map(p=>itemHTMLFor(p)).join('');

  // Perf: listeners are delegated once on #prompts-wrap (see
  // initContentDelegation, called a single time from initEvents) instead of
  // being re-attached to every card/button on every render. Nothing to bind
  // here anymore — just the lightweight state below.

  // Highlight the currently selected prompt
  if(S.selectedId){
    const sel=wrap.querySelector(`[data-card="${S.selectedId}"],[data-li="${S.selectedId}"]`);
    if(sel) sel.classList.add('selected');
  }

  // Restore keyboard focus ring if applicable
  applyKbdFocus();
}

const RENDER_CHUNK = 60;
let renderCtx = { catsList: null, hlRe: null, manualDrag: false };
function itemHTMLFor(p) {
  return S.view === 'grid'
    ? cardHTML(p, renderCtx.catsList, renderCtx.hlRe)
    : listItemHTML(p, renderCtx.manualDrag, renderCtx.catsList, renderCtx.hlRe);
}
// Appends the next slice of results to the DOM without rebuilding what's
// already there. Returns false when everything is already rendered.
function renderMoreItems(count = RENDER_CHUNK) {
  const wrap = document.getElementById('prompts-wrap');
  const fps = filteredPrompts();
  if (S.renderedCount >= fps.length) return false;
  const next = fps.slice(S.renderedCount, S.renderedCount + count);
  wrap.insertAdjacentHTML('beforeend', next.map(p => itemHTMLFor(p)).join(''));
  S.renderedCount += next.length;
  S.renderLimit = Math.max(S.renderLimit, S.renderedCount);
  if (S.selectedId) wrap.querySelector(`[data-card="${S.selectedId}"],[data-li="${S.selectedId}"]`)?.classList.add('selected');
  return true;
}
// Make sure the item at `idx` exists in the DOM (needed for keyboard nav,
// which can step past the currently-rendered window).
function ensureRendered(idx) { while (S.renderedCount <= idx && renderMoreItems()) {} }
// Call when the result SET changes (filter/search/sort/view) so the window
// starts small again and the scroll position returns to the top.
function resetRenderWindow() {
  S.renderLimit = RENDER_CHUNK;
  const wrap = document.getElementById('prompts-wrap');
  if (wrap) wrap.scrollTop = 0;
}

// Perf: all click/dblclick/drag handling for cards and list rows lives here,
// bound ONCE to the (never-replaced) #prompts-wrap container, instead of
// being re-attached to every individual card/button on every render. Event
// delegation relies on bubbling + e.target.closest(), so it keeps working
// correctly even though renderContent() wipes and rebuilds the wrap's
// innerHTML on every search/filter/sort change.
function initContentDelegation() {
  const wrap = document.getElementById('prompts-wrap');

  // Load the next chunk when the user nears the bottom of what's rendered.
  wrap.addEventListener('scroll', () => {
    if (wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 700) renderMoreItems();
  }, { passive: true });

  wrap.addEventListener('click', e => {
    const favBtn = e.target.closest('.fav-btn,.li-fav');
    if (favBtn) { e.stopPropagation(); toggleFav(favBtn.dataset.id); return; }
    const copyBtn = e.target.closest('.ca-btn.copy,.la-btn.copy');
    if (copyBtn) { e.stopPropagation(); copyPrompt(copyBtn.dataset.id); return; }
    const editBtn = e.target.closest('.ca-btn.edit,.la-btn.edit');
    if (editBtn) { e.stopPropagation(); openEdit(editBtn.dataset.id); return; }
    const dupBtn = e.target.closest('.ca-btn.dup,.la-btn.dup');
    if (dupBtn) { e.stopPropagation(); duplicatePrompt(dupBtn.dataset.id); return; }
    const delBtn = e.target.closest('.ca-btn.del,.la-btn.del');
    if (delBtn) { e.stopPropagation(); deletePrompt(delBtn.dataset.id); return; }
    if (e.target.closest('.li-title-edit')) return; // mid-rename, ignore row click
    const link = e.target.closest('a.title-link');
    // Ctrl/⌘-click on the title link: let the BROWSER open it in a new tab —
    // it's a real link, so that (and middle-click, and "Copy link") just work.
    if (link && (e.ctrlKey || e.metaKey)) return;
    if (link) e.preventDefault();   // plain click keeps its old meaning: open the side panel
    const row = e.target.closest('[data-card],[data-li]');
    if (row) {
      const id = row.dataset.card || row.dataset.li;
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); openPromptTab(id); return; }       // anywhere else on the card
      if (e.shiftKey) { e.preventDefault(); window.getSelection?.().removeAllRanges(); openPromptWindow(id); return; }  // Shift+click: pop-up window
      const items = Array.from(wrap.querySelectorAll('[data-card],[data-li]'));
      S.focusIndex = items.indexOf(row);
      openDetail(id);
    }
  });

  // Middle-click anywhere on a card opens a new tab (links handle their own).
  wrap.addEventListener('mousedown', e => {
    if (e.button === 1 && !e.target.closest('a, button') && e.target.closest('[data-card],[data-li]')) e.preventDefault(); // no autoscroll cursor
  });
  wrap.addEventListener('auxclick', e => {
    if (e.button !== 1 || e.target.closest('a, button')) return;
    const row = e.target.closest('[data-card],[data-li]');
    if (row) { e.preventDefault(); openPromptTab(row.dataset.card || row.dataset.li); }
  });

  // QOL #14: inline quick-edit of the title in list view (double-click).
  wrap.addEventListener('dblclick', e => {
    const titleEl = e.target.closest('.li-title');
    if (titleEl) { e.stopPropagation(); startInlineTitleEdit(titleEl, titleEl.dataset.id); return; }
    // Double-click anywhere else on a card/row opens the reader. (On a list
    // row's title it still means "rename", as before.)
    if (e.target.closest('button, input, a')) return;
    const row = e.target.closest('[data-card],[data-li]');
    if (row) { window.getSelection?.().removeAllRanges(); openPromptDefault(row.dataset.card || row.dataset.li); }
  });

  // QOL #15: native drag-and-drop reordering (only meaningful in list view
  // while "Manual order" sort is selected and no search filter is active;
  // rows simply won't carry draggable="true" otherwise, so these no-op).
  let dragSrcId = null;
  wrap.addEventListener('dragstart', e => {
    const item = e.target.closest('.list-item[draggable="true"]');
    if (!item) return;
    dragSrcId = item.dataset.li;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  wrap.addEventListener('dragend', e => {
    const item = e.target.closest('.list-item');
    if (item) item.classList.remove('dragging');
  });
  wrap.addEventListener('dragover', e => {
    const item = e.target.closest('.list-item[draggable="true"]');
    if (!item) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  wrap.addEventListener('drop', async e => {
    const item = e.target.closest('.list-item[draggable="true"]');
    if (!item) return;
    e.preventDefault();
    const targetId = item.dataset.li;
    if (!dragSrcId || dragSrcId === targetId) return;
    await reorderPrompts(dragSrcId, targetId);
    dragSrcId = null;
  });
}

/* ── QOL #14: inline title rename in list view ── */
function startInlineTitleEdit(titleEl, id) {
  const p = S.prompts.find(x=>x.id===id);
  if (!p) return;
  const original = p.title || '';
  const input = document.createElement('input');
  input.className = 'li-title-edit';
  input.value = original;
  titleEl.replaceWith(input);
  input.focus(); input.select();

  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    const val = input.value.trim();
    if (val && val !== original) {
      p.title = val; p.updatedAt = Date.now(); invalidateSearch(p);
      await db.savePrompt(p);
      if (S.selectedId === id) renderDetail(id);
      renderSidebar();
    }
    renderContent();
  };
  input.addEventListener('keydown', e=>{
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { done = true; renderContent(); }
  });
  input.addEventListener('blur', commit);
}

/* ── QOL #15: manual drag-to-reorder persistence ──
   Reassigns the `order` field for every prompt currently in view so the
   dragged item lands just before/after its drop target, then persists
   the changed rows to IndexedDB.
*/
async function reorderPrompts(srcId, targetId) {
  // Bugfix: this used to renumber only the prompts in the CURRENT VIEW
  // (0..k), while everything outside the view kept its old, timestamp-sized
  // `order`. Dragging one item inside a filtered view therefore flung every
  // item in that view ahead of every item outside it in the full library.
  // The move is now applied to the entire manually-ordered library and the
  // whole sequence renumbered, so only the dragged item changes position
  // relative to the rest.
  const full = [...S.prompts].sort((a,b)=>(a.order??a.createdAt??0)-(b.order??b.createdAt??0));
  const srcIdx = full.findIndex(p=>p.id===srcId);
  const tgtIdx = full.findIndex(p=>p.id===targetId);
  if (srcIdx === -1 || tgtIdx === -1 || srcIdx === tgtIdx) return;
  const [moved] = full.splice(srcIdx, 1);
  full.splice(tgtIdx, 0, moved);
  const changed = [];
  full.forEach((p, i) => { if (p.order !== i) { p.order = i; changed.push(p); } });
  for (const p of changed) await db.savePrompt(p);
  renderContent();
}

/* ═══════════════════════════════════════════════════
   KEYBOARD NAVIGATION (QOL #3)
   ═══════════════════════════════════════════════════ */
function applyKbdFocus() {
  document.querySelectorAll('.kbd-focus').forEach(el=>el.classList.remove('kbd-focus'));
  if (S.focusIndex < 0) return;
  const items = document.querySelectorAll('[data-card],[data-li]');
  const el = items[S.focusIndex];
  if (el) el.classList.add('kbd-focus');
}
function moveKbdFocus(delta) {
  const fps = filteredPrompts();
  if (!fps.length) return;
  if (S.focusIndex < 0) S.focusIndex = 0;
  else S.focusIndex = Math.max(0, Math.min(fps.length-1, S.focusIndex + delta));
  ensureRendered(S.focusIndex);
  applyKbdFocus();
  const items = document.querySelectorAll('[data-card],[data-li]');
  const el = items[S.focusIndex];
  if (el) el.scrollIntoView({ block:'nearest' });
}
function openFocusedPrompt() {
  const fps = filteredPrompts();
  if (S.focusIndex >= 0 && fps[S.focusIndex]) openDetail(fps[S.focusIndex].id);
}
function deleteFocusedPrompt() {
  const fps = filteredPrompts();
  if (S.focusIndex >= 0 && fps[S.focusIndex]) deletePrompt(fps[S.focusIndex].id);
}

/* ═══════════════════════════════════════════════════
   DETAIL PANEL
   ═══════════════════════════════════════════════════ */
/* ── Shared prompt view ──
   One place builds the HTML for a prompt, used by the side panel, the reader
   modal and the standalone tab/window view, so all three always look and
   behave the same. `ctx` ('panel' | 'reader' | 'solo') namespaces the DOM id
   of the copy menu so several views of the same prompt can coexist, and
   decides the section order: the panel keeps its compact layout (details
   first), while the reader and tab view are for READING, so the prompt
   itself comes first and the metadata drops to the bottom.
*/
function buildPromptView(p, ctx) {
  const isSplit = p.bodyType === 'split';
  const sub = `${p.category||''}${p.subcategory?' › '+p.subcategory:''}`;
  const menuId = `copy-menu-${ctx}-${p.id}`;

  // Build prompt display (standard or split)
  let promptSection = '';
  if (isSplit) {
    promptSection = `
      <div class="det-sec">
        <div class="det-label" style="display:flex;align-items:center;gap:.5rem">
          Prompt
          <span class="split-badge pos">＋ Positive</span>
        </div>
        <div class="resizable-prompt">
          <button class="expand-btn" onclick="toggleFullpagePrompt(this.parentElement)" title="Full page">⛶</button>
        <div class="det-prompt-md">${renderMarkdown(p.body||'')}</div>
        </div>
        <div style="margin-top:.5rem"></div>
        <div class="det-label"><span class="split-badge neg">− Negative</span></div>
        <div class="resizable-prompt">
          <button class="expand-btn" onclick="toggleFullpagePrompt(this.parentElement)" title="Full page">⛶</button>
        <div class="det-prompt-md" style="border-color:rgba(240,107,107,0.2)">${renderMarkdown(p.bodyNegative||'<em style="opacity:.4">No negative prompt</em>')}</div>
        </div>
      </div>`;
  } else {
    promptSection = `
      <div class="det-sec">
        <div class="det-label">Prompt</div>
        <div class="resizable-prompt">
            <button class="expand-btn" onclick="toggleFullpagePrompt(this.parentElement)" title="Full page">⛶</button>
        <div class="det-prompt-md">${renderMarkdown(p.body||'')}</div>
        </div>
      </div>`;
  }

  const previewHTML = '<div class="det-preview-cont"></div>';
  const metaHTML = `
      <div class="det-meta-row">
        <div class="meta-pill"><span>Created</span> ${fmtDate(p.createdAt)}</div>
        <div class="meta-pill"><span>Updated</span> ${fmtDate(p.updatedAt)}</div>
        <div class="meta-pill"><span>Last used</span> ${p.lastUsed?fmtDate(p.lastUsed):'—'}</div>
        <div class="meta-pill"><span>Used</span> ${p.useCount||0}×</div>
        <div class="meta-pill"><span>Model</span> ${esc(p.model||'—')}</div>
        <div class="meta-pill"><span>Version</span> v${p.version||1}</div>
        <div class="meta-pill"><span>Type</span> ${isSplit?'Pos/Neg':'Standard'}</div>
        <div class="meta-pill"><span>Length</span> ${(p.body||'').length} chars</div>
      </div>`;
  const tagsHTML = p.tags?.length ? `<div class="det-sec"><div class="det-label">Tags</div><div style="display:flex;flex-wrap:wrap;gap:0.2857rem">${p.tags.map(t=>`<span class="tag-pill" style="font-size:0.7857rem;padding:0.1429rem 0.5714rem">#${esc(t)}</span>`).join('')}</div></div>` : '';
  const notesHTML = p.notes ? `<div class="det-sec">
      <div class="det-label">Notes</div>
      <div class="det-notes-md">${renderMarkdown(p.notes)}</div>
    </div>` : '';
  const linkHTML = p.link ? `<div class="det-sec"><div class="det-label">Output Link</div>
      <a href="${esc(p.link)}" target="_blank" rel="noopener" class="det-link">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        ${esc(p.link.length>55?p.link.substring(0,55)+'…':p.link)}
      </a>
    </div>` : '';

  const body = ctx === 'panel'
    ? previewHTML + metaHTML + tagsHTML + notesHTML + linkHTML + promptSection
    : previewHTML + promptSection + tagsHTML + notesHTML + linkHTML + metaHTML;

  const foot = `
    <div class="split-copy-wrap">
      <button class="btn btn-primary" style="border-top-right-radius:0;border-bottom-right-radius:0" onclick="copyPrompt('${p.id}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy${isSplit?' POS':''}
      </button>
      <button class="copy-caret" style="border-top-left-radius:0;border-bottom-left-radius:0" onclick="event.stopPropagation();toggleCopyMenu('${p.id}','${ctx}')" title="Copy as…">▾</button>
      <div class="copy-menu" id="${menuId}">
        <button class="copy-menu-item" onclick="copyPromptVariant('${p.id}','body',false)">Copy Markdown (as written)</button>
        <button class="copy-menu-item" onclick="copyPromptVariant('${p.id}','body',true)">Copy plain text (markdown stripped)</button>
      </div>
    </div>
    ${isSplit && p.bodyNegative ? `<button class="btn btn-ghost" onclick="copyNegative('${p.id}')">Copy NEG</button>` : ''}

      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit
    </button>
    <button class="btn btn-ghost" onclick="duplicatePrompt('${p.id}')">Duplicate</button>
    <button class="btn btn-ghost" onclick="exportPromptFile('${p.id}')">Export</button>
    <button class="btn btn-ghost" onclick="showVersionHistory('${p.id}')">History</button>
    <button class="btn btn-ghost" style="color:var(--red);border-color:rgba(240,107,107,.35)" onclick="deletePrompt('${p.id}')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>
  `;
  return { sub, body, foot };
}

function renderDetail(id) {
  const p = S.prompts.find(x=>x.id===id);
  if(!p) return;
  const v = buildPromptView(p, 'panel');
  document.getElementById('det-title').textContent = p.title||'Untitled';
  document.getElementById('det-sub').textContent = v.sub;
  document.getElementById('det-open-btns').innerHTML = openButtonsHTML(p.id);
  const body = document.getElementById('det-body');
  body.innerHTML = v.body;
  document.getElementById('det-foot').innerHTML = v.foot;
  renderDetailPreview(p, body);
}

/* ── Reader: the prompt in a large dialog ──
   Opens over the library with the full rendered text, every action, and
   previous/next arrows that step through the list as it was when you opened
   it. The order is snapshotted at open time so it stays stable even though
   editing or favoriting can re-sort the underlying list. */
let reader = null; // { el, id, ids, prevId, nextId }
const byId = id => S.prompts.find(p => p.id === id);
function topOverlay() { const all = document.querySelectorAll('.overlay'); return all.length ? all[all.length - 1] : null; }

function openReader(id, ids) {
  if (!byId(id)) return;
  if (reader && reader.el.isConnected) { reader.id = id; if (ids) reader.ids = ids; renderReader(true); return; }
  const ov = document.createElement('div'); ov.className = 'overlay reader-overlay';
  ov.innerHTML = `<div class="modal reader" role="dialog" aria-modal="true" aria-label="Prompt reader">
    <div class="modal-head reader-head">
      <div class="reader-nav">
        <button class="icon-btn" id="rd-prev" type="button" title="Previous prompt (←)" aria-label="Previous prompt">‹</button>
        <span class="reader-pos" id="rd-pos"></span>
        <button class="icon-btn" id="rd-next" type="button" title="Next prompt (→)" aria-label="Next prompt">›</button>
      </div>
      <div class="reader-titles"><div class="modal-title" id="rd-title"></div><div class="det-sub" id="rd-sub"></div></div>
      <div id="rd-open"></div>
      <button class="modal-x" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="rd-body" tabindex="-1"></div>
    <div class="det-foot" id="rd-foot"></div>
  </div>`;
  document.body.appendChild(ov);
  reader = { el: ov, id, ids: ids || filteredPrompts().map(p => p.id), prevId: null, nextId: null };
  ov._close = closeReader;
  ov.querySelector('.modal-x').onclick = closeReader;
  ov.addEventListener('click', e => { if (e.target === ov) closeReader(); });
  ov.querySelector('#rd-prev').onclick = () => readerStep(-1);
  ov.querySelector('#rd-next').onclick = () => readerStep(1);
  renderReader(true);
  ov.querySelector('#rd-body').focus();   // so PageUp/PageDown scroll it straight away
}
function closeReader() { if (reader) { reader.el.remove(); reader = null; } }
function readerStep(delta) {
  if (!reader) return;
  const target = delta < 0 ? reader.prevId : reader.nextId;
  if (!target) return;
  reader.id = target;
  renderReader(true);
  if (S.selectedId) openDetail(target);   // if the side panel is open, let it follow along
}
function renderReader(resetScroll) {
  if (!reader) return;
  if (!reader.el.isConnected) { reader = null; return; }   // closed by some other path
  let p = byId(reader.id);
  if (!p) {
    // The prompt was deleted while open: move to its neighbour, else close.
    const alt = [reader.nextId, reader.prevId].find(x => x && byId(x));
    if (!alt) { closeReader(); return; }
    reader.id = alt; p = byId(alt); resetScroll = true;
  }
  const live = new Set(S.prompts.map(x => x.id));
  let ids = reader.ids.filter(x => live.has(x));
  let i = ids.indexOf(p.id);
  if (i < 0) { ids = [p.id]; i = 0; }
  reader.prevId = ids[i - 1] || null;
  reader.nextId = ids[i + 1] || null;

  const v = buildPromptView(p, 'reader'), el = reader.el;
  el.querySelector('#rd-title').textContent = p.title || 'Untitled';
  el.querySelector('#rd-sub').textContent = v.sub;
  el.querySelector('#rd-pos').textContent = ids.length > 1 ? `${i + 1} / ${ids.length}` : '';
  el.querySelector('#rd-prev').disabled = !reader.prevId;
  el.querySelector('#rd-next').disabled = !reader.nextId;
  el.querySelector('#rd-open').innerHTML = openButtonsHTML(p.id, { reader: false });
  const body = el.querySelector('#rd-body'), st = body.scrollTop;
  body.innerHTML = v.body;
  body.scrollTop = resetScroll ? 0 : st;
  el.querySelector('#rd-foot').innerHTML = v.foot;
  renderDetailPreview(p, body);
}
function syncReader() { if (reader) renderReader(false); }
// Re-render whichever views currently show this prompt (used where a change
// doesn't go through renderContent(), e.g. bumping a use count).
function refreshViewsFor(id) {
  if (S.selectedId === id) renderDetail(id);
  syncReader();
  if (SOLO_ID) syncSolo();
}

/* ── Standalone single-prompt view (new tab / pop-up window) ── */
let soloRenderToken = 0;
function enterSoloMode() {
  document.body.classList.add('solo');
  document.getElementById('solo-home').href = location.href.split('#')[0];
  document.getElementById('solo-theme').addEventListener('click', () => applyTheme(S.theme === 'dark' ? 'light' : 'dark'));
  if (NEW_MODE) { document.title = 'New prompt — GIA'; document.getElementById('solo-title').textContent = 'New prompt'; }
}
// Leave the standalone New Prompt page — after saving or cancelling. A window
// GIA opened itself can close itself; one the browser won't let us close (e.g.
// the address was typed or bookmarked) goes to the library instead.
function goToLibrary() { location.href = location.href.split('#')[0]; }
function leaveStandalone() {
  window.close();
  setTimeout(() => { if (!window.closed) goToLibrary(); }, 150);
}
function syncSolo() {
  const root = document.getElementById('solo-view');
  if (!root) return;
  const token = ++soloRenderToken;
  const p = byId(SOLO_ID);
  if (!p) { renderSoloMissing(token); return; }
  const v = buildPromptView(p, 'solo');
  document.title = `${p.title || 'Untitled'} — GIA`;       // so several open tabs are tellable apart
  root.querySelector('#solo-title').textContent = p.title || 'Untitled';
  root.querySelector('#solo-sub').textContent = v.sub;
  const body = root.querySelector('#solo-body'), st = body.scrollTop;
  body.innerHTML = v.body;
  body.scrollTop = st;
  root.querySelector('#solo-foot').innerHTML = v.foot;
  renderDetailPreview(p, body);
}
async function renderSoloMissing(token) {
  let inTrash = false;
  try { inTrash = (await db.getAllTrash()).some(p => p.id === SOLO_ID); } catch (e) { /* ignore */ }
  if (token !== soloRenderToken) return;   // something newer (e.g. Undo) already rendered
  const root = document.getElementById('solo-view');
  document.title = inTrash ? 'In Trash — GIA' : 'Prompt not found — GIA';
  root.querySelector('#solo-title').textContent = inTrash ? 'In Trash' : 'Prompt not found';
  root.querySelector('#solo-sub').textContent = '';
  root.querySelector('#solo-foot').innerHTML = '';
  root.querySelector('#solo-body').innerHTML = inTrash
    ? `<div class="solo-msg"><h3>This prompt is in the Trash</h3><p>It was deleted, but is kept for 30 days and can be restored.</p><button class="btn btn-primary" id="solo-restore" type="button">Restore prompt</button></div>`
    : `<div class="solo-msg"><h3>Prompt not found</h3><p>It may have been deleted for good, or this link was opened in a different browser or profile — each one keeps its own separate library.</p></div>`;
  root.querySelector('#solo-restore')?.addEventListener('click', async () => {
    if (await restorePromptFromTrash(SOLO_ID)) { renderSidebar(); renderContent(); toast('✓ Restored'); }
  });
}
async function restorePromptFromTrash(id) {
  const t = (await db.getAllTrash()).find(p => p.id === id);
  if (!t) return false;
  delete t.deletedAt;
  await db.restoreFromTrash(t);
  S.prompts.unshift(t);
  await refreshTrashCount();
  return true;
}

/* ── QOL #4: "Copy as…" variants ──
   Bugfix: the previous version attached a fresh document-level click
   listener every time the menu opened, but only ever removed it when the
   NEXT click landed outside the menu. Picking a menu item (the common case)
   closed the menu visually but left that listener permanently attached to
   `document`, referencing an increasingly stale `menu` element — a real
   leak that grew with every use of this dropdown over a session. Tracking
   the single active listener in a module-level variable lets us always
   remove it explicitly, regardless of how the menu gets closed.
*/
let activeCopyMenuCloser = null;
function closeAllCopyMenus() {
  document.querySelectorAll('.copy-menu.open').forEach(m=>m.classList.remove('open'));
  if (activeCopyMenuCloser) { document.removeEventListener('click', activeCopyMenuCloser); activeCopyMenuCloser = null; }
}
function toggleCopyMenu(id, ctx = 'panel') {
  const menu = document.getElementById(`copy-menu-${ctx}-${id}`);
  if (!menu) return;
  const isOpen = menu.classList.contains('open');
  closeAllCopyMenus();
  if (!isOpen) {
    menu.classList.add('open');
    activeCopyMenuCloser = (e) => { if (!menu.contains(e.target)) closeAllCopyMenus(); };
    setTimeout(() => document.addEventListener('click', activeCopyMenuCloser), 0);
  }
}
function stripMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/```[\s\S]*?```/g, m => m.replace(/```/g,'').trim())
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/(\*\*|__)(.*?)\1/g, '$2')
    .replace(/(\*|_)(.*?)\1/g, '$2')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^\s*>\s?/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/^\s*\d+\.\s+/gm, '')
    .trim();
}
async function copyPromptVariant(id, field, plain) {
  const p = S.prompts.find(x=>x.id===id);
  if (!p) return;
  let text = field === 'bodyNegative' ? (p.bodyNegative||'') : (p.body||'');
  if (plain) text = stripMarkdown(text);
  try {
    await navigator.clipboard.writeText(text);
    await registerUse(p);
    toast(plain ? '✓ Copied plain text' : '✓ Copied Markdown');
  } catch { toast('⚠ Clipboard access denied by browser'); }
  closeAllCopyMenus();
}

/* ── QOL #12: usage tracking ── */
async function registerUse(p) {
  p.useCount = (p.useCount||0) + 1;
  p.lastUsed = Date.now();
  await db.savePrompt(p, { usage: true });
  refreshViewsFor(p.id);
  renderSidebar();
}

/* ── QOL #7: export a single prompt as a standalone file ── */
function exportPromptFile(id) {
  const p = S.prompts.find(x=>x.id===id);
  if (!p) return;
  const lines = [`# ${p.title||'Untitled'}`, ''];
  if (p.category) lines.push(`Category: ${p.category}${p.subcategory?' › '+p.subcategory:''}`);
  if (p.model) lines.push(`Model: ${p.model}`);
  if (p.tags?.length) lines.push(`Tags: ${p.tags.map(t=>'#'+t).join(' ')}`);
  lines.push('', '## Prompt', '', p.body||'');
  if (p.bodyType === 'split') lines.push('', '## Negative Prompt', '', p.bodyNegative||'');
  if (p.notes) lines.push('', '## Notes', '', p.notes);
  if (p.link) lines.push('', `Output link: ${p.link}`);
  const blob = new Blob([lines.join('\n')], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (p.title||'prompt').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'prompt';
  a.href = url; a.download = `${safeName}.md`; a.click();
  URL.revokeObjectURL(url);
  toast('✓ Prompt exported');
}

/* ═══════════════════════════════════════════════════
   VERSION HISTORY  (QOL #18: diff view added)
   ═══════════════════════════════════════════════════ */

// Simple line-based LCS diff. Returns an array of {type:'same'|'add'|'del', text}
function diffLines(oldText, newText) {
  const a = (oldText||'').split('\n'), b = (newText||'').split('\n');
  const n = a.length, m = b.length;
  const dp = Array.from({length:n+1}, ()=>new Array(m+1).fill(0));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) {
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  }
  const out = [];
  let i=0, j=0;
  while (i<n && j<m) {
    if (a[i]===b[j]) { out.push({type:'same', text:a[i]}); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { out.push({type:'del', text:a[i]}); i++; }
    else { out.push({type:'add', text:b[j]}); j++; }
  }
  while (i<n) { out.push({type:'del', text:a[i]}); i++; }
  while (j<m) { out.push({type:'add', text:b[j]}); j++; }
  return out;
}

function showVersionHistory(id) {
  const p = S.prompts.find(x=>x.id===id);
  if (!p) return;
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal sm"><div class="modal-head"><div class="modal-title">Version History — ${esc(p.title)}</div><button class="modal-x">×</button></div>
  <div class="modal-body"><div class="version-list" id="version-list">
    ${(p.history||[]).length === 0 ? '<div style="color:var(--text-muted);font-size:.85rem;text-align:center;padding:1rem">No history yet</div>' : (p.history||[]).map((v, i) => `<div class="version-item" data-idx="${i}"><strong>Version ${v.version}</strong> — ${fmtDate(v.updatedAt)}<br><span style="font-size:0.75rem;color:var(--text-muted)">${esc((v.body||'').substring(0,80))}…</span></div>`).join('')}
  </div></div>
  <div class="modal-foot">
    <button class="btn btn-ghost" id="vh-clear" style="color:var(--red);border-color:rgba(240,107,107,.35);margin-right:auto">Clear History</button>
    <button class="btn btn-ghost" id="vh-close">Close</button>
  </div></div>`;
  document.body.appendChild(ov);

  ov.querySelector('.modal-x').onclick = () => ov.remove();
  ov.querySelector('#vh-close').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });

  ov.querySelector('#vh-clear').onclick = async () => {
    if (!confirm('Permanently delete all version history for this prompt?')) return;
    p.history = [];
    await db.savePrompt(p);
    ov.remove();
    refreshViewsFor(id);
    toast('✓ Version history cleared');
  };

  // QOL #18: clicking a version now opens a diff view (old vs current)
  // instead of reverting immediately, so you can see what actually changed
  // before deciding to restore it.
  ov.querySelectorAll('.version-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.idx);
      const oldVer = p.history[idx];
      showDiffModal(p, oldVer, idx, ov);
    });
  });
}

function showDiffModal(p, oldVer, idx, parentOv) {
  const diff = diffLines(oldVer.body||'', p.body||'');
  const diffHtml = diff.map(d => {
    const cls = d.type==='add' ? 'diff-add' : d.type==='del' ? 'diff-del' : 'diff-same';
    const prefix = d.type==='add' ? '+ ' : d.type==='del' ? '- ' : '  ';
    return `<div class="diff-line ${cls}">${esc(prefix + d.text)}</div>`;
  }).join('');
  const dov = document.createElement('div'); dov.className = 'overlay'; dov.style.zIndex = '1100';
  dov.innerHTML = `<div class="modal">
    <div class="modal-head"><div class="modal-title">Compare Version ${oldVer.version} → Current</div><button class="modal-x">×</button></div>
    <div class="modal-body">
      <div style="font-size:0.75rem;color:var(--text-muted)">${fmtDate(oldVer.updatedAt)} vs current (v${p.version||1}) — <span style="color:var(--green)">green = added</span>, <span style="color:var(--red)">red = removed</span></div>
      <div class="diff-wrap">${diffHtml || '<div style="color:var(--text-muted);font-size:0.85rem">No differences</div>'}</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="diff-cancel">Close</button>
      <button class="btn btn-primary" id="diff-revert">Revert to Version ${oldVer.version}</button>
    </div>
  </div>`;
  document.body.appendChild(dov);
  dov.querySelector('.modal-x').onclick = () => dov.remove();
  dov.querySelector('#diff-cancel').onclick = () => dov.remove();
  dov.addEventListener('click', e => { if (e.target === dov) dov.remove(); });
  dov.querySelector('#diff-revert').onclick = async () => {
    if (!confirm('Revert to this version? This will create a new version with the old content.')) return;
    const currentSnapshot = {...p};
    delete currentSnapshot.history;
    // Only keep the thumbnail in the snapshot if reverting will replace it.
    if (!('previewData' in oldVer) || oldVer.previewData === p.previewData) delete currentSnapshot.previewData;
    if (!p.history) p.history = [];
    p.history.push(currentSnapshot);
    if (p.history.length > MAX_HISTORY) p.history.splice(0, p.history.length - MAX_HISTORY);
    p.title = oldVer.title; p.body = oldVer.body; p.bodyNegative = oldVer.bodyNegative; p.bodyType = oldVer.bodyType;
    p.category = oldVer.category; p.subcategory = oldVer.subcategory;
    p.tags = oldVer.tags; p.notes = oldVer.notes; p.link = oldVer.link; p.model = oldVer.model;
    if ('previewData' in oldVer) p.previewData = oldVer.previewData; // otherwise keep the current thumbnail
    p.version = (p.version || 1) + 1; p.updatedAt = Date.now(); invalidateSearch(p);
    await db.savePrompt(p);
    dov.remove();
    parentOv?.remove();   // only the history list beneath it — not an open reader further down
    renderSidebar(); renderContent();
    if (S.selectedId === p.id) renderDetail(p.id);
    toast('✓ Reverted to previous version');
  };
}

/* ═══════════════════════════════════════════════════
   THEME / FONT / SIDEBAR PIN
   ═══════════════════════════════════════════════════ */
function applyTheme(t) {
  document.documentElement.className = t; S.theme = t; db.setSetting('theme', t);
  document.getElementById('theme-icon-dark').style.display = t === 'dark' ? '' : 'none';
  document.getElementById('theme-icon-light').style.display = t === 'light' ? '' : 'none';
}
async function initTheme() { applyTheme(await db.getSetting('theme') || 'dark'); }
document.getElementById('btn-theme').addEventListener('click', () => applyTheme(S.theme === 'dark' ? 'light' : 'dark'));

const fontSizes = ['12px','14px','16px','18px','20px'];
function cycleFontSize() {
  let idx = fontSizes.indexOf(S.fontSize); idx = (idx + 1) % fontSizes.length;
  S.fontSize = fontSizes[idx]; applyFontSettings(); db.setSetting('fontSize', S.fontSize);

/* ── Color theme changer ──
   The app already has light/dark MODE; this adds a separate, independent
   choice of ACCENT HUE on top of either mode. Rather than hand-writing a
   full palette (base/hover/dim/glow) for every color, each preset is just
   one hex value — the hover/dim/glow variants are derived from it
   (lighten for hover, translucent rgba for dim/glow), matching how the
   built-in amber theme's own variants relate to its base color. Only the
   four --accent-* custom properties are touched; the semantic status
   colors (--green/--red/--yellow/--blue, used for favorites, success,
   warnings, links) are intentionally left alone.
*/
const ACCENT_THEMES = {
  amber:  { name: 'Amber (default)', hex: '#e8a045' },
  blue:   { name: 'Blue',            hex: '#5ba3f5' },
  green:  { name: 'Green',           hex: '#3ecf73' },
  purple: { name: 'Purple',          hex: '#a78bfa' },
  red:    { name: 'Red',             hex: '#f06b6b' },
  pink:   { name: 'Pink',            hex: '#f472b6' },
  teal:   { name: 'Teal',            hex: '#2dd4bf' },
};
function hexToRgbTuple(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
}
function lightenHex(hex, amt) {
  const [r,g,b] = hexToRgbTuple(hex);
  const L = v => Math.min(255, Math.round(v + (255 - v) * amt));
  return `rgb(${L(r)},${L(g)},${L(b)})`;
}
function rgbaFromHex(hex, alpha) {
  const [r,g,b] = hexToRgbTuple(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}
function applyAccentTheme(key, { persist = true } = {}) {
  const theme = ACCENT_THEMES[key] ? key : 'amber';
  const hex = ACCENT_THEMES[theme].hex;
  const root = document.documentElement.style;
  root.setProperty('--accent', hex);
  root.setProperty('--accent-rgb', hexToRgbTuple(hex).join(','));
  root.setProperty('--accent-hover', lightenHex(hex, 0.18));
  root.setProperty('--accent-dim', rgbaFromHex(hex, 0.11));
  root.setProperty('--accent-glow', rgbaFromHex(hex, 0.22));
  S.accentTheme = theme;
  if (persist) db.setSetting('accentTheme', theme);
}
async function initAccentTheme() {
  const saved = await db.getSetting('accentTheme');
  applyAccentTheme(saved || 'amber', { persist: false });
}

let sidebarPinned = true;
function applyPinState() {
  const sidebar = document.getElementById('sidebar');
  const pinBtn = document.getElementById('btn-pin-sidebar');
  const edgeTrigger = document.getElementById('sidebar-edge-trigger');
  const isMobile = window.innerWidth <= 850;
  const effectivePinned = isMobile ? true : sidebarPinned;
  if (effectivePinned) {
    sidebar.classList.remove('unpinned', 'hover-reveal');
    pinBtn.classList.add('pinned');
    edgeTrigger.style.display = 'none';
  } else {
    sidebar.classList.add('unpinned');
    pinBtn.classList.remove('pinned');
    edgeTrigger.style.display = isMobile ? 'none' : 'block';
  }
}
async function initPin() {
  sidebarPinned = await db.getSetting('sidebarPinned');
  if (sidebarPinned === null) sidebarPinned = true;
  applyPinState();
  document.getElementById('btn-pin-sidebar').addEventListener('click', () => {
    sidebarPinned = !sidebarPinned;
    db.setSetting('sidebarPinned', sidebarPinned);
    applyPinState();
  });
}

// Keeps the unpinned sidebar open while the cursor is over either the thin
// edge strip or the sidebar panel itself, with a short hide-delay so moving
// from one to the other doesn't cause it to flicker shut in between.
function initSidebarHoverReveal() {
  const sidebar = document.getElementById('sidebar');
  const edge = document.getElementById('sidebar-edge-trigger');
  let hideTimer = null;
  const reveal = () => { clearTimeout(hideTimer); sidebar.classList.add('hover-reveal'); };
  const scheduleHide = () => { clearTimeout(hideTimer); hideTimer = setTimeout(() => sidebar.classList.remove('hover-reveal'), 150); };
  edge.addEventListener('mouseenter', reveal);
  edge.addEventListener('mouseleave', scheduleHide);
  sidebar.addEventListener('mouseenter', reveal);
  sidebar.addEventListener('mouseleave', scheduleHide);
}

function closeSettingsMenu(returnFocus) {
  document.getElementById('settings-dd').style.display = 'none';
  const gear = document.getElementById('btn-settings');
  gear.setAttribute('aria-expanded', 'false');

document.addEventListener('click', function(e) {

/* ── QOL #1: duplicate/clone a prompt ── */
async function duplicatePrompt(id) {
  const p = S.prompts.find(x=>x.id===id);
  if (!p) return;
  const now = Date.now();
  const np = {
    ...p,
    id: uid(),
    title: (p.title||'Untitled') + ' (copy)',
    createdAt: now,
    updatedAt: now,
    lastUsed: null,
    useCount: 0,
    version: 1,
    history: [],
    order: now,
  };
  await db.savePrompt(np, { added: true });
  S.prompts.unshift(np);
  if (SOLO_ID) { location.hash = promptHref(np.id); return; }   // hashchange reloads this tab onto the copy
  renderSidebar(); renderContent();
  openDetail(np.id);
  toast('✓ Prompt duplicated');
}

/* ── Bugfix + QOL #6 + Reliability: delete gives a 5s instant-Undo toast,
   backed by a real 30-day Trash.
   Bugfix: the previous version only moved the prompt into the trash store
   once the 5s timer fired — until then it sat ONLY in memory, while the
   IndexedDB 'prompts' store still had the untouched original record. If the
   tab/browser was closed during that 5s window, the setTimeout never ran,
   so the "deleted" prompt would simply reappear on next launch — deletion
   silently undone by accident, not by choice. Moving to trash IMMEDIATELY
   (it's already excluded from the main library either way, since it's
   gone from S.prompts and the trash store) removes the race entirely: the
   record is always safely persisted in exactly one of the two stores, so
   closing the tab mid-undo-window can no longer lose or revert the delete.
   "Undo" now just moves it back.
*/
async function deletePrompt(id) {
  const idx = S.prompts.findIndex(p=>p.id===id);
  if (idx === -1) return;
  const [removed] = S.prompts.splice(idx, 1);
  if (S.selectedId === id) closeDetail();
  renderSidebar(); renderContent();

  removed.deletedAt = Date.now();
  try { await db.moveToTrash(removed); } catch (e) { console.error('moveToTrash failed', e); }
  await refreshTrashCount();

  toast('Prompt deleted', 5000, {
    label: 'Undo',
    onClick: async () => {
      delete removed.deletedAt;
      try { await db.restoreFromTrash(removed); } catch (e) { console.error('restoreFromTrash failed', e); }
      S.prompts.unshift(removed);
      renderSidebar(); renderContent();
      await refreshTrashCount();
      toast('✓ Restored');
    }
  });
}

/* ── Trash panel (30-day retention) ── */
const TRASH_RETENTION_MS = 30 * 24 * 60 * 60 * 1000;

async function refreshTrashCount() {
  try {
    S.trashCount = (await db.getAllTrash()).length;
    const el = document.getElementById('trash-count');
    if (el) el.textContent = S.trashCount;
  } catch (e) { /* ignore */ }
}

// Called once on startup: anything trashed more than 30 days ago is
// permanently removed, freeing storage automatically.
async function purgeExpiredTrash() {
  try {
    const trash = await db.getAllTrash();
    const cutoff = Date.now() - TRASH_RETENTION_MS;
    for (const p of trash) {
      if ((p.deletedAt||0) < cutoff) await db.purgeTrashItem(p.id);
    }
  } catch (e) { /* ignore */ } finally { refreshTrashCount(); }
}

async function showTrashModal() {
  const trash = (await db.getAllTrash()).sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  const ov = document.createElement('div'); ov.className = 'overlay';
  const rowHtml = p => {
    const daysLeft = Math.max(0, Math.ceil((TRASH_RETENTION_MS - (Date.now() - (p.deletedAt||0))) / 86400000));
    return `<div class="tag-editor" data-id="${esc(p.id)}" style="display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="font-size:0.88rem;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.title||'Untitled')}</div>
        <div style="font-size:0.7rem;color:var(--text-muted)">Deleted ${timeAgo(p.deletedAt)} · purges in ${daysLeft}d</div>
      </div>
      <button class="btn btn-ghost trash-restore-btn" style="height:1.8rem;font-size:0.75rem" data-id="${esc(p.id)}">Restore</button>
      <button class="btn btn-ghost trash-purge-btn" style="height:1.8rem;font-size:0.75rem;color:var(--red);border-color:rgba(240,107,107,.35)" data-id="${esc(p.id)}">Delete Forever</button>
    </div>`;
  };
  ov.innerHTML = `<div class="modal md"><div class="modal-head"><div class="modal-title">Trash</div><button class="modal-x">×</button></div>
  <div class="modal-body" style="max-height:60vh;overflow-y:auto;">
    <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.6rem">Deleted prompts stay here for 30 days before being permanently removed.</div>
    <div id="trash-list">${trash.length ? trash.map(rowHtml).join('') : '<div style="color:var(--text-muted);text-align:center;padding:2rem">Trash is empty</div>'}</div>
  </div>
  <div class="modal-foot">
    ${trash.length ? '<button class="btn btn-ghost" id="trash-empty" style="color:var(--red);border-color:rgba(240,107,107,.35);margin-right:auto">Empty Trash</button>' : ''}
    <button class="btn btn-ghost" id="trash-close">Close</button>
  </div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('.modal-x').onclick = () => ov.remove();
  ov.querySelector('#trash-close').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });

  ov.querySelectorAll('.trash-restore-btn').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.id;
    const p = trash.find(x=>x.id===id);
    if (!p) return;
    delete p.deletedAt;
    await db.restoreFromTrash(p);
    S.prompts.unshift(p);
    renderSidebar(); renderContent();
    await refreshTrashCount();
    ov.remove(); showTrashModal();
    toast('✓ Restored from Trash');
  }));
  ov.querySelectorAll('.trash-purge-btn').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Permanently delete this prompt? This cannot be undone.')) return;
    await db.purgeTrashItem(btn.dataset.id);
    await refreshTrashCount();
    ov.remove(); showTrashModal();
  }));
  ov.querySelector('#trash-empty')?.addEventListener('click', async () => {
    if (!confirm(`Permanently delete all ${trash.length} item${trash.length!==1?'s':''} in Trash? This cannot be undone.`)) return;
    for (const p of trash) await db.purgeTrashItem(p.id);
    await refreshTrashCount();
    ov.remove(); showTrashModal();
    toast('✓ Trash emptied');
  });
}

function promptModal(prompt, opts = {}) {
  // `standalone`: this is the New Prompt PAGE (opened in its own tab/window),

  const isEdit = !!prompt;
  const cats = allCats();
  const currentTags = new Set(prompt?.tags||[]);
  let previewFile = null;
  let promptBodyType = prompt?.bodyType || 'standard';

  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `
<div class="modal">

      <button class="btn-icon" id="modal-maximize" title="Maximize / Restore">⛶</button>

  </div>
  <div class="modal-body">

        <select class="form-select" id="f-cat"><option value="">Select category…</option>${cats.map(c=>`<option value="${esc(c.name)}"${prompt?.category===c.name?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="form-label">Subcategory <span class="req" id="sub-req" style="display:none">*</span></label>
        <select class="form-select" id="f-sub"><option value="">None</option>${prompt?.category?(cats.find(c=>c.name===prompt.category)?.subs||[]).map(s=>`<option value="${esc(s)}"${prompt?.subcategory===s?' selected':''}>${esc(s)}</option>`).join(''):''}</select>
      </div>
    </div>

    <!-- Prompt body with type toggle -->
    <div class="form-group">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem">
        <label class="form-label" style="margin:0">Prompt Body <span class="req">*</span></label>
        <div class="type-toggle">
          <button type="button" class="type-toggle-btn${promptBodyType==='standard'?' active':''}" id="ptype-standard">Standard</button>

        </div>
      </div>

      <!-- Standard body -->
      <div id="body-standard-wrap" style="${promptBodyType==='split'?'display:none':''}">
        <textarea class="form-textarea" id="f-body" placeholder="Paste your prompt here… (Markdown supported)">${esc(prompt?.bodyType==='split'?'':prompt?.body||'')}</textarea>
        <div style="font-size:.7rem;color:var(--text-muted);margin-top:.25rem">Markdown is rendered in the detail view</div>
      </div>

      <!-- Split pos/neg body -->
      <div id="body-split-wrap" style="${promptBodyType==='standard'?'display:none':''}">
        <div class="split-field-label">
          <span class="split-badge pos">＋ Positive Prompt</span>
        </div>
        <textarea class="form-textarea" id="f-body-pos" placeholder="Describe what you want… (Markdown supported)" style="min-height:5.5rem">${esc(promptBodyType==='split'?prompt?.body||'':'')}</textarea>
        <div class="split-field-label" style="margin-top:.65rem">
          <span class="split-badge neg">− Negative Prompt</span>
        </div>
        <textarea class="form-textarea neg" id="f-body-neg" placeholder="Describe what to avoid… e.g. blurry, low quality, text" style="min-height:4rem">${esc(prompt?.bodyNegative||'')}</textarea>
        <div style="font-size:.7rem;color:var(--text-muted);margin-top:.25rem">Markdown is rendered in the detail view</div>

    </div>

    <div class="form-row">

      <div class="form-group"><label class="form-label">Output Link</label><input class="form-input" id="f-link" placeholder="https://…" value="${esc(prompt?.link||'')}"></div>

      <div style="font-size:.7rem;color:var(--text-muted);margin-top:.25rem">Markdown is rendered in the detail view</div>
    </div>
