</div>`;
  document.body.appendChild(ov);

  // Tags handling
  const wrap = ov.querySelector('#tags-wrap'), inp = ov.querySelector('#tags-inp');
  function renderChips() {
    wrap.querySelectorAll('.tag-chip').forEach(el=>el.remove());
    currentTags.forEach(tag=>{
      const chip=document.createElement('span'); chip.className='tag-chip'; chip.dataset.tag=tag;
      chip.innerHTML=`${esc(tag)}<button class="chip-x" data-tag="${esc(tag)}">×</button>`;
      chip.querySelector('.chip-x').onclick=()=>{currentTags.delete(tag);renderChips();};
      wrap.insertBefore(chip, inp);
    });
  }
  renderChips();

  // Tag autocomplete
  const acWrap = document.createElement('div');
  acWrap.className = 'autocomplete-wrap';
  const acList = document.createElement('div');
  acList.className = 'autocomplete-list';
  wrap.parentNode.insertBefore(acWrap, wrap);
  acWrap.appendChild(wrap);
  acWrap.appendChild(acList);

  let acIdx = -1;
  function addTag(tag) {
    currentTags.add(tag);
    renderChips();
    inp.value = '';
    acList.classList.remove('open');
    inp.focus();
  }

  inp.addEventListener('input', () => {
    const val = inp.value.trim().replace(/^#/, '').toLowerCase();
    acList.innerHTML = '';
    acIdx = -1;
    if (!val) { acList.classList.remove('open'); return; }
    const matches = [...new Set(S.prompts.flatMap(p => p.tags||[]))]
      .filter(t => t.toLowerCase().includes(val) && !currentTags.has(t))
      .sort((a,b) => a.localeCompare(b))
      .slice(0, 8);
    if (!matches.length) { acList.classList.remove('open'); return; }
    matches.forEach((t) => {
      const item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.textContent = '#' + t;
      item.addEventListener('mousedown', e => { e.preventDefault(); addTag(t); });
      acList.appendChild(item);
    });
    acList.classList.add('open');
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const items = acList.querySelectorAll('.autocomplete-item');
      if (!items.length) return;
      items.forEach(el => el.classList.remove('active'));
      if (e.key === 'ArrowDown') acIdx = (acIdx + 1) % items.length;
      else acIdx = (acIdx - 1 + items.length) % items.length;
      items[acIdx].classList.add('active');
    } else if (e.key === 'Enter' || e.key === ',') {
      const active = acList.querySelector('.autocomplete-item.active');
      if (active && active.textContent) {
        e.preventDefault();
        addTag(active.textContent.replace(/^#/, '').trim());
      } else {
        if (e.key === ',' || e.key === 'Enter') {
          e.preventDefault();
          const t = inp.value.trim().replace(/^#/, '').toLowerCase().replace(/\s+/g, '-');
          if (t) { currentTags.add(t); renderChips(); inp.value = ''; }
        }
      }
      acList.classList.remove('open');
    } else if (e.key === 'Escape') {
      acList.classList.remove('open');
    }
  });

  const acDocHandler = e => { if (!acWrap.contains(e.target)) acList.classList.remove('open'); };
  document.addEventListener('click', acDocHandler);

  // Model autocomplete
  const modelInput = ov.querySelector('#f-model');
  const modelAcWrap = document.createElement('div');
  modelAcWrap.className = 'autocomplete-wrap';
  const modelAcList = document.createElement('div');
  modelAcList.className = 'autocomplete-list';
  modelInput.parentNode.insertBefore(modelAcWrap, modelInput);
  modelAcWrap.appendChild(modelInput);
  modelAcWrap.appendChild(modelAcList);

  let modelAcIdx = -1;
  modelInput.addEventListener('input', () => {
    const val = modelInput.value.trim();
    modelAcList.innerHTML = '';
    modelAcIdx = -1;
    if (!val) { modelAcList.classList.remove('open'); return; }
    const matches = modelMatches(val);
    if (!matches.length) { modelAcList.classList.remove('open'); return; }
    matches.forEach(m => {
      const item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.textContent = m;
      item.addEventListener('mousedown', e => { e.preventDefault(); modelInput.value = m; modelAcList.classList.remove('open'); modelInput.focus(); });
      modelAcList.appendChild(item);
    });
    modelAcList.classList.add('open');
  });

  modelInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const items = modelAcList.querySelectorAll('.autocomplete-item');
      if (!items.length) return;
      items.forEach(el => el.classList.remove('active'));
      if (e.key === 'ArrowDown') modelAcIdx = (modelAcIdx + 1) % items.length;
      else modelAcIdx = (modelAcIdx - 1 + items.length) % items.length;
      items[modelAcIdx].classList.add('active');
    } else if (e.key === 'Enter') {
      const active = modelAcList.querySelector('.autocomplete-item.active');
      if (active) {
        e.preventDefault();
        modelInput.value = active.textContent;
        modelAcList.classList.remove('open');
      } else {
        modelAcList.classList.remove('open');
      }
    } else if (e.key === 'Escape') {
      modelAcList.classList.remove('open');
    }
  });

  const modelDocHandler = e => { if (!modelAcWrap.contains(e.target)) modelAcList.classList.remove('open'); };
  document.addEventListener('click', modelDocHandler);

  // Category change handler
  const fcat = ov.querySelector('#f-cat'), fsub = ov.querySelector('#f-sub'), subReq = ov.querySelector('#sub-req');
  fcat.addEventListener('change', e=>{
    const cat=allCats().find(c=>c.name===e.target.value);
    fsub.innerHTML=`<option value="">None</option>${(cat?.subs||[]).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}`;
    if (cat?.subs?.length) { subReq.style.display = ''; } else { subReq.style.display = 'none'; }
  });
  fcat.dispatchEvent(new Event('change'));
  if (prompt?.subcategory) { fsub.value = prompt.subcategory; }

  // Type toggle (standard / split)
  ov.querySelector('#ptype-standard').addEventListener('click', () => {
    promptBodyType = 'standard';
    ov.querySelector('#ptype-standard').classList.add('active');
    ov.querySelector('#ptype-split').classList.remove('active');
    ov.querySelector('#body-standard-wrap').style.display = '';
    ov.querySelector('#body-split-wrap').style.display = 'none';
  });
  ov.querySelector('#ptype-split').addEventListener('click', () => {
    promptBodyType = 'split';
    ov.querySelector('#ptype-split').classList.add('active');
    ov.querySelector('#ptype-standard').classList.remove('active');
    ov.querySelector('#body-split-wrap').style.display = '';
    ov.querySelector('#body-standard-wrap').style.display = 'none';
    const stdBody = ov.querySelector('#f-body').value.trim();
    const posField = ov.querySelector('#f-body-pos');
    if (stdBody && !posField.value.trim()) posField.value = stdBody;
  });

  ov.querySelector('#f-preview-file').addEventListener('change', e => { previewFile = e.target.files[0] || null; });

  // Bugfix: remove the document-level click listeners created above when
  // the modal closes, instead of leaking one pair per open/close cycle.
  const close = () => {
    document.removeEventListener('keydown', ctrlSHandler);
    document.removeEventListener('click', acDocHandler);
    document.removeEventListener('click', modelDocHandler);
    ov.remove();
  };
  // Leaving WITHOUT saving. In the standalone page, cancelling means leaving it.
  const cancel = () => { close(); if (standalone) leaveStandalone(); };
  ov._close = cancel;  // so Esc runs this cleanup instead of just yanking the element
  const saveBtn = ov.querySelector('#m-save');

  function ctrlSHandler(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveBtn.click(); }
  }
  document.addEventListener('keydown', ctrlSHandler);

  ov.querySelector('.modal-x').onclick=cancel; ov.querySelector('#m-cancel').onclick=cancel;
  ov.addEventListener('click',e=>{if(e.target===ov)cancel();});
  if (standalone) { ov.querySelector('.modal').classList.add('maximized'); ov.querySelector('#modal-maximize').style.display = 'none'; }

  // Maximize/restore modal
  let maximized = false;
  ov.querySelector('#modal-maximize').addEventListener('click', () => {
    maximized = !maximized;
    ov.querySelector('.modal').classList.toggle('maximized', maximized);
  });

  // Save
  saveBtn.addEventListener('click', async ()=>{
    const title=ov.querySelector('#f-title').value.trim();
    const cat=ov.querySelector('#f-cat').value;
    const sub = ov.querySelector('#f-sub').value;
    if(!title){ov.querySelector('#f-title').focus();toast('⚠ Title is required');return;}
    if(!cat){ov.querySelector('#f-cat').focus();toast('⚠ Category is required');return;}
    const catObj = allCats().find(c=>c.name===cat);
    if (catObj?.subs?.length && !sub) {
      ov.querySelector('#f-sub').focus();
      toast('⚠ Subcategory is required for this category');
      return;
    }

    let body = '', bodyNegative = '';
    if (promptBodyType === 'split') {
      body = ov.querySelector('#f-body-pos').value.trim();
      bodyNegative = ov.querySelector('#f-body-neg').value.trim();
      if (!body) { ov.querySelector('#f-body-pos').focus(); toast('⚠ Positive prompt is required'); return; }
    } else {
      body = ov.querySelector('#f-body').value.trim();
      if (!body) { ov.querySelector('#f-body').focus(); toast('⚠ Prompt body is required'); return; }
    }

    const now=Date.now();
    let previewData = prompt?.previewData || null;
    if (previewFile) {
      try { previewData = await generateThumbnail(previewFile, 200); }
      catch (err) { toast('⚠ Could not generate preview – saving without'); previewData = null; }
    }

    // Save current version to history before editing
    if (isEdit) {
      if (!prompt.history) prompt.history = [];
      prompt.history.push({
        title:prompt.title, body:prompt.body, bodyNegative:prompt.bodyNegative, bodyType:prompt.bodyType,
        category:prompt.category, subcategory:prompt.subcategory,
        tags:[...(prompt.tags||[])], notes:prompt.notes, link:prompt.link, model:prompt.model,
        // Bugfix: previewData (a base64 image) was copied into EVERY history
        // entry, so a prompt edited N times stored N+1 copies of the same
        // thumbnail. It's only recorded now when it's about to change.
        ...(previewFile ? { previewData: prompt.previewData } : {}),
        version:prompt.version||1, updatedAt:prompt.updatedAt, createdAt:prompt.createdAt
      });
      // Cap retained versions so history can't grow without bound.
      if (prompt.history.length > MAX_HISTORY) prompt.history.splice(0, prompt.history.length - MAX_HISTORY);
    }

    const np = {
      id: prompt?.id || uid(),
      title,
      category: cat,
      subcategory: sub,
      bodyType: promptBodyType,
      body,
      bodyNegative: bodyNegative || '',
      model: modelInput.value.trim(),
      link: ov.querySelector('#f-link').value.trim(),
      tags: [...currentTags],
      notes: ov.querySelector('#f-notes').value.trim(),
      fav: ov.querySelector('#f-fav').checked,
      previewData,
      history: prompt?.history || [],
      version: isEdit ? (prompt.version||1)+1 : 1,
      createdAt: prompt?.createdAt || now,
      updatedAt: now,
      lastUsed: prompt?.lastUsed || null,
      useCount: prompt?.useCount || 0,
      order: prompt?.order ?? now,
    };

    await db.savePrompt(np, isEdit ? undefined : { added: true });
    if(isEdit){ const i=S.prompts.findIndex(p=>p.id===np.id); if(i>=0)S.prompts[i]=np; } else S.prompts.unshift(np);

    if (standalone) {
      close();
      // The job is done, so this tab/window goes away rather than lingering on
      // the saved prompt. The auto-save is awaited FIRST — closing would cut
      // an in-flight write short — and the write above has already committed
      // (see GDB._write). The library window is told via the 'added' message
      // and shows the new prompt (plus a confirmation) by itself.
      await maybeAutosaveAfterPromptSave();
      leaveStandalone();
      return;
    }
    close(); renderSidebar(); renderContent();
    if(S.selectedId===np.id) renderDetail(np.id);
    toast(isEdit?'✓ Prompt updated':'✓ Prompt saved');
    maybeAutosaveAfterPromptSave();
  });
  setTimeout(()=>ov.querySelector('#f-title').focus(), 60);
}

            <button class="btn btn-ghost save-rename-btn" style="height:1.8rem;font-size:0.75rem;display:none">Save</button>
            <button class="btn btn-ghost cancel-rename-btn" style="height:1.8rem;font-size:0.75rem;display:none">Cancel</button>
          </div>
        `).join('')
      }
    </div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" id="mt-close">Close</button></div></div>`;
  document.body.appendChild(ov);

  ov.querySelector('.modal-x').onclick = () => ov.remove();
  ov.querySelector('#mt-close').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });

  const refreshTagList = () => {
    const updatedTags = allTags();
    const list = ov.querySelector('#mt-tag-list');
    if (updatedTags.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:2rem">No tags yet</div>';
      return;
    }
    list.innerHTML = updatedTags.map(({tag, count}) => `
      <div class="tag-editor" data-tag="${esc(tag)}" style="display:flex;align-items:center;gap:0.5rem;padding:0.7rem 0;border-bottom:1px solid var(--border)">
        <span style="flex:1;font-size:0.9rem;color:var(--text-primary)">#${esc(tag)}</span>
        <span style="font-size:0.7rem;color:var(--text-muted)">${count} prompt${count!==1?'s':''}</span>
        <input class="form-input edit-tag-input" placeholder="Rename" style="width:8rem;display:none">
        <button class="btn btn-ghost rename-btn" style="height:1.8rem;font-size:0.75rem;padding:0 0.6rem">Rename</button>
        <button class="btn btn-ghost delete-btn" style="height:1.8rem;font-size:0.75rem;color:var(--red);border-color:rgba(240,107,107,.35)">Delete</button>
        <button class="btn btn-ghost save-rename-btn" style="height:1.8rem;font-size:0.75rem;display:none">Save</button>
        <button class="btn btn-ghost cancel-rename-btn" style="height:1.8rem;font-size:0.75rem;display:none">Cancel</button>
      </div>
    `).join('');
    attachTagEditorListeners();
  };

  const attachTagEditorListeners = () => {
  ov.querySelectorAll('.tag-editor').forEach(row => {
    const tag = row.dataset.tag;
    const renameBtn = row.querySelector('.rename-btn');
    const deleteBtn = row.querySelector('.delete-btn');
    const saveBtn = row.querySelector('.save-rename-btn');
    const cancelBtn = row.querySelector('.cancel-rename-btn');
    const input = row.querySelector('.edit-tag-input');

    renameBtn.addEventListener('click', () => {
      input.style.display = ''; renameBtn.style.display = 'none'; deleteBtn.style.display = 'none';
      saveBtn.style.display = ''; cancelBtn.style.display = '';
      input.value = tag; input.focus();
    });
    cancelBtn.addEventListener('click', () => {
      input.style.display = 'none'; renameBtn.style.display = ''; deleteBtn.style.display = '';
      saveBtn.style.display = 'none'; cancelBtn.style.display = 'none';
    });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); }
      });
    saveBtn.addEventListener('click', async () => {
      const newTag = input.value.trim().toLowerCase().replace(/\s+/g,'-');
      if (!newTag || newTag === tag) return;
      for (const p of S.prompts) {
        if (p.tags && p.tags.includes(tag)) {
          p.tags = p.tags.map(t => t === tag ? newTag : t);
          invalidateSearch(p);
          await db.savePrompt(p);
        }
      }
      renderSidebar(); renderContent();
        refreshTagList();
    });
    deleteBtn.addEventListener('click', async () => {
      if (!confirm(`Delete tag #${tag} from all prompts?`)) return;
      for (const p of S.prompts) {
        if (p.tags && p.tags.includes(tag)) {
          p.tags = p.tags.filter(t => t !== tag);
          invalidateSearch(p);
          await db.savePrompt(p);
        }
      }
      renderSidebar(); renderContent();
        refreshTagList();
    });
  });
  };

  attachTagEditorListeners();
}

/* ═══════════════════════════════════════════════════
   SETTINGS ACTIONS (routed from dropdown)
   ═══════════════════════════════════════════════════ */
function settingsAction(action) {
  if (action === 'manage-cats') { showManageCatsModal(); return; }
  if (action === 'manage-tags') { showManageTagsModal(); return; }
  if (action === 'appearance') { showAppearanceModal(); return; }
  if (action === 'preferences') { showPreferencesModal(); return; }
  if (action === 'backup') { showBackupModal(); return; }
  if (action === 'autosave') { showAutosaveModal(); return; }
  if (action === 'about') { showAboutModal(); return; }
  if (action === 'stats') { showStatsModal(); return; }
  if (action === 'clear') {
    if (!confirm('⚠ Delete ALL prompts and settings permanently?')) return;
    db.clearAll().then(() => { S.prompts = []; S.customCats = []; S.trashCount = 0; closeDetail(); renderSidebar(); renderContent(); refreshTrashCount(); toast('All data cleared'); });
  }
}

/* ── Stats (replaces "Storage Info") ──
   Everything is derived from data already in memory except the browser's
   storage estimate and the last auto-save time, which are async lookups. */
const fmtBytes = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n/1024).toFixed(1)} KB` : `${(n/1048576).toFixed(1)} MB`;
async function showStatsModal() {
  const ps = S.prompts, total = ps.length, num = n => Number(n).toLocaleString();
  const wc = t => { t = (t||'').trim(); return t ? t.split(/\s+/).length : 0; };
  let words = 0, longest = null, longestWords = 0, uses = 0, versions = 0, favs = 0, splitN = 0, withPreview = 0;
  const modelMap = {}, weekAgo = Date.now() - 7*86400000; let recent = 0;
  for (const p of ps) {
    const w = wc(p.body) + wc(p.bodyNegative); words += w;
    if (w > longestWords) { longestWords = w; longest = p; }
    uses += p.useCount||0; versions += p.history?.length||0;
    if (p.fav) favs++; if (p.bodyType === 'split') splitN++; if (p.previewData) withPreview++;
    if ((p.createdAt||0) >= weekAgo) recent++;
    const m = (p.model||'').trim(); if (m) modelMap[m] = (modelMap[m]||0) + 1;
  }
  const byCreated = [...ps].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const oldest = byCreated[0], newest = byCreated[byCreated.length-1];
  const topUsed = ps.filter(p=>(p.useCount||0)>0).sort((a,b)=>b.useCount-a.useCount).slice(0,3);
  const topModels = Object.entries(modelMap).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const tags = allTags(), topTags = tags.slice(0, 10);
  const cats = allCats(), counts = catCounts();
  const catRows = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const maxCat = catRows.length ? catRows[0][1] : 1;

  const backupSize = new Blob([JSON.stringify({ prompts: S.prompts, categories: S.customCats })]).size;
  const previewSize = ps.reduce((a,p)=>a+(p.previewData ? p.previewData.length : 0), 0);
  let est = null; try { est = navigator.storage?.estimate ? await navigator.storage.estimate() : null; } catch (e) {}
  const lastAuto = await db.getSetting('lastAutosave');

  const card = (k, v) => `<div class="stat-card"><div class="stat-k">${k}</div><div class="stat-v">${v}</div></div>`;
  const kv = (k, v) => `<div class="kv-row"><span>${k}</span><span>${v}</span></div>`;
  const when = ts => ts ? `${fmtDate(ts)} · ${timeAgo(ts)}` : '—';
  const empty = '<div style="font-size:0.8rem;color:var(--text-muted)">Nothing yet</div>';

  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal md"><div class="modal-head"><div class="modal-title">Stats</div><button class="modal-x">×</button></div>
  <div class="modal-body">
    <div class="stat-grid cols-3">
      ${card('Prompts', num(total))}${card('Favorites', num(favs))}${card('In Trash', num(S.trashCount))}
      ${card('Total uses', num(uses))}${card('Unique tags', num(tags.length))}${card('Versions saved', num(versions))}
    </div>

    <div class="stats-title">Library</div>
    <div>
      ${kv('Total words', num(words))}
      ${kv('Average length', total ? `${num(Math.round(words/total))} words` : '—')}
      ${kv('Longest prompt', longest ? `${esc(longest.title||'Untitled')} (${num(longestWords)} words)` : '—')}
      ${kv('Positive/negative prompts', num(splitN))}
      ${kv('With a preview image', num(withPreview))}
      ${kv('Added in the last 7 days', num(recent))}
      ${kv('Newest', newest ? `${esc(newest.title||'Untitled')} · ${timeAgo(newest.createdAt)}` : '—')}
      ${kv('Oldest', oldest ? `${esc(oldest.title||'Untitled')} · ${fmtDate(oldest.createdAt)}` : '—')}
    </div>

    <div class="stats-title">By category</div>
    <div>${catRows.length ? catRows.map(([name, n]) => {
      const c = cats.find(x => x.name === name);
      return `<div class="bar-row"><span class="bar-label" title="${esc(name)}">${esc(name)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${Math.max(3, Math.round(n/maxCat*100))}%;background:${c?.color || 'var(--accent)'}"></span></span><span class="bar-num">${num(n)}</span></div>`;
    }).join('') : empty}</div>

    <div class="stats-title">Most used prompts</div>
    <div>${topUsed.length ? topUsed.map(p => kv(esc(p.title||'Untitled'), `${num(p.useCount)}×`)).join('') : empty}</div>

    <div class="stats-title">Top models</div>
    <div>${topModels.length ? topModels.map(([m, n]) => kv(esc(m), `${num(n)} prompt${n!==1?'s':''}`)).join('') : empty}</div>

    <div class="stats-title">Top tags</div>
    <div style="display:flex;flex-wrap:wrap;gap:0.3rem">${topTags.length ? topTags.map(({tag,count}) => `<span class="tag-pill" style="font-size:0.78rem;padding:0.15rem 0.55rem">#${esc(tag)} · ${count}</span>`).join('') : empty}</div>

    <div class="stats-title">Storage &amp; backup</div>
    <div>
      ${kv('Backup size', fmtBytes(backupSize))}
      ${kv('Preview images', fmtBytes(previewSize))}
      ${est && est.usage != null ? kv('Browser storage used', `${fmtBytes(est.usage)}${est.quota ? ` of ${fmtBytes(est.quota)}` : ''}`) : ''}
      ${kv('Last manual backup', when(S.lastBackup))}
      ${kv('Last auto-save', when(lastAuto))}
      ${kv('Local encryption', 'XOR (obfuscation only)')}
    </div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" id="stats-close">Close</button></div></div>`;
  document.body.appendChild(ov);

// QOL: export every prompt matching a predicate (one category, or one tag)
// as a single re-importable GIA backup file — same schema as the full
// backup, so it round-trips cleanly through Import later.
function exportFilteredPrompts(predicate, labelForFilename) {
  const matched = S.prompts.filter(predicate);
  if (!matched.length) { toast('⚠ Nothing matched — nothing to export'); return; }
  const data = { _app:'GIA', _version:2, exportedAt:Date.now(), prompts:matched, categories:S.customCats };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `GIA_${sanitizeFilename(labelForFilename)}_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
  toast(`✓ Exported ${matched.length} prompt${matched.length!==1?'s':''}`);
}

// One-click restore: reads whichever auto-save file is most recent (via
// readLatestAutosaveFile, which accounts for rotation) and routes it
// through the same preview/diff flow as a manual import, so nothing is
// silently overwritten even in a "my library looks empty" panic moment.
async function restoreFromLastAutosave() {
  if (!autosaveDirHandle) {
    toast(autosaveDirHandlePending
      ? '⚠ Reconnect your auto-save folder first (Settings → Auto Save)'
      : '⚠ No auto-save folder is configured — nothing to restore from', 5000);
    return;
  }
  const cfg = await getAutosaveSettings();
  try {
    const result = await readLatestAutosaveFile(cfg);
    if (!result) { toast('⚠ No auto-save file found yet'); return; }
    await importFromText(result.text, result.fileName);
  } catch (e) {
    toast('⚠ Could not read the auto-save file — see console for details', 5000);
    console.error('restoreFromLastAutosave failed', e);
  }
}

async function doImport(file) {
  try {
    const text = await file.text();
    await importFromText(text, file.name);
  } catch (e) { toast('⚠ Failed to read file'); }
}

/* ── Import preview/diff ──
   Shared entry point for both manual Import and "Restore from Last
   Auto-Save": validates the payload (prompting for a password if it's
   encrypted), then hands off to a preview modal instead of committing
   immediately, so the person can see exactly what will change first.
*/
async function importFromText(text, sourceLabel) {
  let check = validateBackupPayload(text, null);
  if (!check.ok && check.needsPassword) {
    const password = prompt('This backup is encrypted. Enter password:');
    if (!password) return;
    check = validateBackupPayload(text, password);
  }
  if (!check.ok) {
    const messages = {
      'empty-file': 'The file is empty.',
      'wrong-password-or-corrupted': 'Wrong password, or the file is corrupted.',
      'invalid-json': 'The file is not valid JSON — it may be truncated or corrupted.',
      'unexpected-shape': 'The file doesn\'t look like a GIA backup (missing expected fields).',
    };
    toast(`⚠ Import failed: ${messages[check.reason] || 'invalid file'}`, 6000);
    return;
  }
  check.data.prompts = check.data.prompts.filter(p => p && typeof p === 'object').map(normalizePrompt);
  showImportPreviewModal(check.data, sourceLabel || 'backup file');
}

// Makes an imported record safe for the rest of the app. Backups can come
// from older versions, other tools, or be hand-edited, so required fields
// can be missing or the wrong type — a missing `id` made IndexedDB reject the
// write (aborting the whole import part-way), and a non-array `tags` crashed
// rendering. Existing valid values are preserved as-is.
function normalizePrompt(raw) {
  const now = Date.now();
  const p = raw;
  if (typeof p.id !== 'string' || !SAFE_ID.test(p.id)) p.id = uid();
  p.title = (typeof p.title === 'string' && p.title.trim()) ? p.title : 'Untitled';
  p.category = (typeof p.category === 'string' && p.category) ? p.category : 'Other';
  p.subcategory = typeof p.subcategory === 'string' ? p.subcategory : '';
  p.bodyType = p.bodyType === 'split' ? 'split' : 'standard';
  p.body = typeof p.body === 'string' ? p.body : '';
  p.bodyNegative = typeof p.bodyNegative === 'string' ? p.bodyNegative : '';
  p.notes = typeof p.notes === 'string' ? p.notes : '';
  p.model = typeof p.model === 'string' ? p.model : '';
  p.link = typeof p.link === 'string' ? p.link : '';
  if (typeof p.tags === 'string') p.tags = p.tags.split(',');
  p.tags = Array.isArray(p.tags) ? p.tags.map(t => String(t).trim().replace(/^#/, '').toLowerCase().replace(/\s+/g, '-')).filter(Boolean) : [];
  p.history = Array.isArray(p.history) ? p.history : [];
  p.fav = !!p.fav;
  p.version = Number(p.version) || 1;
  p.useCount = Number(p.useCount) || 0;
  p.createdAt = Number(p.createdAt) || now;
  p.updatedAt = Number(p.updatedAt) || p.createdAt;
  if (p.order != null) p.order = Number(p.order) || p.createdAt;
  return cleanLegacyPrompt(p);
}

async function commitImport(data, { overwrite = false } = {}) {
  const existIds = new Set(S.prompts.map(p => p.id));
  // Bugfix: a "new" prompt being imported (not in the live library) could
  // still share an ID with something sitting in Trash — e.g. you deleted a
  // prompt, then later imported/restored a backup made before the delete.
  // Without this check, the same ID would end up persisted in BOTH the
  // 'prompts' and 'trash' stores at once, so restoring or purging the
  // trashed copy later could clobber or duplicate the freshly-imported one.
  // The live, just-imported copy should win — so drop the stale trash entry.
  const trashIds = new Set((await db.getAllTrash()).map(p => p.id));
  let added = 0, updated = 0, skipped = 0, failed = 0;
  for (const p of (data.prompts || [])) {
    // One bad record shouldn't abort the whole import part-way through.
    try {
      if (!existIds.has(p.id)) {
        await db.savePrompt(p); S.prompts.push(p); added++;
        if (trashIds.has(p.id)) { await db.purgeTrashItem(p.id); trashIds.delete(p.id); }
      } else if (overwrite) {
        await db.savePrompt(p);
        const i = S.prompts.findIndex(x => x.id === p.id);
        if (i >= 0) S.prompts[i] = p;
        updated++;
      } else {
        skipped++;
      }
    } catch (e) { failed++; console.error('import: failed to save a prompt', e); }
  }
  if (data.categories) {
    for (const cat of data.categories) {
      const existingCustom = S.customCats.find(c => c.id === cat.id);
      if (existingCustom) { Object.assign(existingCustom, cat); await db.saveCat(existingCustom); }
      else { await db.saveCat(cat); S.customCats.push(cat); }
    }
  }
  renderSidebar(); renderContent(); await refreshTrashCount();
  const parts = [`+${added} added`];
  if (updated) parts.push(`${updated} overwritten`);
  if (skipped) parts.push(`${skipped} skipped`);
  if (failed) parts.push(`${failed} failed`);
  toast(`✓ Import complete — ${parts.join(', ')}`, 4500);
}

/* ═══════════════════════════════════════════════════
   AUTO SAVE
   ═══════════════════════════════════════════════════
   Auto Save writes the same backup payload used by the manual "Backup"
   export, either after every prompt save and/or on a timer. Two settings
   control WHEN it fires; a separate destination controls WHERE it goes:

   - If the browser supports the File System Access API
     (window.showDirectoryPicker, Chromium-based browsers), the user picks
     a real folder once. We store the FileSystemDirectoryHandle itself in
     IndexedDB (structured-clone supports this in Chromium) so it survives
     reloads, and every auto-save silently overwrites a single
     "GIA_autosave.json" file in that folder — no repeated prompts, no
     pile of duplicate downloads.
   - If it isn't supported (Firefox, Safari), there's no way for a web page
     to write to a chosen folder without a save dialog every time, so we
     fall back to triggering a normal timestamped file download instead.
     This is disclosed to the user in the Auto Save modal.
*/
let autosaveIntervalId = null;
let autosaveDirHandle = null; // in-memory cache of the picked FileSystemDirectoryHandle

// Keeps auto-save file names filesystem-safe across Windows/macOS/Linux.
function sanitizeFilename(name) {
  const cleaned = (name || '').trim().replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').slice(0, 100);
  return cleaned || 'GIA_autosave';
}

async function getAutosaveSettings() {
  return {
    enabled: !!(await db.getSetting('autosaveEnabled')),
    onPromptSave: !!(await db.getSetting('autosaveOnPromptSave')),
    onInterval: !!(await db.getSetting('autosaveOnInterval')),
    intervalMinutes: (await db.getSetting('autosaveIntervalMinutes')) || 10,
    fileName: (await db.getSetting('autosaveFileName')) || 'GIA_autosave',
    encrypt: !!(await db.getSetting('autosaveEncrypt')),
    password: (await db.getSetting('autosavePassword')) || '',
    rotate: !!(await db.getSetting('autosaveRotate')),
    rotateCount: (await db.getSetting('autosaveRotateCount')) || 5,
    reconnectPrompt: (await db.getSetting('autosaveReconnectPrompt')) !== false, // default true
  };
}

// `autosaveDirHandlePending` holds a remembered folder whose WRITE
// PERMISSION has lapsed (see explanation below) — distinct from
// `autosaveDirHandle`, which is the currently-usable one.
let autosaveDirHandlePending = null;

/* Why the folder needs re-confirming on every browser restart:
   This isn't a bug in GIA — it's a deliberate browser security restriction.
   The File System Access API lets a site remember a FileSystemDirectoryHandle
   across reloads (we store it in IndexedDB, same as everything else here),
   but Chromium intentionally resets the WRITE PERMISSION on that handle back
   to "ask again" once every tab for the site has been closed. That's by
   design, specifically so a website can never retain silent write access to
   your file system indefinitely just because you granted it once.
   What we CAN do (and now do) is keep the folder reference itself and only
   ask you to re-confirm permission with a single click — rather than making
   you re-open the folder picker and re-select the same folder from scratch
   every time, which is what the previous version effectively forced. */
async function loadAutosaveDirHandle() {
  autosaveDirHandle = null;
  autosaveDirHandlePending = null;
  try {
    const stored = await db.getSetting('autosaveDirHandle');
    if (stored && typeof stored.queryPermission === 'function') {
      const perm = await stored.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') autosaveDirHandle = stored;
      else autosaveDirHandlePending = stored; // remembered, just needs a click to re-confirm
    }
  } catch (e) { /* no stored handle, or browser doesn't support it */ }
}

// Re-confirms permission on the ALREADY-REMEMBERED folder (no picker dialog)
// — this is the one-click path, callable from a toast button or the modal.
async function reconnectAutosaveFolder() {
  if (!autosaveDirHandlePending) return false;
  try {
    const perm = await autosaveDirHandlePending.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      autosaveDirHandle = autosaveDirHandlePending;
      autosaveDirHandlePending = null;
      return true;
    }
  } catch (e) { /* ignore */ }
  return false;
}

// Opens the full folder picker — only needed the FIRST time, or to switch
// to a different folder.
async function chooseAutosaveFolder() {
  if (!('showDirectoryPicker' in window)) { toast('⚠ Your browser does not support folder auto-save'); return null; }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { toast('⚠ Permission denied'); return null; }
    await db.setSetting('autosaveDirHandle', handle);
    autosaveDirHandle = handle;
    autosaveDirHandlePending = null;
    return handle;
  } catch (e) { return null; } // user cancelled the picker
}

// Bugfix: without a reentrancy guard, the "after every prompt save" trigger
// and the interval timer could fire within milliseconds of each other,
// racing two writes into the SAME file/rotation slot. The guard prevents the
// overlap — but simply dropping the second call (as this first did) meant
// edits made while a save was in flight might never reach the file until the
// next trigger. A trigger arriving mid-write is now remembered and run once
// more as soon as the current one finishes, so the final state always lands.
let autosaveInFlight = false;
let autosaveQueued = false;
async function performAutoSave() {
  if (autosaveInFlight) { autosaveQueued = true; return false; }
  autosaveInFlight = true;
  try {
    return await performAutoSaveInner();
  } finally {
    autosaveInFlight = false;
    if (autosaveQueued) { autosaveQueued = false; setTimeout(performAutoSave, 0); }
  }
}
// Throttles the "auto-save is paused" reminder so a timer ticking every few
// minutes doesn't nag constantly.
let lastPausedNoticeAt = 0;
function noticeAutosavePaused() {
  if (Date.now() - lastPausedNoticeAt < 10 * 60 * 1000) return;
  lastPausedNoticeAt = Date.now();
  toast('Auto-save is paused — its folder needs permission again', 8000, {
    label: 'Reconnect',
    onClick: async () => {
      const ok = await reconnectAutosaveFolder();
      toast(ok ? '✓ Auto-save folder reconnected' : '⚠ Could not reconnect — open Settings → Auto Save');
      if (ok) performAutoSave();
    }
  });
}
async function performAutoSaveInner() {
  // Bugfix: if a folder was chosen but its permission has lapsed (the normal
  // state after a browser restart until you reconnect), this used to fall
  // through to the DOWNLOAD fallback — so every timer tick silently dropped
  // another file into your Downloads folder, even though you'd picked a
  // folder. The download fallback is only for when no folder was ever chosen.
  if (!autosaveDirHandle && autosaveDirHandlePending) { noticeAutosavePaused(); return false; }
  // Safety: never auto-save an EMPTY library. If storage gets cleared or the
  // database comes up empty/corrupted, the next timer tick used to overwrite
  // the last good snapshot with an empty one — destroying the very file that
  // "Restore from Last Auto-Save" exists to recover from. An empty library has
  // nothing worth protecting, and the old snapshot is worth a great deal.
  if (S.prompts.length === 0) return false;
  const cfg = await getAutosaveSettings();
  const data = { _app:'GIA', _version:2, exportedAt:Date.now(), prompts:S.prompts, categories:S.customCats, _autosave:true };
  const json = JSON.stringify(data, null, 2);

  // Optional XOR encryption — the same lightweight, password-keyed scheme
  // used by the manual "Password-Protected Export" (see xorEncExport). It's
  // not strong cryptography, just obfuscation, same as the rest of the app;
  // the password has to be stored locally so unattended/timer-based
  // auto-saves can run without a prompt each time.
  const encrypting = cfg.encrypt && cfg.password;
  const payload = encrypting ? ('GIA_ENCRYPTED:' + xorEncExport(json, cfg.password)) : json;
  const ext = encrypting ? 'gia' : 'json';
  const baseName = sanitizeFilename(cfg.fileName);

  try {
    if (autosaveDirHandle) {
      let perm = await autosaveDirHandle.queryPermission({ mode: 'readwrite' });
      // requestPermission needs a user gesture; outside one it rejects or
      // returns 'prompt' — either way, treat it as "not granted".
      if (perm !== 'granted') { try { perm = await autosaveDirHandle.requestPermission({ mode: 'readwrite' }); } catch (e) { perm = 'denied'; } }
      if (perm !== 'granted') {
        autosaveDirHandlePending = autosaveDirHandle; autosaveDirHandle = null;
        noticeAutosavePaused();
        return false;
      }

      // Rotating backups: round-robin through N numbered slots instead of
      // always overwriting the same file, so a bad write (or a mistake
      // discovered later) doesn't cost you every earlier snapshot too.
      // The slot index itself is persisted so restore-from-autosave can
      // always find whichever slot was written most recently.
      let fileName;
      if (cfg.rotate) {
        const count = Math.max(1, cfg.rotateCount);
        const prevIdx = await db.getSetting('autosaveRotateIndex');
        const idx = (typeof prevIdx === 'number' ? prevIdx + 1 : 0) % count;
        await db.setSetting('autosaveRotateIndex', idx);
        fileName = `${baseName}_${idx + 1}.${ext}`;
      } else {
        fileName = `${baseName}.${ext}`;
      }

      const fileHandle = await autosaveDirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(payload);
      await writable.close();

      // Reliability #1: integrity check right after writing — read the file
      // back and make sure it matches what we meant to write, instead of
      // only discovering a truncated/corrupted autosave during an
      // emergency restore.
      try {
        const readBack = await (await fileHandle.getFile()).text();
        if (readBack.length !== payload.length) {
          toast(`⚠ Auto-save may be incomplete — wrote ${payload.length} bytes, file shows ${readBack.length}`, 7000);
        } else if (!encrypting) {
          JSON.parse(readBack); // throws if somehow not valid JSON despite matching length
        }
      } catch (verifyErr) {
        toast('⚠ Auto-save file failed a validity check after writing — your folder/disk may be having issues', 7000);
      }
    } else {
      // No folder access available -> fall back to a normal download. The
      // browser can't silently overwrite a prior download, so a timestamp
      // is appended to avoid colliding with the previous auto-save file.
      // (Rotation doesn't apply here — there's no way for the page to prune
      // older downloads from the browser's Downloads folder.)
      const blob = new Blob([payload], { type: encrypting ? 'application/octet-stream' : 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${baseName}_${new Date().toISOString().replace(/[:.TZ]/g,'-').replace(/-+$/,'')}.${ext}`; a.click();
      URL.revokeObjectURL(url);
    }
    await db.setSetting('lastAutosave', Date.now());
    return true;
  } catch (e) { console.error('Auto Save failed', e); toast('⚠ Auto-save failed — see console for details', 5000); return false; }
}

// Locates and reads whichever autosave file was written most recently,
// accounting for rotation. Shared by the startup integrity check and the
// "Restore from Last Auto-Save" flow. Returns { fileName, text } or null.
async function readLatestAutosaveFile(cfg) {
  if (!autosaveDirHandle) return null;
  const baseName = sanitizeFilename(cfg.fileName);
  const encrypting = cfg.encrypt && cfg.password;
  const ext = encrypting ? 'gia' : 'json';
  let fileName;
  if (cfg.rotate) {
    const idx = await db.getSetting('autosaveRotateIndex');
    if (typeof idx !== 'number') return null; // nothing written yet under rotation
    fileName = `${baseName}_${idx + 1}.${ext}`;
  } else {
    fileName = `${baseName}.${ext}`;
  }
  let perm = await autosaveDirHandle.queryPermission({ mode: 'read' });
  if (perm !== 'granted') perm = await autosaveDirHandle.requestPermission({ mode: 'read' });
  if (perm !== 'granted') throw new Error('no read permission on autosave folder');
  const fileHandle = await autosaveDirHandle.getFileHandle(fileName);
  const text = await (await fileHandle.getFile()).text();
  return { fileName, text };
}

// Reliability #1 (startup half): on launch, if a folder is connected and an
// autosave has happened before, quietly verify the most recent snapshot
// still parses — so a corrupted autosave is surfaced early rather than only
// discovered when you actually need to restore from it.
async function checkAutosaveIntegrityOnStartup() {
  if (!autosaveDirHandle) return;
  const cfg = await getAutosaveSettings();
  const lastAuto = await db.getSetting('lastAutosave');
  if (!lastAuto) return;
  try {
    const result = await readLatestAutosaveFile(cfg);
    if (!result) return;
    const check = validateBackupPayload(result.text, cfg.password);
    if (!check.ok && !check.needsPassword) {
      toast(`⚠ Your last auto-save (${result.fileName}) looks corrupted or truncated`, 8000);
    }
  } catch (e) { /* non-fatal — don't bother the user if we simply can't read it */ }
}

function startAutosaveTimer(minutes) {
  if (autosaveIntervalId) clearInterval(autosaveIntervalId);
  autosaveIntervalId = setInterval(() => { performAutoSave(); }, Math.max(1, minutes) * 60000);
}
function stopAutosaveTimer() {
  if (autosaveIntervalId) clearInterval(autosaveIntervalId);
  autosaveIntervalId = null;
}

// Called once on startup: restores the folder handle (if any), starts the
// interval timer if the user left auto-save-on-a-timer enabled, and — if a
// folder was remembered but its permission lapsed (see note above) — asks
// whether to reconnect, via an explicit modal rather than an auto-dismissing
// toast that's easy to miss. Respects the "don't ask again" setting.
async function initAutosave() {
  await loadAutosaveDirHandle();
  const cfg = await getAutosaveSettings();
  if (cfg.enabled && cfg.onInterval) startAutosaveTimer(cfg.intervalMinutes);
  if (cfg.enabled) checkAutosaveIntegrityOnStartup();
  if (cfg.enabled && autosaveDirHandlePending && cfg.reconnectPrompt) {
    showReconnectPromptModal();
  }
}

// Explicit "reconnect now?" dialog, shown automatically on startup when
// applicable (see initAutosave above). Browsers won't let us skip the click
// entirely (see the note on requestPermission's gesture requirement above
// loadAutosaveDirHandle) — this is the honest, non-automatic alternative:
// ask clearly, every time, unless told not to.
function showReconnectPromptModal() {
  const name = autosaveDirHandlePending?.name || 'your auto-save folder';
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal sm">
    <div class="modal-head"><div class="modal-title">Reconnect Auto-Save Folder?</div><button class="modal-x">×</button></div>
    <div class="modal-body">
      <div style="font-size:0.85rem;color:var(--text-secondary)">Your browser needs permission re-confirmed for "<strong>${esc(name)}</strong>" after restarting — this happens automatically on every browser restart, it's not something GIA can prevent. Reconnect now so auto-save can keep writing there?</div>
      <label class="form-check"><input type="checkbox" id="rcp-dont-ask"><label for="rcp-dont-ask">Don't ask again (you can still reconnect anytime from Settings → Auto Save)</label></label>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="rcp-no">Not now</button><button class="btn btn-primary" id="rcp-yes">Reconnect</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close = async () => {
    if (ov.querySelector('#rcp-dont-ask').checked) await db.setSetting('autosaveReconnectPrompt', false);
    ov.remove();
  };
  ov.querySelector('.modal-x').onclick = close;
  ov.querySelector('#rcp-no').onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelector('#rcp-yes').onclick = async () => {
    const dontAsk = ov.querySelector('#rcp-dont-ask').checked;
    if (dontAsk) await db.setSetting('autosaveReconnectPrompt', false);
    const ok = await reconnectAutosaveFolder();
    ov.remove();
    toast(ok ? '✓ Auto-save folder reconnected' : '⚠ Could not reconnect — permission denied');
  };
}

// Called from the prompt-save handler; fires-and-forgets so it never blocks
// the UI from closing the modal.
async function maybeAutosaveAfterPromptSave() {
  const cfg = await getAutosaveSettings();
  if (cfg.enabled && cfg.onPromptSave) await performAutoSave();   // callers that don't need to wait simply don't await this
}

    const reconnectBtn = ov.querySelector('#as-reconnect-folder');

      const ok = await reconnectAutosaveFolder();

    ov.querySelector('#as-password-wrap').style.display = e.target.checked ? '' : 'none';

  ov.querySelector('#as-save').onclick = async () => {
    const enabled = ov.querySelector('#as-enabled').checked;
    const onPromptSave = ov.querySelector('#as-on-save').checked;
    const onInterval = ov.querySelector('#as-on-interval').checked;
    const intervalMinutes = Math.max(1, parseInt(ov.querySelector('#as-interval-minutes').value) || 10);

    const password = ov.querySelector('#as-password').value;
    const rotate = ov.querySelector('#as-rotate').checked;
    const rotateCount = Math.max(2, Math.min(50, parseInt(ov.querySelector('#as-rotate-count').value) || 5));

    await db.setSetting('autosaveEnabled', enabled);
    await db.setSetting('autosaveOnPromptSave', onPromptSave);
    await db.setSetting('autosaveOnInterval', onInterval);
    await db.setSetting('autosaveIntervalMinutes', intervalMinutes);
    await db.setSetting('autosaveFileName', fileName);
    await db.setSetting('autosaveEncrypt', encrypt);
    await db.setSetting('autosavePassword', password);
    await db.setSetting('autosaveRotate', rotate);
    await db.setSetting('autosaveRotateCount', rotateCount);
    const reconnectPromptEl = ov.querySelector('#as-reconnect-prompt');
    if (reconnectPromptEl) await db.setSetting('autosaveReconnectPrompt', reconnectPromptEl.checked);
    if (enabled && onInterval) startAutosaveTimer(intervalMinutes); else stopAutosaveTimer();
    ov.remove();
    toast('✓ Auto Save settings saved');
  };
}

      picker.className = 'overlay'; picker.style.zIndex = '1100';
      picker.innerHTML = `<div class="modal sm" style="width:auto;max-width:90vw;">
        <div class="modal-head"><div class="modal-title">Choose Icon</div><button class="modal-x">×</button></div>
        <div class="modal-body" style="display:grid;grid-template-columns: repeat(5,1fr);gap:0.5rem;padding:1rem">
          ${Object.entries(ICON_SET).map(([key,svg]) => `<button class="icon-option" data-key="${key}" style="background:${key===currentIconKey?'var(--accent-dim)':'transparent'};border:1px solid var(--border);border-radius:0.5rem;padding:0.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.8rem">${svg}</button>`).join('')}
        </div>
      </div>`;
      document.body.appendChild(picker);
      picker.querySelector('.modal-x').onclick = () => picker.remove();
      picker.addEventListener('click', e => { if (e.target === picker) picker.remove(); });
      picker.querySelectorAll('.icon-option').forEach(opt => {
        opt.addEventListener('click', () => {
          newEditor.dataset.iconKey = opt.dataset.key;
          btnIcon.innerHTML = ICON_SET[opt.dataset.key];
          picker.remove();
        });
      });
    });

    newEditor.querySelector('.cat-delete-btn').addEventListener('click', () => {
      if (!confirm('Delete this custom category?')) return;
      deletedCatIds.add(newEditor.dataset.id); // Bugfix
      newEditor.remove();
    });

    const addSubBtn = newEditor.querySelector('.add-sub-btn');
    const newSubInput = newEditor.querySelector('.new-sub-input');
    addSubBtn.addEventListener('click', () => {
      const sub = newSubInput.value.trim();
      if (!sub) return;
      const chip = document.createElement('span');
      chip.style = 'display:inline-flex;align-items:center;gap:0.2857rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:0.2857rem;padding:0.2143rem 0.5714rem;font-size:0.8571rem;';
      chip.innerHTML = `${esc(sub)} <button class="chip-x sub-remove" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;line-height:1;">×</button>`;
      chip.querySelector('.sub-remove').addEventListener('click', () => chip.remove());
      const inputDiv = newSubInput.closest('div');
      inputDiv.parentNode.insertBefore(chip, inputDiv);
      newSubInput.value = '';
    });
    newSubInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); addSubBtn.click(); }
    });
  });

  const saveChanges = async () => {
    const editors = ov.querySelectorAll('.cat-editor');
    const newCustomCats = [];
    const renames = {};

    for (const editor of editors) {
      const id = editor.dataset.id;
      const newName = editor.querySelector('.cat-name-input').value.trim();
      if (!newName) continue;

      const existing = allCats().find(c => c.id === id);
      if (existing && existing.name !== newName) {
        renames[existing.name] = newName;
      }

      const subs = Array.from(editor.querySelectorAll('.subs-list > span'))
        .map(el => (el.childNodes[0]?.textContent || '').trim())
        .filter(Boolean);
      const iconKey = editor.dataset.iconKey || allCats().find(c => c.id === id)?.iconKey || 'other';
      newCustomCats.push({ id, name: newName, iconKey, subs });
    }

    if (Object.keys(renames).length > 0) {
      for (const p of S.prompts) {
        if (p.category && renames[p.category]) {
          p.category = renames[p.category];
          invalidateSearch(p);
          await db.savePrompt(p);
        }
      }
    }

    for (const c of newCustomCats) {
      try { await db.saveCat(c); } catch (err) {
        console.error(err);
        toast('⚠ Failed to save one or more categories.');
        return;
      }
    }
    // Bugfix: actually remove deleted custom categories from IndexedDB,
    // otherwise they reappear on next load.
    for (const id of deletedCatIds) {
      try { await db.deleteCat(id); } catch (err) { console.error(err); }
    }
    S.customCats = newCustomCats;
    renderSidebar();
    renderContent();
  };

  ov.querySelector('#mc-save').onclick = async () => { await saveChanges(); ov.remove(); toast('✓ Categories saved'); };
}

/* ═══════════════════════════════════════════════════
   INIT & EVENT BINDING
   ═══════════════════════════════════════════════════ */
function updateStatus() {
  const dot = document.getElementById('stat-dot'), backupEl = document.getElementById('stat-backup');
  if(S.lastBackup){ backupEl.textContent = `Last backup: ${fmtTime(S.lastBackup)}`; dot.className = 'stat-dot'; }
  else { backupEl.textContent = 'No backup yet — export recommended'; dot.className = 'stat-dot warn'; }
}

function initEvents() {
  initContentDelegation();
  initSidebarDelegation();
  // Perf: debounce search so the full list rebuild only runs once typing
  // pauses (~160ms), instead of on every keystroke.
  const debouncedSearchRender = debounce(() => { resetRenderWindow(); renderContent(); }, 160);
  document.getElementById('search-input').addEventListener('input', e=>{ S.filter.search=e.target.value; S.focusIndex = -1; debouncedSearchRender(); });
  document.getElementById('sb-all').addEventListener('click',()=>{
    setFilter('all',null);
    if (window.innerWidth <= 850) document.getElementById('sidebar').classList.remove('open');
  });
  document.getElementById('sb-fav').addEventListener('click',()=>{
    setFilter('fav',null);
    if (window.innerWidth <= 850) document.getElementById('sidebar').classList.remove('open');
  });
  document.getElementById('sb-used').addEventListener('click',()=>{
    setFilter('used',null);
    if (window.innerWidth <= 850) document.getElementById('sidebar').classList.remove('open');
  });
  document.getElementById('sb-trash').addEventListener('click', () => showTrashModal());
  document.getElementById('btn-add').addEventListener('click', e => newPrompt(e.ctrlKey || e.metaKey ? 'tab' : e.shiftKey ? 'window' : undefined));
  document.getElementById('btn-grid').addEventListener('click',()=>setView('grid'));
  document.getElementById('btn-list').addEventListener('click',()=>setView('list'));
  document.getElementById('sort-select').addEventListener('change', e => { S.sort = e.target.value; db.setSetting('sort', S.sort); resetRenderWindow(); renderContent(); });

  const gear=document.getElementById('btn-settings'), dd=document.getElementById('settings-dd');
  gear.setAttribute('aria-haspopup', 'menu'); gear.setAttribute('aria-expanded', 'false');
  gear.addEventListener('click', e=>{
    e.stopPropagation();
    const opening = dd.style.display === 'none';
    dd.style.display = opening ? 'block' : 'none';
    gear.setAttribute('aria-expanded', String(opening));
    if (opening) dd.querySelector('.dd-item')?.focus(); // so the menu is usable from the keyboard right away
  });
  dd.querySelectorAll('.dd-item').forEach(el=>{ el.addEventListener('click',()=>{ closeSettingsMenu(false); settingsAction(el.dataset.action); }); });
  document.addEventListener('click',()=>{ closeSettingsMenu(false); }); dd.addEventListener('click',e=>e.stopPropagation());

  document.getElementById('det-close').addEventListener('click',closeDetail);
  document.getElementById('btn-fontsize').addEventListener('click', cycleFontSize);
  document.getElementById('btn-hamburger').addEventListener('click', toggleSidebar);

  document.getElementById('tags-toggle').addEventListener('click', () => {
    document.getElementById('tags-cloud').classList.toggle('hidden');
  });

  document.addEventListener('keydown', e=>{
    const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.isContentEditable;
    const settingsDd = document.getElementById('settings-dd');
    const ddOpen = settingsDd.style.display !== 'none';

    if (e.key === 'Escape') {
      const fpOverlay = document.getElementById('fullpage-prompt-overlay');
      if (fpOverlay && fpOverlay.classList.contains('open')) { closeFullpagePrompt(); return; }
      // Bugfix (two problems): this used to remove the FIRST overlay in the
      // document — i.e. the BOTTOM of a stack, so Esc over a dialog-on-a-dialog
      // closed the wrong one — and it removed it directly, skipping that
      // dialog's own cleanup. The New Prompt dialog registers a document-level
      // Ctrl+S handler that only its close() removes, so abandoning a
      // half-typed prompt with Esc left it live, and the next unrelated Ctrl+S
      // quietly SAVED the abandoned draft as a real prompt.
      const top = topOverlay();
      if (top) { if (top._close) top._close(); else top.remove(); return; }
      // Bugfix: Esc should dismiss the TOP-most layer first. The detail panel
      // used to be checked before the settings menu, so Esc with both open
      // closed the panel behind the menu and left the menu hanging open.
      if (ddOpen) { closeSettingsMenu(true); return; }
      if (S.selectedId) { closeDetail(); return; }
    }

    if (STANDALONE) return;   // a standalone tab/window has no library shortcuts

    // Settings menu keyboard support: arrows/Home/End move between items
    // (Enter/Space activate the focused button natively), Tab closes it.
    if (ddOpen) {
      const items = [...settingsDd.querySelectorAll('.dd-item')];
      const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); return; }
      if (e.key === 'Home')      { e.preventDefault(); items[0].focus(); return; }
      if (e.key === 'End')       { e.preventDefault(); items[items.length - 1].focus(); return; }
      if (e.key === 'Tab')       { closeSettingsMenu(false); }
    }

    // Reader: ← / → step through prompts while the reader is the top dialog.
    if (reader && reader.el.isConnected && topOverlay() === reader.el && !isInput) {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); readerStep(-1); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); readerStep(1);  return; }
    }

    // Bugfix: these shortcuts used to fire even while a modal was open (as
    // long as focus wasn't literally inside a text field), so e.g. pressing
    // N while the Trash modal was open would stack a New Prompt modal on
    // top of it, and Delete would delete whatever card had keyboard focus
    // on the (hidden, background) grid. Guard against any open overlay —
    // and, likewise, an open settings menu (Backspace with the menu open
    // used to trash a prompt hidden behind it).
    const modalOpen = ddOpen || !!document.querySelector('.overlay') || document.getElementById('fullpage-prompt-overlay').classList.contains('open');
    if (!isInput && !modalOpen) {
      if (e.key === 'n' || e.key === 'N') { newPrompt(); return; }
      if (e.key === '/') { e.preventDefault(); document.getElementById('search-input').focus(); return; }
      if (e.key === '?') { e.preventDefault(); showShortcutsModal(); return; }
      if (e.key === 'g' || e.key === 'G') { setView('grid'); return; }
      if (e.key === 'l' || e.key === 'L') { setView('list'); return; }
      // QOL #3: keyboard navigation across the grid/list
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); moveKbdFocus(1); return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); moveKbdFocus(-1); return; }
      // Bugfix: Enter used to be cancelled unconditionally, which also
      // cancelled the browser's own "Enter activates the focused button" —
      // so Tab-ing to New Prompt, the theme toggle, etc. and pressing Enter
      // did nothing. Only treat Enter as "open the focused prompt" when it
      // isn't aimed at a button or link.
      if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button, a, summary, [role="button"], [role="menuitem"]'))) { e.preventDefault(); openFocusedPrompt(); return; }
      // Space = "quick look": open the focused prompt in the reader (as long as
      // it isn't aimed at a button, where Space already means "press it").
      if (e.key === ' ' && S.focusIndex >= 0 && !(e.target.closest && e.target.closest('button, a, summary, [role="button"], [role="menuitem"]'))) {
        e.preventDefault(); const fp = filteredPrompts()[S.focusIndex]; if (fp) openPromptDefault(fp.id); return;
      }
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteFocusedPrompt(); return; }
    }

    if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
      e.preventDefault();
      showBackupModal();
    }
  });

  window.addEventListener('resize', () => { applyPinState(); });

  let dragCount=0;
  document.addEventListener('dragenter',e=>{ e.preventDefault(); dragCount++; document.getElementById('drop-zone').classList.add('show'); });
  document.addEventListener('dragleave',()=>{ dragCount--; if(dragCount<=0){dragCount=0;document.getElementById('drop-zone').classList.remove('show');} });
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',e=>{
    e.preventDefault(); dragCount=0; document.getElementById('drop-zone').classList.remove('show');
    const f=e.dataTransfer.files[0];
    if(f&&(f.name.endsWith('.json')||f.name.endsWith('.gia'))) doImport(f);
    else toast('⚠ Please drop a .json or .gia GIA backup file');
  });
}

// One-time repair for records stored under an id that fails SAFE_ID (only
// possible via a hand-crafted import into an older version). The prompt keeps
// all its content; only its key changes.
async function rekeyUnsafeIds() {
  for (const p of S.prompts) {
    if (SAFE_ID.test(p.id)) continue;
    const oldId = p.id;
    p.id = uid();
    await db.savePrompt(p);
    await db._del(S_PROMPTS, oldId);
  }
}
async function init() {
  try {
    await db.init();
    S.prompts = await db.getAllPrompts();
    await rekeyUnsafeIds();
    S.customCats = await db.getAllCats();
    S.lastBackup = await db.getSetting('lastBackup');
    S.sort = await db.getSetting('sort') || 'newest';
    document.getElementById('sort-select').value = S.sort;
    await initTheme();
    await initAccentTheme();
    S.uiFont = await db.getSetting('uiFont') || 'Outfit';
    S.monoFont = await db.getSetting('monoFont') || 'JetBrains Mono';
    S.fontSize = await db.getSetting('fontSize') || '14px';
    S.openExisting = sanitizeOpenMode(await db.getSetting('openExisting'));
    S.openNew = sanitizeOpenMode(await db.getSetting('openNew'));
    applyFontSettings();
    if (STANDALONE) enterSoloMode();
    setView('grid');
    renderSidebar();
    renderContent();
    updateStatus();
    initEvents();
    await initPin();
    initSidebarHoverReveal();
    // A standalone tab only loads the folder handle (so saving an edit there can
    // still auto-save). It does NOT start timers, run the integrity check or
    // show the reconnect prompt: the library window owns all of that, and a
    // pop-up must not nag or double up on background work.
    if (STANDALONE) { await loadAutosaveDirHandle(); }
    else { await initAutosave(); purgeExpiredTrash(); /* not awaited — don't delay first paint */ }
    initCrossTabConflictWarning();
    // Changing the address between "library" and "one prompt" (back/forward,
    // pasting a link) is handled by a reload, which boots straight into the
    // right mode.
    window.addEventListener('hashchange', () => { if (parseRoute() !== BOOT_ROUTE) reloadPage(); });
    // The New Prompt page IS the editor: open it straight away, full-window.
    if (NEW_MODE) promptModal(null, { standalone: true });
    document.getElementById('stat-version').textContent = `GIA v${APP_VERSION}`;
  } catch(err) {
    document.body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:0.7143rem;font-family:monospace;color:#f06b6b"><div style="font-size:1.2857rem">⚠ GIA failed to initialize</div><div style="font-size:0.8571rem;color:#666">${err.message}</div><div style="font-size:0.7857rem;color:#444">IndexedDB may be unavailable in private/incognito mode</div></div>`;
  }
}

// Start the application
init();
</script>
